# =============================================================================
# EruoFood AI — Local development overrides (auto-loaded by `docker compose`).
# Adds bind mounts, hot reload, exposed dev ports, and dev-only tooling
# (Vite dev server, Mailpit, MinIO console). Not used in production.
# =============================================================================

services:
  # Bind-mount source for live code, enable OPcache timestamp validation in dev
  api:
    build:
      args:
        UID: ${UID:-1000}
        GID: ${GID:-1000}
    volumes:
      - ./apps/api:/var/www/html
    environment:
      APP_DEBUG: "true"
    ports:
      - "${API_FPM_PORT:-9000}:9000"

  worker:
    volumes:
      - ./apps/api:/var/www/html

  scheduler:
    volumes:
      - ./apps/api:/var/www/html

  # Vite dev server with hot module replacement for the web app
  web:
    image: node:${NODE_IMAGE_TAG:-22-alpine}
    working_dir: /app
    command: ["sh", "-c", "npm install && npm run dev -- --host 0.0.0.0"]
    volumes:
      - ./apps/web:/app
      - web_node_modules:/app/node_modules
    ports:
      - "${WEB_DEV_PORT:-5173}:5173"
    networks: [eruofood]

  postgres:
    ports:
      - "${POSTGRES_PORT:-5432}:5432"

  redis:
    ports:
      - "${REDIS_PORT:-6379}:6379"

  minio:
    ports:
      - "${MINIO_API_PORT:-9000}:9000"
      - "${MINIO_CONSOLE_PORT:-9001}:9001"

  # Local mail catcher — captures outbound email during development
  mailpit:
    # M50-18(b). Development-only (this override never loads in CI or production),
    # so the risk was low — but `:latest` is banned repository-wide rather than
    # per-file, because an exception that has to be re-argued at each site is how
    # one of them stays. `v1.31.1` is the release `:latest` already pointed at
    # (both digest sha256:98b916bd3c8d61f7633a52d3ea2f58d00620cb01ca57ab59edde68c347a95365).
    image: axllent/mailpit:v1.31.1
    ports:
      - "${MAILPIT_SMTP_PORT:-1025}:1025"
      - "${MAILPIT_UI_PORT:-8025}:8025"
    networks: [eruofood]
    restart: unless-stopped

volumes:
  web_node_modules:
