name: CI · Security

on:
  push:
    branches: [main, develop]
  pull_request:
  schedule:
    - cron: "0 3 * * 1" # weekly DAST/dep sweep (Mondays 03:00 UTC)

# Least privilege (M46). Every job here checks out the repository and runs
# build/test tooling; none writes to the repository, publishes a package,
# comments on a pull request or calls the GitHub API. `contents: read` is
# therefore the whole requirement.
#
# Declaring it matters even where the repository's default is already
# read-only: that default is live GitHub state, invisible to this repository
# and reversible by an administrator toggle, at which point every job that
# installs third-party dependencies would receive a write-scoped token with
# nothing here to notice. Stated in the workflow, it cannot drift.
permissions:
  contents: read

concurrency:
  group: security-${{ github.ref }}
  cancel-in-progress: true

jobs:
  secret-scan:
    name: Secret scanning
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Gitleaks
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  dependency-audit:
    name: Dependency audit
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: npm audit (web)
        working-directory: apps/web
        # M45. This carried `|| true` from the day it was written, so the
        # required `Dependency audit` context could not fail on a dependency
        # vulnerability — the one thing it exists to catch. At M44 the tree it
        # was silently passing held 11 advisories, 2 of them critical.
        #
        # The threshold is unchanged: HIGH and CRITICAL fail, moderate and below
        # do not. That is the repository's existing policy, the same flag
        # `release.yml` uses, and it is not relaxed here to make anything green —
        # `npm audit` reports zero vulnerabilities at every severity as of M45.
        #
        # No `npm ci` first, deliberately. `npm audit` resolves the advisory set
        # from package-lock.json alone; installing would add a minute to a job
        # whose answer does not depend on it. Verified both ways in M45: this
        # command exits 1 against the pre-M45 lockfile with no node_modules
        # present, so its passing is a fact about the lockfile, not an artefact
        # of an empty tree.
        #
        # Wrapped since M48. The audit policy below is unchanged and is stated
        # here rather than inside the wrapper on purpose: this line is what
        # `verify_dependency_audit_gate.py` reads and what M45's mutation tests
        # anchor on, so a threshold cannot be lowered somewhere less visible.
        #
        # The wrapper exists because on 2026-09-04 this step went red on
        # `npm error audit endpoint returned an error` — a 503 from npm's
        # advisory service against a lockfile with zero advisories. It retries a
        # *transient* outage a bounded number of times and, if evidence still
        # cannot be obtained, exits 3: UNAVAILABLE is a failure, not a pass. It
        # is also strictly faster than not having it, because it disables npm's
        # own multi-minute internal retry storm in favour of a hard bound.
        run: ${{ github.workspace }}/.github/scripts/npm_audit_resilient.sh npm audit --audit-level=high

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: "8.4"
          tools: composer:v2
      - name: composer audit (api)
        working-directory: apps/api
        # M45, and `--locked` is the load-bearing part.
        #
        # This step had two independent defects, and the second is the sharper
        # one. `|| true` masked the exit status — but there is no
        # `composer install` in this job, and without `vendor/` a bare
        # `composer audit` prints "No packages - skipping audit." and exits 0.
        # So even with the mask removed it would have audited nothing and passed
        # for it: a green tick reporting on work that never happened, which is
        # the M44 staging-deploy defect reproduced inside the security gate.
        #
        # `--locked` audits composer.lock directly, which needs no install and
        # is what we actually want to gate on. Verified in M45: it exits 1
        # against the pre-M45 lockfile with no vendor/ present.
        #
        # No severity filter, unlike npm above. `release.yml` and
        # `ga-release-certification.yml` both run a bare `composer audit`, so
        # matching them here makes this pull-request gate a faithful preview of
        # the release gates rather than a laxer one that defers the bad news to
        # tag time. There are zero advisories at any severity as of M45.
        #
        # Wrapped in Phase 1, for the reason npm was wrapped in M48: Packagist
        # is a third party and it has bad days. Observed live while preparing
        # this: `curl error 28 while downloading
        # https://packagist.org/api/security-advisories/: Connection timed out`.
        #
        # Composer makes the same mistake npm does and one of its own: 0 is
        # clean, 1 is advisories found, and 100 is a generic error that is NEVER
        # a verdict but which "non-zero means bad" reports as a vulnerability.
        # The wrapper separates the three, retries only the transient class
        # within a hard bound, and exits 3 for UNAVAILABLE — a failure, not a
        # pass. `--locked` stays here, where M45's mutation tests anchor on it.
        run: ${{ github.workspace }}/.github/scripts/composer_audit_resilient.sh composer audit --locked
