name: CI · API (Laravel)

on:
  push:
    branches: [main, develop]
    paths: ["apps/api/**", ".github/workflows/ci-api.yml"]
  # No `paths:` here, deliberately (M29-A).
  #
  # GitHub treats a required status check that never reports as PENDING, not as
  # satisfied. Filtering `pull_request` by path meant this workflow stayed
  # silent on unrelated pull requests — so the moment its job became a required
  # check, every such pull request would wait for a conclusion that was never
  # coming. A gate that blocks everything is as broken as one that blocks
  # nothing; it just fails in the other direction.
  #
  # Pest, PHPStan, migrations, Redis and the financial concurrency gate do not
  # depend on which files a pull request touched.
  # Running it always costs a little CI time and buys a check that can actually
  # be required. `push` below stays filtered, so post-merge runs remain narrow.
  #
  # See .github/governance/required-checks.json.
  pull_request:

  # Manually runnable (M44).
  #
  # The `push` filter above is correct and stays: post-merge runs should be
  # narrow. But it has a consequence nobody had to confront until M44's
  # post-merge verification asked for it. A merge that touches no path in that
  # filter produces no run of this workflow at the merge commit — so
  # `Tests · SQLite` and `Lint · Analyse · Test`, both REQUIRED contexts, have
  # no conclusion on `main` at that SHA. Not red: absent.
  #
  # That is fine for merge protection, which is evaluated on the pull request,
  # and it is not fine for anyone who needs to state, with evidence, that the
  # required contexts pass on `main` as it now stands. Their only options were
  # to push an empty-ish commit touching a filtered path, or to infer the
  # result from the pull request run — a different tree.
  #
  # `workflow_dispatch` is the narrow fix: the same jobs, unchanged, runnable
  # on demand against any ref. It adds no inputs (nothing here varies per run,
  # and an input spliced into a `run:` block is the injection surface M44 spent
  # its time removing), grants no permissions, and changes nothing about how
  # this workflow behaves on `push` or `pull_request`.
  #
  # One property to know before relying on it: `concurrency` below groups by
  # `github.ref`, so a dispatch on `main` and a `push` run on `main` share a
  # group and the newer cancels the older. Dispatch when the branch is quiet,
  # or re-dispatch — a cancelled run is not a passing one.
  workflow_dispatch:

# Least privilege (M46). Every job here checks out the repository and runs
# build/test tooling; none writes to the repository, publishes a package,
# comments on a pull request or calls the GitHub API. `contents: read` is
# therefore the whole requirement.
#
# Declaring it matters even where the repository's default is already
# read-only: that default is live GitHub state, invisible to this repository
# and reversible by an administrator toggle, at which point every job that
# installs third-party dependencies would receive a write-scoped token with
# nothing here to notice. Stated in the workflow, it cannot drift.
permissions:
  contents: read

concurrency:
  group: ci-api-${{ github.ref }}
  cancel-in-progress: true

defaults:
  run:
    working-directory: apps/api

# Two required gates, deliberately on different engines.
#
# `sqlite` is the engine developers run locally, so it has to stay green or the
# fast feedback loop stops being trustworthy.
#
# `quality` runs the same suite on PostgreSQL 16 — the engine production
# actually uses. M24 made the case for this being automated rather than manual:
# several real defects (a uuid column that could not hold a system actor name, a
# transaction aborted by a constraint violation, a unique index that never
# fired) passed cleanly on SQLite and failed only on PostgreSQL. A gate that a
# person has to remember to run is not a gate.
jobs:
  sqlite:
    name: Tests · SQLite
    runs-on: ubuntu-latest
    timeout-minutes: 15

    # SQLite replaces the *database*, not every backing service. The readiness
    # endpoint reports on each dependency it can reach, and Redis is one of
    # them, so the suite needs a real Redis here too. Stubbing or skipping that
    # test would remove the only check that the readiness probe tells the truth.
    services:
      redis:
        image: redis:7
        ports: ["6379:6379"]
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s --health-timeout 5s --health-retries 5

    env:
      # Explicit rather than inherited from phpunit.xml. An exported
      # DB_CONNECTION takes precedence over the <env> block there, so stating it
      # here is what makes this job's engine a fact rather than a side effect.
      DB_CONNECTION: sqlite
      DB_DATABASE: ":memory:"
      REDIS_HOST: 127.0.0.1
      REDIS_PORT: 6379

    steps:
      - uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: "8.4"
          extensions: pdo_sqlite, sqlite3, redis, intl, zip, bcmath, pcntl
          coverage: none
          tools: composer:v2

      - name: Cache Composer packages
        uses: actions/cache@v4
        with:
          path: apps/api/vendor
          key: composer-${{ runner.os }}-${{ hashFiles('apps/api/composer.lock') }}
          restore-keys: composer-${{ runner.os }}-

      - name: Install dependencies
        run: composer install --prefer-dist --no-interaction --no-progress

      - name: Copy environment
        run: cp .env.example .env && php artisan key:generate

      - name: Confirm this job is running on SQLite
        run: |
          ENGINE=$(php artisan tinker --execute="echo DB::connection()->getDriverName();" | tr -d '[:space:]')
          echo "Database engine: ${ENGINE}"
          if [ "${ENGINE}" != "sqlite" ]; then
            echo "::error::Expected sqlite, got '${ENGINE}'. This job must exercise the fast local engine."
            exit 1
          fi

      - name: Tests (Pest) on SQLite
        run: vendor/bin/pest

  quality:
    # Name deliberately unchanged. GitHub matches required status checks on this
    # string, so renaming it would silently detach an existing branch-protection
    # rule — which is a worse outcome than a name that undersells what the job
    # does. The engine is enforced by the guard step below, not by the label.
    name: Lint · Analyse · Test
    runs-on: ubuntu-latest
    timeout-minutes: 30

    # Production-representative backing services.
    services:
      postgres:
        # M38-VECTOR-001: the same postgres:16 with pgvector compiled in, so
        # the Search acceleration migration provisions a real extension in CI
        # instead of silently skipping it. A drop-in for the stock image — the
        # server, version and configuration are otherwise identical.
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: eruofood
          POSTGRES_PASSWORD: eruofood
          POSTGRES_DB: eruofood_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U eruofood"
          --health-interval 10s --health-timeout 5s --health-retries 5
      redis:
        image: redis:7
        ports: ["6379:6379"]
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s --health-timeout 5s --health-retries 5

    env:
      DB_CONNECTION: pgsql
      DB_HOST: 127.0.0.1
      DB_PORT: 5432
      DB_DATABASE: eruofood_test
      DB_USERNAME: eruofood
      DB_PASSWORD: eruofood
      REDIS_HOST: 127.0.0.1
      REDIS_PORT: 6379
      CACHE_STORE: redis

    steps:
      - uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: "8.4"
          extensions: pdo_pgsql, redis, intl, zip, bcmath, pcntl
          coverage: xdebug
          tools: composer:v2

      - name: Cache Composer packages
        uses: actions/cache@v4
        with:
          path: apps/api/vendor
          key: composer-${{ runner.os }}-${{ hashFiles('apps/api/composer.lock') }}
          restore-keys: composer-${{ runner.os }}-

      - name: Install dependencies
        run: composer install --prefer-dist --no-interaction --no-progress

      - name: Copy environment
        run: cp .env.example .env && php artisan key:generate

      # M28. The committed development template, judged by the same policy a
      # deploy is judged by. This is the gate that would have caught M27's CI
      # failure on the day it was introduced: `.env.example` set APP_ENV=local
      # and pinned no provider, so `payments.default` resolved to a live
      # gateway and the concurrency harness attempted real bank transfers.
      - name: Environment separation and financial safety configuration
        run: php artisan ops:verify-environment

      - name: Coding standards (Pint)
        run: composer run lint

      - name: Static analysis (PHPStan/Larastan)
        run: composer run analyse

      # The guard that makes this a real gate. The Pest run picks up its engine
      # from the exported DB_CONNECTION above, which silently overrides the
      # sqlite setting in phpunit.xml. If that env block were ever removed or
      # renamed, the suite would quietly fall back to SQLite and keep passing —
      # and the PostgreSQL-only defects this job exists to catch would be
      # invisible again. Failing loudly here is cheaper than trusting it.
      - name: Confirm the suite will run against PostgreSQL 16
        run: |
          ENGINE=$(php artisan tinker --execute="echo DB::connection()->getDriverName();" | tr -d '[:space:]')
          VERSION=$(php artisan tinker --execute="echo DB::connection()->getPdo()->getAttribute(PDO::ATTR_SERVER_VERSION);" | tr -d '[:space:]')
          echo "Database engine: ${ENGINE} ${VERSION}"
          if [ "${ENGINE}" != "pgsql" ]; then
            echo "::error::Expected pgsql, got '${ENGINE}'. The PostgreSQL gate is not actually testing PostgreSQL."
            exit 1
          fi
          case "${VERSION}" in
            16.*) ;;
            *) echo "::error::Expected PostgreSQL 16, got '${VERSION}'."; exit 1 ;;
          esac

      - name: Tests (Pest) on PostgreSQL with coverage
        run: vendor/bin/pest --coverage --coverage-clover=coverage.xml

      - name: Database — migrate from an empty PostgreSQL database
        run: |
          php artisan migrate:fresh --force
          php artisan migrate:rollback --force
          php artisan migrate --force

      - name: Redis — validate rate limiting, quotas, counters, cache
        run: php scripts/redis_validation.php

      # M23. Real OS processes racing on real PostgreSQL rows. The Pest suite
      # cannot cover this: RefreshDatabase wraps each test in a transaction, so
      # no second connection ever sees the contention.
      - name: Financial concurrency — locking, atomicity and idempotency
        # PAYMENTS_PROVIDER is pinned to the offline mock. `.env.example` sets
        # APP_ENV=local, under which payments.default resolves to a *live*
        # provider — so this harness was attempting real bank transfers and
        # reporting the resulting failures as concurrency defects. The script
        # now refuses to start against a live provider; this makes the intent
        # explicit rather than relying on that refusal.
        env:
          PAYMENTS_PROVIDER: mock
        run: |
          php artisan migrate:fresh --force
          php scripts/financial_concurrency_validation.php

      - name: Upload coverage
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: api-coverage
          path: apps/api/coverage.xml
