name: CI · API (Laravel)

on:
  push:
    branches: [main, develop]
    paths: ["apps/api/**", ".github/workflows/ci-api.yml"]
  pull_request:
    paths: ["apps/api/**", ".github/workflows/ci-api.yml"]

concurrency:
  group: ci-api-${{ github.ref }}
  cancel-in-progress: true

defaults:
  run:
    working-directory: apps/api

jobs:
  quality:
    name: Lint · Analyse · Test
    runs-on: ubuntu-latest

    # Production-representative backing services.
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: eruofood
          POSTGRES_PASSWORD: eruofood
          POSTGRES_DB: eruofood_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U eruofood"
          --health-interval 10s --health-timeout 5s --health-retries 5
      redis:
        image: redis:7
        ports: ["6379:6379"]
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s --health-timeout 5s --health-retries 5

    env:
      DB_CONNECTION: pgsql
      DB_HOST: 127.0.0.1
      DB_PORT: 5432
      DB_DATABASE: eruofood_test
      DB_USERNAME: eruofood
      DB_PASSWORD: eruofood
      REDIS_HOST: 127.0.0.1
      REDIS_PORT: 6379
      CACHE_STORE: redis

    steps:
      - uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: "8.4"
          extensions: pdo_pgsql, redis, intl, zip, bcmath, pcntl
          coverage: xdebug
          tools: composer:v2

      - name: Cache Composer packages
        uses: actions/cache@v4
        with:
          path: apps/api/vendor
          key: composer-${{ runner.os }}-${{ hashFiles('apps/api/composer.lock') }}
          restore-keys: composer-${{ runner.os }}-

      - name: Install dependencies
        run: composer install --prefer-dist --no-interaction --no-progress

      - name: Copy environment
        run: cp .env.example .env && php artisan key:generate

      - name: Coding standards (Pint)
        run: composer run lint

      - name: Static analysis (PHPStan/Larastan)
        run: composer run analyse

      - name: Tests (Pest) with coverage
        run: vendor/bin/pest --coverage --coverage-clover=coverage.xml

      - name: Database — migrate from an empty PostgreSQL database
        run: |
          php artisan migrate:fresh --force
          php artisan migrate:rollback --force
          php artisan migrate --force

      - name: Redis — validate rate limiting, quotas, counters, cache
        run: php scripts/redis_validation.php

      - name: Upload coverage
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: api-coverage
          path: apps/api/coverage.xml
