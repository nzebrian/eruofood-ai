name: GA Docker Certification

# Boots the ENTIRE stack from a clean CI runner (no pre-existing volumes, images,
# or application state), migrates from zero, runs the backend/PostgreSQL/Redis
# integration suites and OpenAPI validation, smoke-tests the live endpoints,
# captures container logs on failure, and tears everything down cleanly.
#
# This is the executable form of "full Docker clean-environment boot". It is
# READY TO EXECUTE on GitHub-hosted runners (which have registry access); it does
# not run inside the Claude sandbox, whose container registry is blocked.

on:
  workflow_dispatch:
  push:
    branches: [main, develop]
    paths:
      - "docker-compose.yml"
      - "docker-compose.ci.yml"
      - "docker-compose.override.yml"
      - "infra/**"
      - "apps/api/**"
      - "apps/web/**"
      - "packages/api-contracts/**"
      - ".github/workflows/ga-docker-certification.yml"
  workflow_call: {}   # allow the consolidated release-certification workflow to invoke this

concurrency:
  group: ga-docker-${{ github.ref }}
  cancel-in-progress: true

jobs:
  certify:
    name: Clean-env build · boot · migrate · integrate · smoke
    runs-on: ubuntu-latest
    timeout-minutes: 40
    env:
      COMPOSE_PROJECT_NAME: gacert
      NGINX_HTTP_PORT: "8080"
      # Compose the production-shaped base + CI overlay EXPLICITLY (no dev
      # override auto-load, so the image's baked vendor/ is never shadowed by a
      # bind mount). Runtime env (incl. a throwaway APP_KEY) comes from the CI
      # overlay, so no host .env and no in-container key:generate are needed.
      COMPOSE_FILE: docker-compose.yml:docker-compose.ci.yml
    steps:
      - uses: actions/checkout@v4

      - name: Show Docker + Compose versions
        run: docker version && docker compose version

      - name: Ensure NO cached volumes/state (clean env)
        run: |
          docker compose -p gacert down -v --remove-orphans || true
          docker volume ls

      - name: Validate compose configuration
        run: docker compose config >/dev/null && echo "compose config valid"

      - name: Build ALL images from a clean context
        run: docker compose build --no-cache

      - name: Boot the full stack (fresh PostgreSQL + Redis + MinIO)
        run: docker compose up -d --wait --wait-timeout 180

      - name: Wait for service health
        run: |
          for i in $(seq 1 60); do
            bad=$(docker compose ps --format '{{.Name}} {{.Health}}' | grep -E 'starting|unhealthy' || true)
            [ -z "$bad" ] && { echo "all healthy"; break; }
            echo "waiting: $bad"; sleep 5
          done
          docker compose ps

      - name: Migrate from ZERO + bootstrap
        run: |
          docker compose exec -T api php artisan migrate --force
          docker compose exec -T api php artisan migrate:status
          docker compose exec -T api php artisan db:seed --force || echo "seed optional"

      - name: Confirm workers + scheduler are running
        run: |
          docker compose ps worker scheduler
          docker compose exec -T api php artisan about | head -40

      - name: Health + readiness checks (nginx → Laravel)
        run: |
          curl -fsS http://localhost:8080/api/v1/health | tee /tmp/health.json
          curl -fsS http://localhost:8080/api/v1/ready  | tee /tmp/ready.json
          grep -q '"status":"ok"'    /tmp/health.json
          grep -q '"status":"ready"' /tmp/ready.json

      # The Pest unit/feature suite is intentionally NOT run inside the container.
      # This job certifies the PRODUCTION image, built with `composer install
      # --no-dev` (Pest is a require-dev package and is absent by design — shipping
      # dev tooling to prod would be the real defect). The full suite is already a
      # blocking gate on the host, with dev dependencies installed, in ci-api.yml
      # (every PR, on PostgreSQL 16 + Redis 7) and release.yml (on a version tag).
      # What this cert proves instead is that the built artifact BOOTS and SERVES:
      # migrations from zero, PostgreSQL + Redis integration, OpenAPI, health/
      # readiness, public-API smoke, and restart-recovery — all below.

      - name: PostgreSQL integration — fresh migrate/rollback/re-migrate
        run: |
          docker compose exec -T api php artisan migrate:fresh --force
          docker compose exec -T api php artisan migrate:rollback --force
          docker compose exec -T api php artisan migrate --force

      - name: Redis integration — rate limit / quota / idempotency / counters
        run: docker compose exec -T api php scripts/redis_validation.php

      - name: OpenAPI validation (redocly)
        run: npx --yes @redocly/cli@1 lint packages/api-contracts/openapi.yaml

      - name: Public API smoke tests
        run: |
          curl -fsS http://localhost:8080/api/public/v1/status
          # register → login round-trip proves the app + DB + Redis path end to end
          curl -fsS -X POST http://localhost:8080/api/v1/auth/register \
            -H 'Content-Type: application/json' \
            -d '{"name":"CI Smoke","email":"ci-smoke@example.com","password":"Password123","password_confirmation":"Password123"}' \
            | grep -q '"access_token"' && echo "auth smoke OK"

      - name: Restart-recovery (workers/scheduler/api reconnect)
        run: |
          docker compose restart worker scheduler api

          # After the restart, nginx's php_fpm upstream returns 502 until php-fpm
          # inside the api container finishes booting. Poll health until it
          # recovers rather than guessing a fixed sleep; the bound keeps a genuine
          # restart failure fatal, and the on-timeout dump distinguishes a real
          # failure from a startup race. (Full logs are also captured by the
          # failure step below.)
          deadline=$((SECONDS + 120))
          until curl -fsS http://localhost:8080/api/v1/health -o /tmp/health-recover.json; do
            if [ "$SECONDS" -ge "$deadline" ]; then
              echo "::error::API did not recover within 120s after restart"
              docker compose ps
              docker compose logs --no-color --tail=120 api nginx worker scheduler
              exit 1
            fi
            echo "waiting for API to recover after restart... (${SECONDS}s elapsed)"
            sleep 3
          done
          echo "API recovered after restart:"; cat /tmp/health-recover.json

      - name: Capture container logs on failure
        if: failure()
        run: |
          mkdir -p logs
          for svc in $(docker compose ps --services); do
            docker compose logs --no-color "$svc" > "logs/$svc.log" 2>&1 || true
          done
          docker compose ps > logs/ps.txt || true

      - name: Upload logs artifact
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: ga-docker-logs
          path: logs/

      - name: Clean teardown (remove volumes — no state persists)
        if: always()
        run: docker compose -p gacert down -v --remove-orphans
