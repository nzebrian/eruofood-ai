name: CI · Web (React)

on:
  push:
    branches: [main, develop]
    paths: ["apps/web/**", "packages/api-contracts/**", ".github/workflows/ci-web.yml"]
  # No `paths:` here, deliberately (M29-A).
  #
  # GitHub treats a required status check that never reports as PENDING, not as
  # satisfied. Filtering `pull_request` by path meant this workflow stayed
  # silent on unrelated pull requests — so the moment its job became a required
  # check, every such pull request would wait for a conclusion that was never
  # coming. A gate that blocks everything is as broken as one that blocks
  # nothing; it just fails in the other direction.
  #
  # ESLint, tsc, Vitest and the production build do not depend on which files a
  # pull request touched. The job ran in ~36s on PR #21.
  # Running it always costs a little CI time and buys a check that can actually
  # be required. `push` below stays filtered, so post-merge runs remain narrow.
  #
  # See .github/governance/required-checks.json.
  pull_request:

  # Manually runnable (M44). See the long note in `ci-api.yml` for the full
  # reasoning; the short form is that the `push` filter above — which stays —
  # means a merge touching none of those paths leaves
  # `Lint · Typecheck · Test · Build`, a REQUIRED context, with no conclusion
  # on `main` at that commit. Absent, not red. This makes the same job runnable
  # on demand so that state can be established from an actual run rather than
  # inferred from the pull request's.
  #
  # No inputs, no added permissions, and no change to `push` or `pull_request`
  # behaviour. `concurrency` below groups by `github.ref`, so a dispatch on
  # `main` and a push run on `main` cancel one another; a cancelled run is not
  # a passing one.
  workflow_dispatch:

# Least privilege (M46). Every job here checks out the repository and runs
# build/test tooling; none writes to the repository, publishes a package,
# comments on a pull request or calls the GitHub API. `contents: read` is
# therefore the whole requirement.
#
# Declaring it matters even where the repository's default is already
# read-only: that default is live GitHub state, invisible to this repository
# and reversible by an administrator toggle, at which point every job that
# installs third-party dependencies would receive a write-scoped token with
# nothing here to notice. Stated in the workflow, it cannot drift.
permissions:
  contents: read

concurrency:
  group: ci-web-${{ github.ref }}
  cancel-in-progress: true

defaults:
  run:
    working-directory: apps/web

jobs:
  quality:
    name: Lint · Typecheck · Test · Build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      # npm network policy (Phase 1). npm's defaults are fetch-retries=2 with
      # fetch-retry-maxtimeout=60000, serialised across every request an install
      # makes — which is how one `npm audit` burned 7m01s on 2026-09-04. Retry
      # stays ON here, because a dropped request mid-install is common and cheap
      # to retry; what changes is the per-retry ceiling, from 60s to 20s. A
      # healthy install is unaffected; the tail is bounded.
      npm_config_fetch_retries: "2"
      npm_config_fetch_retry_mintimeout: "1000"
      npm_config_fetch_retry_maxtimeout: "20000"
      npm_config_fetch_timeout: "60000"
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: apps/web/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Lint (ESLint)
        run: npm run lint

      - name: Typecheck (tsc)
        run: npm run typecheck

      - name: Test (Vitest) with coverage
        run: npm run test:coverage

      - name: Build (Vite)
        run: npm run build
