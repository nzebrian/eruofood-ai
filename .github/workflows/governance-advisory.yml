name: Governance Advisory

# Asks GitHub what it is actually enforcing, and compares the answer with what
# this repository claims.
#
# Every other governance check in this repository reads files. That is the
# limitation M29-A was built around: `.github/CODEOWNERS` named six teams for
# months, every one of them unresolvable, and no amount of reading the file
# could have revealed it. Only GitHub knew. Until now nothing asked GitHub.
#
# ## Advisory means not required. It does not mean incapable of failing.
#
# This job is absent from the `main` ruleset, so a red run blocks no merge. It
# is NOT wrapped in continue-on-error, `|| true`, or a forced exit 0 — a job
# that cannot go red is indistinguishable from a job that checks nothing, which
# is the failure mode this entire milestone exists to prevent.
# `.github/scripts/m37_governance_advisory_control.sh` enforces that, and runs
# inside the required `CI · Workflow Integrity` context.
#
# ## Why the verdict comes from the ratchet, not the validator
#
# With real evidence the validator fails today, for two accepted reasons
# recorded in `.github/governance/known-gaps.json`. Its non-zero exit is
# therefore expected input, not a result — so this job captures it and hands
# the structured summary to the ratchet, which is green only when the observed
# failure set is exactly the recorded one. A new failure, a recorded gap that
# has silently resolved, or evidence that could not be fetched all turn it red,
# each with a distinguishable reason.

on:
  # No `paths:` on `pull_request`, deliberately, and no `paths-ignore:` either.
  #
  # This repository has paid for that lesson four times (M29-A, M29-I, M32).
  # GitHub treats a required status check that never reports as PENDING rather
  # than satisfied, so a path filter here would quietly disqualify this context
  # from ever being required. Encoding "this must never be required" into a
  # trigger is how `ci-mobile.yml` became a standing open question.
  #
  # The job installs PHP, fetches two public endpoints and runs two scripts.
  # Running it on every pull request costs about a minute.
  pull_request:

  push:
    branches: [main]
    paths:
      - ".github/governance/**"
      - ".github/CODEOWNERS"
      - ".github/workflows/governance-advisory.yml"
      - "apps/api/scripts/verify_repository_governance.php"
      - "apps/api/scripts/governance_ratchet.php"

  # The trigger that actually matters. Ruleset drift happens on GitHub, not in
  # a commit: somebody edits a rule in the web UI, adds a bypass actor, or
  # switches enforcement to evaluate-only, and no pull request is ever opened.
  # Without a schedule this job would only notice by coincidence.
  schedule:
    - cron: "17 6 * * 1" # Mondays, 06:17 UTC. Off the hour so it does not
      # queue behind everything else that runs at :00.

  workflow_dispatch:

# Read-only, and nothing more is needed: both endpoints below answer
# unauthenticated on a public repository, so this job holds no secret worth
# stealing and can do nothing with the token but read. That also makes it safe
# on pull requests from forks, which receive a read-only token by default.
permissions:
  contents: read

concurrency:
  group: governance-advisory-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # N-2. The one thing `github.token` cannot read.
  #
  # `GET /rulesets/{id}` returns `bypass_actors` ONLY to a caller holding
  # `Administration: read`. The advisory job's built-in token holds
  # `contents: read`, so every payload it fetches omits the field entirely —
  # measured, not assumed: all three rulesets answer HTTP 200 at
  # `X-Accepted-GitHub-Permissions: metadata=read` with no `bypass_actors` key,
  # while `GET /rulesets/rule-suites` answers 403 naming `administration=read`.
  #
  # The validator refuses to read a missing key as an empty list (M37 Phase 4B),
  # so the three checks that decide whether anybody can still cut a release —
  # github.no_bypass_actors, github.tag_ruleset_bypass_empty and
  # github.tag_ruleset_release_actors — have never been anything but EXTERNAL.
  # Nothing in this repository has ever confirmed that ruleset 22844673 actually
  # grants Integration#4902397. If it does not, releases are already impossible.
  #
  # ## Why this is a separate job and not four more lines in the one below
  #
  # Secrets in Actions are scoped to a JOB, not to a step. Putting the release
  # App's private key anywhere in `governance` would hand it to every step of a
  # job that runs `composer install` on every pull request — a third-party
  # dependency tree, in the same process space as the credential that holds
  # tag-creation authority for this repository. Reordering the steps would not
  # help; the secret is in the job environment either way.
  #
  # So this job exists to be small. It has NO `uses:` entries at all — not even
  # `actions/checkout` — because it needs no repository code to do its work, and
  # code it does not check out is code that cannot run beside the key. That is
  # the same posture `release-tag.yml` takes, for the same credential.
  #
  # ## It must never fail
  #
  # `governance` declares `needs: evidence`, and a failed dependency SKIPS the
  # dependent job. A hard failure here would therefore delete the advisory
  # verdict rather than report one — the precise opposite of what an evidence
  # problem should do. So every path exits 0 and says what happened in `mode`:
  #
  #   app          authenticated evidence was obtained
  #   fallback     no App credential in this context (fork PR) — expected
  #   unavailable  a credential WAS present and something went wrong — not
  #                expected, and the job below turns it into a red ratchet
  evidence:
    name: Governance Advisory · Evidence
    runs-on: ubuntu-latest
    timeout-minutes: 5

    # Nothing. The built-in token is not used here and must not be reachable:
    # this job authenticates as the App or it produces no evidence at all.
    permissions: {}

    outputs:
      mode: ${{ steps.acquire.outputs.mode }}
      detail: ${{ steps.acquire.outputs.detail }}
      rulesets_b64: ${{ steps.acquire.outputs.rulesets_b64 }}
      details_b64: ${{ steps.acquire.outputs.details_b64 }}

    steps:
      - name: Acquire authoritative ruleset evidence as the governance App
        id: acquire
        env:
          APP_ID: ${{ secrets.RELEASE_GOVERNOR_APP_ID }}
          APP_PRIVATE_KEY: ${{ secrets.RELEASE_GOVERNOR_PRIVATE_KEY }}
          REPO: ${{ github.repository }}
        run: |
          set -euo pipefail

          # Outputs are written base64-encoded, and that is a safety property
          # rather than a convenience. The payloads are GitHub API responses:
          # multi-line, and containing ruleset NAMES that a repository
          # administrator chose. A raw `::`-prefixed line reaching an output
          # file or a log is read by the runner as a workflow command. Base64
          # cannot contain a colon, so neither the heredoc-delimiter dance nor
          # the injection question arises.
          emit() {   # $1 mode, $2 detail, $3 rulesets b64, $4 details b64
            {
              printf 'mode=%s\n' "$1"
              printf 'detail=%s\n' "$2"
              printf 'rulesets_b64=%s\n' "$3"
              printf 'details_b64=%s\n' "$4"
            } >> "${GITHUB_OUTPUT}"
          }

          # Fork pull requests receive no repository secrets, by design. This is
          # the expected path for them, and it must stay quiet: the job below
          # falls back to the built-in token, the three bypass checks report
          # EXTERNAL, and `expected_unverified` — a SUBSET bound — keeps the
          # ratchet green. Converting this workflow to `pull_request_target` to
          # reach the secret would run fork code with the key in scope, which is
          # the vulnerability this job is shaped to avoid.
          if [ -z "${APP_ID}" ] || [ -z "${APP_PRIVATE_KEY}" ]; then
            echo "No App credential in this context — falling back to the built-in token."
            echo "The three bypass_actors checks will report EXTERNAL, which is the correct result for evidence nobody could fetch."
            emit "fallback" "no App credential is available in this context (fork pull request, or the secrets are unset)" "" ""
            exit 0
          fi

          # Anything below this line that goes wrong is NOT routine: a credential
          # was present and did not work. `unavailable` is recorded as an
          # endpoint failure by the job below, which the ratchet turns into
          # INCOMPLETE — red. A broken release credential must not be able to
          # hide behind the same green that a fork pull request earns honestly.
          give_up() {   # $1 detail
            echo "::warning::authoritative evidence could not be acquired: $1"
            emit "unavailable" "$1" "" ""
            exit 0
          }

          umask 077
          keyfile="$(mktemp)"
          trap 'rm -f "${keyfile}"' EXIT
          printf '%s\n' "${APP_PRIVATE_KEY}" > "${keyfile}"

          b64url() { openssl base64 -A | tr '+/' '-_' | tr -d '='; }

          # Reads only. There is exactly one non-GET call in this job — the
          # documented token mint below — and it is written out in full rather
          # than routed through here, so that this helper cannot be handed a
          # method by a future edit. `n2_evidence_credential_control.sh` asserts
          # both halves of that.
          get() {   # $1 path, $2 auth -> "<code>\n<body>"
            local path="$1" auth="$2" out code
            out="$(mktemp)"
            if ! code="$(curl -sS --max-time 30 --retry 2 --retry-connrefused \
                  -o "${out}" -w '%{http_code}' -X GET \
                  -H "Authorization: Bearer ${auth}" \
                  -H "Accept: application/vnd.github+json" \
                  -H "X-GitHub-Api-Version: 2022-11-28" \
                  "https://api.github.com/${path}")"; then
              code="000"
            fi
            printf '%s\n%s' "${code}" "$(cat "${out}")"
            rm -f "${out}"
          }

          now="$(date +%s)"
          header="$(printf '{"alg":"RS256","typ":"JWT"}' | b64url)"
          payload="$(printf '{"iat":%d,"exp":%d,"iss":"%s"}' "$((now - 60))" "$((now + 540))" "${APP_ID}" | b64url)"
          signature="$(printf '%s.%s' "${header}" "${payload}" \
            | openssl dgst -sha256 -sign "${keyfile}" -binary | b64url)"
          jwt="${header}.${payload}.${signature}"
          echo "::add-mask::${jwt}"

          response="$(get "repos/${REPO}/installation" "${jwt}")"
          code="$(printf '%s' "${response}" | head -n1)"
          body="$(printf '%s' "${response}" | tail -n +2)"

          if [ "${code}" != "200" ]; then
            give_up "GET /repos/${REPO}/installation returned HTTP ${code}"
          fi

          installation_id="$(printf '%s' "${body}" | jq -r '.id')"
          authenticated_app_id="$(printf '%s' "${body}" | jq -r '.app_id')"

          # The same identity binding release-tag.yml carries (N-1, review
          # finding M-2). A secret naming some OTHER App would otherwise mint
          # that App's token and present whatever IT can read as this
          # repository's governance evidence.
          if [ "${authenticated_app_id}" != "4902397" ]; then
            give_up "authenticated as App ${authenticated_app_id}, but the recorded governance actor is Integration#4902397 (.github/governance/identities.json)"
          fi

          echo "App ${authenticated_app_id} (Integration#4902397), installation ${installation_id}"

          # The single POST in this job, and the only reason one is needed:
          # GitHub mints installation tokens at this endpoint and nowhere else.
          # It changes no repository state. Every call that touches repository
          # data is a GET.
          mint="$(mktemp)"
          if ! code="$(curl -sS --max-time 30 --retry 2 --retry-connrefused \
                -o "${mint}" -w '%{http_code}' -X POST \
                -H "Authorization: Bearer ${jwt}" \
                -H "Accept: application/vnd.github+json" \
                -H "X-GitHub-Api-Version: 2022-11-28" \
                "https://api.github.com/app/installations/${installation_id}/access_tokens")"; then
            code="000"
          fi

          if [ "${code}" != "201" ]; then
            rm -f "${mint}"
            give_up "could not mint an installation token (HTTP ${code})"
          fi

          token="$(jq -r '.token' "${mint}")"
          echo "::add-mask::${token}"
          rm -f "${mint}"

          response="$(get "repos/${REPO}/rulesets" "${token}")"
          code="$(printf '%s' "${response}" | head -n1)"
          list="$(printf '%s' "${response}" | tail -n +2)"
          echo "GET /rulesets -> HTTP ${code}"

          if [ "${code}" != "200" ] || ! printf '%s' "${list}" | jq -e 'type == "array"' >/dev/null 2>&1; then
            give_up "GET /rulesets returned HTTP ${code} without a JSON array"
          fi

          details="[]"
          attempted=0
          collected=0
          with_bypass=0
          failures=""

          for id in $(printf '%s' "${list}" | jq -r '.[] | select(has("id")) | .id'); do
            attempted=$((attempted + 1))
            response="$(get "repos/${REPO}/rulesets/${id}" "${token}")"
            code="$(printf '%s' "${response}" | head -n1)"
            detail="$(printf '%s' "${response}" | tail -n +2)"
            echo "GET /rulesets/${id} -> HTTP ${code}"

            # The N-4b shape gate, unchanged. A 200 that does not carry `rules`
            # is not evidence and is never promoted as if it were.
            if [ "${code}" = "200" ] \
               && printf '%s' "${detail}" | jq -e 'type == "object" and has("rules")' >/dev/null 2>&1; then
              details="$(printf '%s\n%s' "${details}" "${detail}" | jq -s '.[0] + [.[1]]')"
              collected=$((collected + 1))

              # Counted, never REQUIRED. If the App's `Administration: read`
              # grant is missing or has not taken effect, GitHub answers 200 and
              # silently omits the field — and the right outcome then is the
              # validator's own: EXTERNAL, because a missing key is not an empty
              # list. Demanding the field here would convert that honest
              # EXTERNAL into a red job, which is a worse lie in the other
              # direction.
              if printf '%s' "${detail}" | jq -e 'has("bypass_actors")' >/dev/null 2>&1; then
                with_bypass=$((with_bypass + 1))
              fi
            else
              failures="${failures}${failures:+, }#${id} (HTTP ${code})"
            fi
          done

          if [ -n "${failures}" ]; then
            give_up "${collected}/${attempted} ruleset detail(s) fetched; unusable: ${failures}"
          fi

          echo "${collected}/${attempted} ruleset detail(s) fetched; ${with_bypass} carry a bypass_actors field"

          if [ "${with_bypass}" -lt "${collected}" ]; then
            echo "::warning::${collected} ruleset(s) were read as App 4902397 but only ${with_bypass} carried bypass_actors — the installation may not hold Administration: read. The bypass checks will stay EXTERNAL."
          fi

          rulesets_b64="$(printf '%s' "${list}" | base64 -w0)"
          details_b64="$(printf '%s' "${details}" | base64 -w0)"

          # A step output larger than GitHub will carry would be truncated into
          # malformed JSON, and malformed evidence is the one thing the
          # validator fails CLOSED on. Bounded well below the limit, and
          # degraded deliberately rather than discovered downstream.
          if [ "${#rulesets_b64}" -gt 400000 ] || [ "${#details_b64}" -gt 400000 ]; then
            give_up "the ruleset evidence is too large to pass between jobs (${#rulesets_b64}/${#details_b64} bytes encoded)"
          fi

          emit "app" "HTTP 200 for the list and all ${attempted} ruleset(s), read as Integration#4902397" \
            "${rulesets_b64}" "${details_b64}"

  governance:
    needs: evidence

    # The context string. GitHub matches a required status check against the
    # JOB name, never the workflow name, so this is the load-bearing one.
    #
    # It is deliberately permanent. M29-I's finding is that renaming a job
    # detaches any rule requiring the old name, so a name like
    # "Governance Advisory (non-blocking)" would have to be renamed — the one
    # operation this repository has documented as dangerous — the day anybody
    # wanted to require it. "Advisory" is expressed by absence from the
    # ruleset, and recorded in `.github/governance/required-checks.json` under
    # `deliberately_not_required`.
    #
    # It contains no U+00B7 MIDDLE DOT, so it cannot collide with, or be
    # produced by mistyping, any of the eight required contexts.
    name: Governance Advisory
    runs-on: ubuntu-latest

    # Measured, not guessed: the validator runs in ~0.4s and the ratchet in
    # well under that; PHP setup plus `composer install --no-dev` dominates.
    # Ten minutes is ample headroom and short enough that a hung run cannot sit
    # for the six hours GitHub would otherwise allow.
    timeout-minutes: 10

    env:
      # M50 Phase 1 network bound. `shivammathur/setup-php` exports
      # COMPOSER_PROCESS_TIMEOUT=0 into the runner — zero meaning UNLIMITED —
      # so every `composer install` here inherited no upper bound at all.
      # 300s is generous for a cached install and finite for a stalled one.
      COMPOSER_PROCESS_TIMEOUT: "300"
      EVIDENCE: ${{ github.workspace }}/governance-evidence

    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Setup PHP
        uses: shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240 # 2.37.2
        with:
          php-version: "8.4"
          coverage: none

      - name: Install PHP dependencies (no dev)
        working-directory: apps/api
        # The validator autoloads five classes from modules/Shared, all under
        # the non-dev PSR-4 map, and none of them touches a vendor package. So
        # --no-dev is sufficient, and it keeps the dev toolchain out of a job
        # whose only purpose is reading configuration.
        run: composer install --no-dev --no-interaction --no-progress --prefer-dist

      - name: Prove the validator and the ratchet still bite
        working-directory: apps/api
        # Runs before anything is fetched, deliberately. If the evidence
        # boundary or the ratchet has regressed, that must surface as its own
        # failure rather than as a confusing verdict computed by broken code.
        #
        # These need PHP, which is why they live here and not in
        # `CI · Workflow Integrity` — that gate is deliberately free of PHP,
        # Composer and network access. The wiring controls that protect THIS
        # workflow do run there, because they need none of it.
        run: php scripts/m37_advisory_negative_control.php

      - name: Fetch live governance evidence
        env:
          GH_TOKEN: ${{ github.token }}
          # N-2. Through `env:`, never `${{ }}` inside the script — these carry
          # GitHub API content and a ruleset name is administrator-supplied
          # text. Rendered into the shell source it would be code.
          APP_MODE: ${{ needs.evidence.outputs.mode }}
          APP_DETAIL: ${{ needs.evidence.outputs.detail }}
          APP_RULESETS_B64: ${{ needs.evidence.outputs.rulesets_b64 }}
          APP_DETAILS_B64: ${{ needs.evidence.outputs.details_b64 }}
        # Deliberately exits 0 even when GitHub cannot be reached.
        #
        # That is not `|| true` masking: a failed fetch is a real outcome this
        # job must report, and hard-failing here would kill the run before the
        # ratchet could distinguish "GitHub is down" from "somebody removed
        # branch protection". Instead the status is recorded structurally, the
        # evidence file is NOT written, and the ratchet turns an unreachable
        # endpoint into an INCOMPLETE verdict — red, but red for the right
        # reason.
        #
        # `curl -f` alone is not enough here either: the process exit status is
        # not the HTTP status, and a 403 body is valid JSON that would sail
        # into the validator as an empty ruleset list.
        run: |
          set -euo pipefail
          rm -rf "${EVIDENCE}"
          mkdir -p "${EVIDENCE}"

          status_json="${EVIDENCE}/evidence-status.json"
          entries=""

          fetch() {
            local name="$1" path="$2" out="$3" expect="$4"
            local body="${EVIDENCE}/.raw-${name}" code state detail

            # --fail is deliberately absent: a non-2xx must still produce a
            # captured status rather than a dead shell.
            if ! code="$(curl -sS --max-time 30 --retry 2 --retry-connrefused \
                  -o "$body" -w '%{http_code}' \
                  -H "Authorization: Bearer ${GH_TOKEN}" \
                  -H "Accept: application/vnd.github+json" \
                  -H "X-GitHub-Api-Version: 2022-11-28" \
                  "https://api.github.com/repos/${GITHUB_REPOSITORY}/${path}")"; then
              code="000"
            fi

            echo "GET /${path} -> HTTP ${code}"

            state="ok"
            detail="HTTP ${code}"

            if [ "$code" != "200" ]; then
              state="unavailable"
            elif [ ! -s "$body" ]; then
              state="empty"
              detail="HTTP 200 with an empty body"
            elif ! jq -e "${expect}" "$body" >/dev/null 2>&1; then
              state="unexpected_shape"
              detail="HTTP 200, but the payload is not ${expect}"
            fi

            if [ "$state" = "ok" ]; then
              # Only a verified-good payload is ever promoted to evidence.
              mv "$body" "$out"
            else
              # No evidence file means the validator is invoked without the
              # flag, so the affected checks stay EXTERNAL / ADMIN REQUIRED
              # rather than being judged from a body nobody can trust.
              rm -f "$body"
            fi

            entries="${entries}$(jq -nc --arg n "$name" --arg s "$state" --arg d "$detail" \
              '{($n): {status: $s, detail: $d}}')"
          }

          # N-2. Adopt the App-authenticated payloads when the evidence job
          # produced them, and re-verify their shape here rather than trusting
          # the upstream job's word for it. Two jobs agreeing that a payload is
          # well-formed costs one `jq` call; a malformed one reaching the
          # validator is a FAIL with a misleading cause.
          adopt_app_evidence() {
            local list details

            if ! list="$(printf '%s' "${APP_RULESETS_B64}" | base64 -d 2>/dev/null)" \
               || ! details="$(printf '%s' "${APP_DETAILS_B64}" | base64 -d 2>/dev/null)" \
               || ! printf '%s' "${list}" | jq -e 'type == "array"' >/dev/null 2>&1 \
               || ! printf '%s' "${details}" | jq -e 'type == "array" and all(.[]; has("rules"))' >/dev/null 2>&1; then
              return 1
            fi

            printf '%s' "${list}" > "${EVIDENCE}/rulesets.json"
            printf '%s' "${details}" > "${EVIDENCE}/ruleset-details.json"
            return 0
          }

          use_app_evidence="no"

          case "${APP_MODE}" in
            app)
              if adopt_app_evidence; then
                use_app_evidence="yes"
                echo "ruleset evidence: App-authenticated (Integration#4902397)"
                entries="${entries}$(jq -nc --arg d "${APP_DETAIL}" \
                  '{rulesets: {status: "ok", detail: $d},
                    ruleset_details: {status: "ok", detail: $d},
                    ruleset_details_app: {status: "ok", detail: $d}}')"
              else
                # The upstream job said `app` and handed over something that is
                # not what it claimed. That is a defect, not a degradation, and
                # it is recorded as an endpoint failure so the ratchet goes red
                # rather than quietly re-reading the same blind payloads.
                entries="${entries}$(jq -nc \
                  '{ruleset_details_app: {status: "unexpected_shape",
                    detail: "the evidence job reported mode=app but its payloads did not decode into well-formed ruleset JSON"}}')"
              fi
              ;;
            unavailable)
              # A credential WAS present and did not work. Never silent: the
              # ratchet turns any endpoint that is not `ok` into INCOMPLETE.
              entries="${entries}$(jq -nc --arg d "${APP_DETAIL}" \
                '{ruleset_details_app: {status: "unavailable", detail: $d}}')"
              ;;
            *)
              # `fallback`, or an empty mode because the job was skipped. The
              # expected path on a fork pull request: no endpoint is recorded,
              # the built-in token supplies what it can, and the three bypass
              # checks report EXTERNAL — which `expected_unverified` permits,
              # because it is a subset bound.
              echo "ruleset evidence: built-in token (no App credential in this context)"
              ;;
          esac

          if [ "${use_app_evidence}" = "no" ]; then
            fetch rulesets "rulesets" "${EVIDENCE}/rulesets.json" 'type == "array"'
          fi

          # M50-05 N-4b. A SECOND ruleset call, to a different endpoint, because
          # the list above cannot answer the question:
          #
          #   GET /rulesets       -> target, enforcement.  NO `rules`.
          #   GET /rulesets/{id}  -> additionally `rules`, and only there do the
          #                          required status-check contexts appear.
          #
          # So until now nothing could compare what `required-checks.json`
          # declares against what GitHub actually enforces, and the drift that
          # M50-05 found by hand — `Mobile Certification` declared but not
          # enforced — was invisible to every control in the repository.
          #
          # N-1 replaced a pinned id with the list. That pin read
          # `rulesets/21203909` — main's — so the tag rulesets, whose `rules`
          # and `bypass_actors` live at exactly the same endpoint, had no
          # evidence source at all. Nothing could say whether a deployed tag
          # ruleset actually restricted creation, made tags immutable, or
          # carried a standing bypass actor; the list payload answers none of
          # those, and the pin meant the only endpoint that does was never asked.
          #
          # So this now walks whatever `GET /rulesets` reported and fetches the
          # detail for every one. The id set is discovered, never assumed, which
          # is also why recreating a ruleset no longer silently blinds a check:
          # the new id is simply in the list on the next run.
          #
          # The `has("rules")` shape demand is unchanged and still load-bearing:
          # a 200 that does not carry `rules` is not evidence and must not be
          # promoted as if it were. Payloads that fail it are dropped, and the
          # validator's completeness gate turns a short set into EXTERNAL rather
          # than judging tag protection from a partial read.
          fetch_ruleset_details() {
            local list="${EVIDENCE}/rulesets.json" out="${EVIDENCE}/ruleset-details.json"
            local ids id body code collected=0 attempted=0 failures=""

            if [ ! -f "$list" ]; then
              entries="${entries}$(jq -nc '{ruleset_details: {status: "unavailable",
                detail: "the ruleset list was not fetched, so no ids could be enumerated"}}')"
              return 0
            fi

            ids="$(jq -r '.[] | select(has("id")) | .id' "$list")"

            printf '[]' > "$out"

            for id in $ids; do
              attempted=$((attempted + 1))
              body="${EVIDENCE}/.raw-detail-${id}"

              if ! code="$(curl -sS --max-time 30 --retry 2 --retry-connrefused \
                    -o "$body" -w '%{http_code}' \
                    -H "Authorization: Bearer ${GH_TOKEN}" \
                    -H "Accept: application/vnd.github+json" \
                    -H "X-GitHub-Api-Version: 2022-11-28" \
                    "https://api.github.com/repos/${GITHUB_REPOSITORY}/rulesets/${id}")"; then
                code="000"
              fi

              echo "GET ruleset detail ${id} -> HTTP ${code}"

              if [ "$code" = "200" ] && [ -s "$body" ] \
                 && jq -e 'type == "object" and has("rules")' "$body" >/dev/null 2>&1; then
                jq -s '.[0] + [.[1]]' "$out" "$body" > "${out}.tmp" && mv "${out}.tmp" "$out"
                collected=$((collected + 1))
              else
                failures="${failures}${failures:+, }#${id} (HTTP ${code})"
              fi

              rm -f "$body"
            done

            if [ "$attempted" -eq 0 ]; then
              # GitHub answered, and the answer was "no rulesets". Complete, and
              # the empty set is the correct evidence to hand on.
              entries="${entries}$(jq -nc '{ruleset_details: {status: "ok",
                detail: "0 ruleset(s) listed; nothing to fetch"}}')"
            elif [ -n "$failures" ]; then
              entries="${entries}$(jq -nc --arg d "${collected}/${attempted} fetched; unusable: ${failures}" \
                '{ruleset_details: {status: "unavailable", detail: $d}}')"
            else
              entries="${entries}$(jq -nc --arg d "HTTP 200 for all ${attempted} ruleset(s)" \
                '{ruleset_details: {status: "ok", detail: $d}}')"
            fi
          }

          if [ "${use_app_evidence}" = "no" ]; then
            fetch_ruleset_details   # N-1 · walk every ruleset the list reported
          fi

          fetch codeowners_errors "codeowners/errors" "${EVIDENCE}/codeowners-errors.json" 'type == "object"'

          # No token, header or URL credential is ever written here — only the
          # endpoint nickname, a status word and an HTTP code.
          printf '%s' "$entries" | jq -s '{endpoints: add}' > "$status_json"
          cat "$status_json"

      - name: Governance validation
        working-directory: apps/api
        # Exit 0/1/2 are all legitimate results that the ratchet interprets, so
        # they are captured rather than propagated. Exit 3 is not: it means the
        # validator could not run, and a run that produced no verdict must fail
        # here rather than hand the ratchet a summary that means nothing.
        run: |
          set -euo pipefail
          args=(--mode=advisory --json="${EVIDENCE}/summary.json")

          if [ -f "${EVIDENCE}/rulesets.json" ]; then
            args+=(--rulesets="${EVIDENCE}/rulesets.json")
          fi

          # N-4b, generalised by N-1. Passed only when the collector above
          # promoted verified-good payloads. An absent file means the validator
          # is invoked without the flag, and every check driven by it reports
          # EXTERNAL / ADMIN REQUIRED — never a PASS computed from
          # `required-checks.json` or `production-tags-ruleset.json`, which would
          # be this repository grading itself against its own files.
          if [ -f "${EVIDENCE}/ruleset-details.json" ]; then
            args+=(--ruleset-details="${EVIDENCE}/ruleset-details.json")
          fi

          if [ -f "${EVIDENCE}/codeowners-errors.json" ]; then
            args+=(--codeowners-errors="${EVIDENCE}/codeowners-errors.json")
          fi

          code=0
          php scripts/verify_repository_governance.php "${args[@]}" \
            | tee "${EVIDENCE}/report.txt" || code=$?

          echo "validator exit: ${code}"

          if [ "$code" -eq 3 ]; then
            echo "::error::the governance validator could not run (exit 3)"
            exit 1
          fi

      - name: Known-gap ratchet
        working-directory: apps/api
        # THE VERDICT. Its exit status is the job's, unguarded and unmasked: no
        # continue-on-error, no `|| true`, no captured exit code. A new
        # governance failure, a stale recorded gap, or unreachable evidence all
        # make this job red.
        run: |
          php scripts/governance_ratchet.php \
            --summary="${EVIDENCE}/summary.json" \
            --evidence-status="${EVIDENCE}/evidence-status.json" \
            --json="${EVIDENCE}/ratchet.json" \
            | tee "${EVIDENCE}/ratchet.txt"

      - name: Publish the verdict
        # `always()` here does NOT mask anything: it runs a reporting step after
        # a step that has already failed. The job's conclusion is decided by the
        # ratchet above, and nothing in this step can change it.
        if: always()
        # Built entirely from the two JSON documents. Nothing scrapes console
        # text, so a reworded message cannot change what this reports.
        run: |
          set -euo pipefail
          python3 .github/scripts/governance_advisory_summary.py \
            --summary "${EVIDENCE}/summary.json" \
            --ratchet "${EVIDENCE}/ratchet.json" \
            --evidence-status "${EVIDENCE}/evidence-status.json" \
            --known-gaps .github/governance/known-gaps.json \
            >> "$GITHUB_STEP_SUMMARY"

      - name: Upload evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: governance-evidence
          path: ${{ env.EVIDENCE }}
          # A missing artifact would mean the run produced no reviewable trace,
          # which is worse than a red job — it is a red job nobody can audit.
          if-no-files-found: error
          retention-days: 30
