name: CI · Workflow Integrity

# Every other workflow in this repository is checked by CI. Until M29-E, the
# workflows themselves were not, and it cost the project its production release
# gate: `release.yml` was invalid YAML from 2026-08-04 until M29-D, and GitHub
# could not load it. Thirty-odd pushes — on main, on feature branches, on every
# dependabot branch — each produced an instant zero-job startup failure.
#
# Nobody caught it because the symptom is camouflaged. In the Actions tab a
# workflow that cannot be parsed looks exactly like a gate that ran and failed.
# The file described itself as a MANDATORY production gate throughout.
#
# So this job asks the one question nothing was asking: can GitHub actually
# parse and run what is in .github/workflows?

on:
  # No `paths:` on `pull_request`, deliberately (M29-I).
  #
  # It was filtered here originally, which was correct for a check nobody
  # required and wrong the moment anybody wanted to. GitHub treats a required
  # status check that never reports as PENDING, not as satisfied — so requiring
  # a path-filtered check leaves every pull request that touches no workflow
  # waiting forever for a conclusion that is never coming, with no error
  # anywhere. That is the same trap M29-A removed from ci-api, ci-web,
  # contracts and ci-docker.
  #
  # The job downloads one 2 MB binary and lints thirteen files; it finished in
  # six seconds on the run that merged it. Running it on every pull request
  # costs almost nothing and buys a check that can actually be required.
  #
  # `push` below stays filtered, so post-merge runs remain narrow.
  pull_request:
  push:
    branches: [main]
    paths: [".github/workflows/**"]

# Read-only. This job inspects files and runs a linter; it needs nothing else,
# and a workflow-validation job holding write scope would be a strange thing to
# hand a future contributor's pull request.
permissions:
  contents: read

concurrency:
  group: workflow-integrity-${{ github.ref }}
  cancel-in-progress: true

env:
  # Pinned exactly, and verified. A floating tag would mean the gate guarding
  # the workflows is itself fetched from a moving target.
  ACTIONLINT_VERSION: "1.7.7"
  ACTIONLINT_SHA256: "023070a287cd8cccd71515fedc843f1985bf96c436b7effaecce67290e7e0757"

  # Pinned the same way, and for a sharper reason (M36). actionlint only
  # analyses the shell inside `run:` blocks when shellcheck is on PATH — and
  # until M36 it was there purely because the ubuntu-latest image happens to
  # ship it. Nothing asserted it. If that image ever drops shellcheck, every
  # `run:` block silently stops being linted while this gate stays green: the
  # exact camouflaged failure this workflow exists to catch, reproduced inside
  # the workflow itself.
  SHELLCHECK_VERSION: "0.10.0"
  SHELLCHECK_SHA256: "6c881ab0698e4e6ea235245f22832860544f17ba386442fe7e9d629f8cbedf87"

jobs:
  actionlint:
    # The job name, not the workflow name, is what GitHub matches a required
    # status check against. They are deliberately the same string here (M29-I)
    # so that `required-checks.json` can name the check the way everybody refers
    # to it. Requiring "CI · Workflow Integrity" while this said something else
    # would have produced a check that never reports — permanently pending,
    # blocking every pull request, with no error anywhere.
    #
    # Renaming a job detaches any rule that requires the old name. This one was
    # safe to rename because nothing required it yet. Once it is required, treat
    # this string as load-bearing.
    name: CI · Workflow Integrity
    runs-on: ubuntu-latest

    # Measured, not guessed: actionlint plus its negative control ran in ~6s on
    # the run that merged M29-E, and the three validators M36 added take ~30s
    # locally, dominated by the M31 control suite's 24 fixtures. Ten minutes is
    # roughly fifteen times the expected total — ample headroom for a slow
    # runner or a cold download, and short enough that a hung validator cannot
    # hold a REQUIRED context for the six hours GitHub would otherwise allow.
    # 20 minutes, and the number is now COMPUTED rather than guessed.
    #
    # This was 10, and on 2026-09-04 the job was CANCELLED at that cap mid-step:
    # npm's own retry behaviour spent nine minutes inside one live audit and
    # steps 16-19 never ran, taking four controls with them. Nobody had ever
    # multiplied out what this job actually does — it performs more live
    # external operations than any other job in the repository (four npm
    # audits, four composer audits and two baseline fetches, because M47 case C
    # re-executes the whole M45 control) plus two tool downloads.
    #
    # `.github/governance/ci-reliability-policy.json` now carries those
    # components and `verify_ci_reliability.py` recomputes the sum on every
    # run: worst case 672s against this 1200s cap. Raising the number without
    # bounding the operations would have been the wrong fix; both were done.
    # A healthy run is still ~104s, because nothing sleeps on success.
    timeout-minutes: 20

    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Install actionlint (pinned, checksum-verified)
        run: |
          set -euo pipefail
          archive="actionlint_${ACTIONLINT_VERSION}_linux_amd64.tar.gz"

          # Bounded since Phase 1. This was a bare `curl -fsSL` with no
          # --max-time, no --connect-timeout and no --retry, as step 3 of a
          # capped job: a GitHub Releases blip reddened the required context,
          # and a slow one consumed the budget and cancelled every control
          # after it. The wrapper retries only transient transport failures,
          # within a hard bound, and refuses a checksum mismatch outright.
          .github/scripts/bounded_download.sh \
            --url "https://github.com/rhysd/actionlint/releases/download/v${ACTIONLINT_VERSION}/${archive}" \
            --output "$archive" \
            --sha256 "${ACTIONLINT_SHA256}"

          # Verify before extracting, not after. An archive that fails this
          # check is never unpacked, so nothing from it can run. The wrapper
          # already verified it; this is deliberately kept as an independent
          # assertion so the property survives any future change to the
          # wrapper, and so `verify_ci_reliability.py` can see it here.
          echo "${ACTIONLINT_SHA256}  ${archive}" | sha256sum --check --strict

          tar -xzf "$archive" actionlint
          ./actionlint --version

      - name: Install shellcheck (pinned, checksum-verified)
        # Explicitly provisioned rather than assumed present. Verified before
        # extraction, so an archive failing the checksum is never unpacked, and
        # placed on PATH ahead of anything the image ships so the version
        # actionlint uses is the version pinned above.
        run: |
          set -euo pipefail
          archive="shellcheck-v${SHELLCHECK_VERSION}.linux.x86_64.tar.xz"

          # Bounded since Phase 1, for the same reason as actionlint above.
          .github/scripts/bounded_download.sh \
            --url "https://github.com/koalaman/shellcheck/releases/download/v${SHELLCHECK_VERSION}/${archive}" \
            --output "$archive" \
            --sha256 "${SHELLCHECK_SHA256}"

          echo "${SHELLCHECK_SHA256}  ${archive}" | sha256sum --check --strict

          tar -xJf "$archive" "shellcheck-v${SHELLCHECK_VERSION}/shellcheck"
          mkdir -p "${{ github.workspace }}/bin"
          mv "shellcheck-v${SHELLCHECK_VERSION}/shellcheck" "${{ github.workspace }}/bin/shellcheck"
          chmod +x "${{ github.workspace }}/bin/shellcheck"
          echo "${{ github.workspace }}/bin" >> "$GITHUB_PATH"

      - name: Confirm actionlint sees the pinned shellcheck
        # The install step succeeding is not the same as actionlint using it.
        # This asserts the resolved binary and its version, so a PATH ordering
        # mistake fails here instead of silently downgrading `run:`-block
        # analysis to nothing.
        run: |
          set -euo pipefail
          resolved="$(command -v shellcheck)"
          echo "shellcheck resolved to: $resolved"
          [ "$resolved" = "${{ github.workspace }}/bin/shellcheck" ]
          shellcheck --version | grep -qx "version: ${SHELLCHECK_VERSION}"
          echo "shellcheck ${SHELLCHECK_VERSION} is first on PATH"

      - name: Validate every workflow
        # Every file, not only the ones this pull request touched. A change to
        # workflow A can invalidate workflow B — a reusable workflow signature,
        # a renamed job another workflow needs — and the defect that started
        # this had sat in an untouched file for months.
        run: ./actionlint -color .github/workflows/*.yml

      - name: Negative control — prove the gate rejects what it should
        # A validator whose subject is already clean passes for two
        # indistinguishable reasons: it works, or it checks nothing. This feeds
        # it the historical defect plus two relatives, requires each to be
        # rejected by name, and requires a well-formed workflow to be accepted.
        env:
          ACTIONLINT: ${{ github.workspace }}/actionlint
        run: .github/scripts/run_control.sh workflow_integrity_negative_control -- .github/scripts/workflow_integrity_negative_control.sh

      - name: Enforce — CI reliability policy
        # Phase 1. Every control before this one protected what a gate SAYS.
        # None protected what it COSTS, and on 2026-09-04 that gap cost two red
        # runs in one morning: `Dependency audit` spent 7m01s inside a single
        # `npm audit` against a clean lockfile, and this job was CANCELLED at
        # its cap mid-control, silently taking four later controls with it.
        # Neither was a security failure. Both were duration failures, and
        # nothing in the repository was looking at duration.
        #
        # This reads .github/governance/ci-reliability-policy.json and asserts
        # every job is bounded, every dependency audit is wrapped, every tool
        # download is bounded and still checksum-verified, both failure
        # classifiers cover the policy, and — the check that would have caught
        # the cancellation in advance — that this job's worst case, recomputed
        # from the policy's own components, still fits inside its own timeout.
        run: .github/scripts/run_control.sh verify_ci_reliability -- .github/scripts/verify_ci_reliability.py

      - name: Enforce — CI reliability negative controls
        # And the control on that validator. Fourteen mutations, each removing
        # or weakening one reliability property in a disposable fixture, each
        # required to fail the check that owns it — because a validator that
        # reports twelve passes is telling you either that the policy holds or
        # that it checks nothing, and those look identical from outside.
        run: .github/scripts/run_control.sh m49_ci_reliability_control -- .github/scripts/m49_ci_reliability_control.sh

      - name: Enforce — reliability wrapper outage simulations
        # The runtime half: composer audit, the bounded downloader and the
        # baseline fetch driven against stubs rather than the real Packagist,
        # GitHub Releases and git. A control that needs an external service to
        # be UP cannot describe what happens when it is DOWN, which is exactly
        # the question these wrappers exist to answer.
        run: .github/scripts/run_control.sh m49_reliability_wrappers_control -- .github/scripts/m49_reliability_wrappers_control.sh

      # ---------------------------------------------------------------------
      # M36 — enforcement.
      #
      # Until now this repository had roughly a hundred validator checks and
      # sixty negative controls, and not one of them ran unless somebody
      # remembered to type the command. The cost was not hypothetical: M31's
      # lockfile pin had been silently blocking five dependency pull requests
      # for weeks, and nobody found out, because nothing ran the validator that
      # would have said so.
      #
      # These three are appended to THIS job rather than given their own,
      # because this job's name is the required status context. A separate job
      # would produce a context nothing requires, which enforces nothing while
      # looking like it does.
      #
      # No continue-on-error, no `|| true`, no `if: always()`. A non-zero exit
      # from any of them fails a required check, which is the entire point, and
      # `.github/scripts/m36_ci_enforcement_control.sh` exists to prove that
      # wiring cannot be quietly loosened.
      #
      # None of the three needs PHP, Composer, Flutter or Dart. They read files
      # and build throwaway fixtures under mktemp; the real tree is untouched.
      # ---------------------------------------------------------------------

      - name: Enforce — M35 Docker certification guard
        run: .github/scripts/run_control.sh m35_docker_certification_guard -- .github/scripts/m35_docker_certification_guard.sh

      - name: Enforce — M35 Docker certification negative controls
        run: .github/scripts/run_control.sh m35_docker_certification_negative_control -- .github/scripts/m35_docker_certification_negative_control.sh

      - name: Enforce — M31/M32 mobile platform negative controls
        run: .github/scripts/run_control.sh m31_platform_negative_control -- apps/mobile/scripts/m31_platform_negative_control.sh

      - name: Enforce — M37 Governance Advisory wiring controls
        # M37 Phase 4A found that the control above reads only THIS file, so it
        # would not notice a `continue-on-error` added to an enforcement step in
        # any other workflow — and Phase 4B adds exactly such a workflow. This
        # runs that workflow's own wiring controls from inside the required
        # context, so `Governance Advisory` cannot be quietly neutered by a
        # change that never touches this file.
        #
        # Shell and Python only. No PHP, no Composer, no network: the advisory
        # job owns those, and a packagist outage must not be able to fail a
        # required gate.
        run: .github/scripts/run_control.sh m37_governance_advisory_control -- .github/scripts/m37_governance_advisory_control.sh

      - name: Enforce — M44 deployment safety validator
        # M44. Everything above guards the workflows that TEST; nothing guarded
        # the workflow that DEPLOYS. `staging-deploy.yml` carried three
        # `|| true`s on `kubectl set image`, applied a migration manifest that
        # did not exist and turned that failure into an `echo`, and exited 0
        # from its smoke test when it had nothing to probe — so a deployment
        # that rolled nothing, migrated nothing and verified nothing reported
        # the same green tick as one that worked.
        #
        # Placed in this job because this job's name is the required status
        # context. A new job would create a context nothing requires, which
        # enforces nothing while looking like it does — the M36 lesson.
        run: .github/scripts/run_control.sh verify_deployment_safety -- .github/scripts/verify_deployment_safety.py

      - name: Enforce — M44 deployment safety negative controls
        # And the control on that validator: eleven historical defects
        # reinstated one at a time in a mktemp fixture, each required to fail
        # the check that owns it.
        run: .github/scripts/run_control.sh m44_deployment_safety_control -- .github/scripts/m44_deployment_safety_control.sh

      - name: Enforce — M45 dependency audit gate validator
        # M45. `security.yml`'s audit steps carried `|| true` from the day they
        # were written, so the required `Dependency audit` context could not
        # fail on a dependency vulnerability — the one thing it exists to
        # catch. The tree it was silently passing held 11 npm advisories (2
        # critical) and 7 Composer advisories (3 high).
        #
        # The second defect was quieter and is the reason this validator checks
        # more than masking: that job has no `composer install`, and without
        # `vendor/` a bare `composer audit` prints "No packages - skipping
        # audit." and exits 0. Removing the mask alone would have left a step
        # that audits nothing and passes for it.
        #
        # Placed in this job because this job's name is the required status
        # context — the M36 lesson. A new job would create a context nothing
        # requires, which enforces nothing while looking like it does.
        run: .github/scripts/run_control.sh verify_dependency_audit_gate -- .github/scripts/verify_dependency_audit_gate.py

      - name: Enforce — M45 dependency audit negative controls
        # And the control on that validator: twelve ways to neuter the gate,
        # reinstated one at a time in a mktemp fixture, each required to fail
        # the check that owns it — plus four live controls that run the real
        # audit commands against the pre- and post-M45 lockfiles, because every
        # other check here reads YAML and YAML cannot tell you whether a
        # command gates on anything.
        run: .github/scripts/run_control.sh m45_dependency_audit_control -- .github/scripts/m45_dependency_audit_control.sh

      - name: Enforce — M47 control-integrity checks on the M45 control
        # M47. The step above ran in this job for the whole of M45 and M46 and
        # proved nothing: its Part B resolved the pre-M45 baseline as
        # `origin/main`, which after the M45 merge was the post-M45 state, and
        # in CI — checked out at fetch-depth 1 — did not resolve at all. All
        # four live controls were marked "skipped", and the success condition
        # `live_ok + live_skipped == live_total` accepted that. Zero live
        # evidence, green required check.
        #
        # M47 pins the baseline to an immutable commit and requires complete
        # evidence. This step is the guard on that repair: it proves an
        # unresolvable baseline fails, that four evidenceless live controls
        # cannot exit 0, and that the old arithmetic has not come back.
        run: .github/scripts/run_control.sh m47_control_integrity_control -- .github/scripts/m47_control_integrity_control.sh

      - name: Enforce — M48 npm audit resilience controls
        # M48. `Dependency audit` now runs `npm audit` through a bounded-retry
        # wrapper, and a retry wrapper wrapped around a security gate is a
        # dangerous object: every bug in one points the same way, towards
        # passing. "Retry until the service answers" and "retry until it stops
        # complaining" are one edit apart and both print green.
        #
        # So this proves the three answers stay distinguishable — clean passes,
        # a finding fails and is never retried, a transient outage is retried
        # within a bound, and an audit that could not be performed exits
        # non-zero instead of being mistaken for one that found nothing. It
        # drives a stub `npm` from a scenario file rather than the real
        # registry: a control that needs npm's advisory service to be up cannot
        # describe what happens when it is down.
        run: .github/scripts/run_control.sh m48_npm_audit_resilience_control -- .github/scripts/m48_npm_audit_resilience_control.sh

      - name: Enforce — M46 workflow privilege & injection validator
        # M46. Two gaps, and the first is the one this repository keeps
        # rediscovering in new clothes.
        #
        # Nine of the fourteen workflows declared no `permissions:` at all, so
        # their token scope came from the repository's *default workflow
        # permissions* — live GitHub state, invisible from here, and one
        # administrator toggle away from read/write. Measured during discovery
        # that default is currently read-only, so nothing was exposed; the
        # defect was that nothing in the repository said so, asserted it, or
        # would notice it changing. M29-A, M37 and M44 are the same shape.
        #
        # The second: `${{ }}` is expanded when GitHub RENDERS a script, before
        # any shell parses it, so an attacker-influenced context arrives as
        # shell source. `release.yml` carried `${{ github.ref_name }}` in a
        # `run:` block, and git ref names legally contain backticks and `$`.
        # M44 fixed this class in staging-deploy.yml and wrote a guard that
        # reads only that file — which is precisely why it survived here.
        #
        # In this job because this job's name is the required status context.
        run: .github/scripts/run_control.sh verify_workflow_privilege -- .github/scripts/verify_workflow_privilege.py

      - name: Enforce — M46 workflow privilege negative controls
        # And the control on that validator: twelve properties broken one at a
        # time in a mktemp fixture, each required to fail the check that owns
        # it — permissions removed from two different workflows, contents
        # widened to write, an unnecessary scope, write-all, a job-level
        # override, all three tainted expression shapes, and the expected
        # workflow set losing, gaining and renaming a member.
        run: .github/scripts/run_control.sh m46_workflow_privilege_control -- .github/scripts/m46_workflow_privilege_control.sh

      - name: Prove the enforcement wiring itself cannot mask a failure
        # The control on the CI wiring. It reads this workflow and asserts that
        # every enforcement step still propagates a non-zero exit, then breaks
        # a real invariant inside a throwaway fixture and requires the
        # corresponding validator to reject it. A green gate that has been
        # neutered by a stray `|| true` fails here.
        run: .github/scripts/run_control.sh m36_ci_enforcement_control -- .github/scripts/m36_ci_enforcement_control.sh

      - name: Verify every mandatory control actually ran
        # A job conclusion tells you whether the job finished; it never tells
        # you which of its controls ran. When this job was cancelled on
        # 2026-09-04, four controls produced no result and reconstructing which
        # ones required reading step timestamps by hand out of the API.
        #
        # Each control above now writes a completion record, and this asserts
        # the recorded set is exactly the mandatory set in the reliability
        # policy: no control missing, none unexpected, no duplicate, no verdict
        # that contradicts its own exit code, and a gapless sequence so a
        # record cannot be appended after the fact. A mandatory control that
        # did not run is NOT_RUN, and NOT_RUN fails.
        run: .github/scripts/verify_control_manifest.py
