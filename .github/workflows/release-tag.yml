name: Release Tag · Create

# N-1. The mechanism that makes the production tag rulesets survivable.
#
# `production-tags-ruleset.json` restricts `creation` on `refs/tags/v*` to one
# bypass actor: GitHub App 4902397, "EruoFood Release Governor". Once that is
# applied, `git push origin v1.2.3` from a laptop is refused — the repository
# owner is not a bypass actor, and GitHub's ruleset bypass actor types
# (Integration, OrganizationAdmin, RepositoryRole, Team) contain no `User`, so
# no person can be made one. Without this workflow the ruleset would deny tag
# creation to everybody and the release path would simply stop.
#
# So the tag is cut here, by the App, on a deliberate human dispatch. That also
# makes "who cut this release, from what commit, and when" a question the
# Actions log answers.

on:
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag, e.g. v1.2.3 or v1.2.3-rc1"
        required: true
        type: string
      sha:
        description: "Full 40-character commit SHA on main to tag"
        required: true
        type: string

# Nothing. Not `contents: read` — nothing.
#
# GITHUB_TOKEN is deliberately unusable here. Inside Actions it authenticates as
# `github-actions[bot]`, which is a DIFFERENT Integration from App 4902397, so a
# tag it created would be refused by the creation ruleset anyway. Granting it a
# scope it must never use would only invite somebody to use it. Every call below
# runs on an installation token minted from the App's own key.
permissions: {}

concurrency:
  group: release-tag
  cancel-in-progress: false

jobs:
  create:
    name: Release Tag · Create
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Create the release tag as the release App
        env:
          # `inputs.*` is attacker-influenceable and must never be rendered into
          # the shell source — GitHub expands `${{ }}` before any shell parses
          # the script, so a tag named ``v1.0.0`id` `` would be a command
          # substitution. Through `env:` it is data. This is the same correction
          # M44 and M46 applied to staging-deploy.yml and release.yml.
          RELEASE_TAG: ${{ inputs.tag }}
          TARGET_SHA: ${{ inputs.sha }}
          REPO: ${{ github.repository }}
          APP_ID: ${{ secrets.RELEASE_GOVERNOR_APP_ID }}
          APP_PRIVATE_KEY: ${{ secrets.RELEASE_GOVERNOR_PRIVATE_KEY }}
        run: |
          set -euo pipefail

          # No third-party action handles the private key. `actions/create-github-app-token`
          # would do this in one line, but it is not in the M50-F1 allowlist and
          # adding it would put a third party in the path that holds release
          # authority for this repository. openssl is already on the runner and
          # the key never leaves this shell.
          umask 077
          keyfile="$(mktemp)"
          trap 'rm -f "${keyfile}"' EXIT
          printf '%s\n' "${APP_PRIVATE_KEY}" > "${keyfile}"

          b64url() { openssl base64 -A | tr '+/' '-_' | tr -d '='; }

          # L-2. `retry` is a parameter, not a constant.
          #
          # `--retry` covers transient problems irrespective of method, so a
          # tag-creation POST whose 201 was lost in transit would be REPLAYED —
          # the second attempt returning 422 for a ref the first attempt had
          # already created. The workflow would report failure for a tag that
          # exists, and the operator's natural next move is to cut a different
          # one. Reads stay retried; the single state-changing call does not.
          api() {
            # $1 retry|noretry, $2 method, $3 path, $4 auth header value, $5 optional body
            local retry="$1" method="$2" path="$3" auth="$4" body="${5:-}" out code
            local -a retry_args=()
            out="$(mktemp)"

            if [ "${retry}" = "retry" ]; then
              retry_args=(--retry 2 --retry-connrefused)
            fi

            if [ -n "${body}" ]; then
              code="$(curl -sS --max-time 30 "${retry_args[@]+"${retry_args[@]}"}" \
                -o "${out}" -w '%{http_code}' -X "${method}" \
                -H "Authorization: Bearer ${auth}" \
                -H "Accept: application/vnd.github+json" \
                -H "X-GitHub-Api-Version: 2022-11-28" \
                -d "${body}" \
                "https://api.github.com/${path}")"
            else
              code="$(curl -sS --max-time 30 "${retry_args[@]+"${retry_args[@]}"}" \
                -o "${out}" -w '%{http_code}' -X "${method}" \
                -H "Authorization: Bearer ${auth}" \
                -H "Accept: application/vnd.github+json" \
                -H "X-GitHub-Api-Version: 2022-11-28" \
                "https://api.github.com/${path}")"
            fi
            printf '%s\n%s' "${code}" "$(cat "${out}")"
            rm -f "${out}"
          }

          # -- 1. the tag name -------------------------------------------------
          #
          # Two separate requirements, both real. `refs/tags/v*` is what the
          # ruleset governs; `v*.*.*` is what release.yml fires on. A tag
          # matching only the first is governed but builds nothing, which reads
          # as a release that silently did not happen.
          # M-1. `[[ =~ ]]`, not `grep -Eq`. grep matches LINE BY LINE, so `^…$`
          # anchor a line rather than the value: `v1.2.3\n<anything>` satisfied
          # both patterns and carried the remainder through validation. It could
          # not forge a tag — GitHub rejects a ref name containing a newline —
          # but the residue reached an `echo`, where a `::` line is read as a
          # workflow command. Bash `[[ =~ ]]` matches the whole string, newlines
          # included, so the anchors mean what they appear to mean.
          #
          # Validation runs before the value is echoed anywhere, so a rejected
          # input is never rendered into a workflow command either.
          if [[ ! "${RELEASE_TAG}" =~ ^v[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.]+)?$ ]]; then
            echo "::error::the tag input is not a release tag. Expected vMAJOR.MINOR.PATCH with an optional -suffix, e.g. v1.2.3 or v1.2.3-rc1."
            exit 1
          fi

          if [[ ! "${TARGET_SHA}" =~ ^[0-9a-f]{40}$ ]]; then
            echo "::error::the sha input is not a full 40-character lowercase commit SHA. Abbreviated SHAs are refused: a release must name exactly one commit."
            exit 1
          fi

          # -- 2. mint an installation token -----------------------------------
          now="$(date +%s)"
          header="$(printf '{"alg":"RS256","typ":"JWT"}' | b64url)"
          payload="$(printf '{"iat":%d,"exp":%d,"iss":"%s"}' "$((now - 60))" "$((now + 540))" "${APP_ID}" | b64url)"
          signature="$(printf '%s.%s' "${header}" "${payload}" \
            | openssl dgst -sha256 -sign "${keyfile}" -binary | b64url)"
          jwt="${header}.${payload}.${signature}"

          response="$(api retry GET "repos/${REPO}/installation" "${jwt}")"
          code="$(printf '%s' "${response}" | head -n1)"
          body="$(printf '%s' "${response}" | tail -n +2)"

          if [ "${code}" != "200" ]; then
            echo "::error::GET /repos/${REPO}/installation returned HTTP ${code}. The App is not installed on this repository, or RELEASE_GOVERNOR_APP_ID is not App 4902397."
            exit 1
          fi

          installation_id="$(printf '%s' "${body}" | jq -r '.id')"
          authenticated_app_id="$(printf '%s' "${body}" | jq -r '.app_id')"

          # M-2. Bind the mechanism to the record.
          #
          # Until this check existed the workflow trusted RELEASE_GOVERNOR_APP_ID
          # and only PRINTED the app_id it got back, so a secret naming a
          # different App with Contents: write would mint that App's token and
          # cut the tag without complaint. Once the creation ruleset is applied
          # that fails closed — a non-bypass App is refused — but the rc3
          # exercise happens while creation is still unrestricted, which is
          # exactly when a wrong identity would look like success.
          #
          # 4902397 is the APP ID. `installation_id` above is a different number
          # identifying this repository's install of it, and is used only to
          # mint the token — never as an actor id.
          if [ "${authenticated_app_id}" != "4902397" ]; then
            echo "::error::authenticated as App ${authenticated_app_id}, but the recorded release actor is Integration#4902397 (.github/governance/identities.json). Check RELEASE_GOVERNOR_APP_ID and RELEASE_GOVERNOR_PRIVATE_KEY."
            exit 1
          fi

          echo "App ${authenticated_app_id} (Integration#4902397), installation ${installation_id}"

          response="$(api retry POST "app/installations/${installation_id}/access_tokens" "${jwt}")"
          code="$(printf '%s' "${response}" | head -n1)"
          body="$(printf '%s' "${response}" | tail -n +2)"

          if [ "${code}" != "201" ]; then
            echo "::error::Could not mint an installation token (HTTP ${code})."
            exit 1
          fi

          token="$(printf '%s' "${body}" | jq -r '.token')"
          echo "::add-mask::${token}"

          # -- 3. the commit must be on main -----------------------------------
          #
          # A release tag pointing at a commit that never passed through the
          # branch ruleset would be a release of unreviewed code wearing a
          # version number. `compare` answers this without a checkout: a commit
          # contained in main is `identical` or `behind`.
          response="$(api retry GET "repos/${REPO}/compare/main...${TARGET_SHA}" "${token}")"
          code="$(printf '%s' "${response}" | head -n1)"
          body="$(printf '%s' "${response}" | tail -n +2)"

          if [ "${code}" != "200" ]; then
            echo "::error::Could not compare ${TARGET_SHA} against main (HTTP ${code}). The commit may not exist in this repository."
            exit 1
          fi

          status="$(printf '%s' "${body}" | jq -r '.status')"

          if [ "${status}" != "identical" ] && [ "${status}" != "behind" ]; then
            echo "::error::${TARGET_SHA} is '${status}' relative to main — it is not contained in main. Only a commit already merged to main may be released."
            exit 1
          fi

          # -- 4. create the tag -----------------------------------------------
          #
          # POST, never PATCH. Creating an existing ref returns 422, and that is
          # the correct outcome: moving a release tag is what the immutability
          # ruleset exists to prevent, and this workflow must not be the hole in
          # it. Re-releasing means a new tag.
          response="$(api noretry POST "repos/${REPO}/git/refs" "${token}" \
            "$(jq -nc --arg r "refs/tags/${RELEASE_TAG}" --arg s "${TARGET_SHA}" '{ref: $r, sha: $s}')")"
          code="$(printf '%s' "${response}" | head -n1)"
          body="$(printf '%s' "${response}" | tail -n +2)"

          # L-1. 422 is not a synonym for "already exists".
          #
          # GitHub returns it for a reference that exists AND for one it will not
          # accept at all — an invalid ref name among them. Announcing the first
          # for every 422 names the wrong cause, and the operator's next move
          # after "already exists" is to cut a different tag, which does not fix
          # a malformed one. So the message is read rather than assumed, and only
          # GitHub's own "Reference already exists" earns the immutability note.
          if [ "${code}" != "201" ]; then
            message="$(printf '%s' "${body}" | jq -r '.message // "no message"')"

            if [ "${code}" = "422" ] && [ "${message}" = "Reference already exists" ]; then
              echo "::error::refs/tags/${RELEASE_TAG} already exists. Release tags are immutable; cut a new tag rather than moving this one."
            else
              echo "::error::tag creation failed (HTTP ${code}): ${message}"
            fi

            exit 1
          fi

          echo "Created refs/tags/${RELEASE_TAG} at ${TARGET_SHA}"
          echo "Release · Production Gates will now run for ${RELEASE_TAG}."
          {
            echo "### Release tag created"
            echo ""
            echo "| | |"
            echo "|---|---|"
            echo "| tag | \`${RELEASE_TAG}\` |"
            echo "| commit | \`${TARGET_SHA}\` |"
            echo "| created by | GitHub App installation ${installation_id} |"
          } >> "${GITHUB_STEP_SUMMARY}"
