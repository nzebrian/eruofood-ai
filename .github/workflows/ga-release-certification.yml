name: GA Release Certification

# The single consolidated GA gate. Production deployment is blocked unless EVERY
# mandatory automated gate below is green. Run this before cutting a production
# tag; the final `certified` job only passes when all required jobs pass.
#
# Gates: Backend Runtime · PHPStan L8 · PostgreSQL · Redis · Docker Clean Boot ·
#        React · Flutter · OpenAPI · Security · (Staging Smoke + Performance are
#        confirmed via inputs because they require a deployed staging target).

on:
  workflow_dispatch:
    inputs:
      staging_smoke_passed:
        description: "Staging smoke tests green? (staging-deploy.yml)"
        type: boolean
        default: false
      performance_passed:
        description: "Performance thresholds met on staging? (performance-certification.yml)"
        type: boolean
        default: false
      pentest_cleared:
        description: "External pentest: no open Critical/High? (independent assessor)"
        type: boolean
        default: false

# Least privilege (M46). Every job here checks out the repository and runs
# build/test tooling; none writes to the repository, publishes a package,
# comments on a pull request or calls the GitHub API. `contents: read` is
# therefore the whole requirement.
#
# Declaring it matters even where the repository's default is already
# read-only: that default is live GitHub state, invisible to this repository
# and reversible by an administrator toggle, at which point every job that
# installs third-party dependencies would receive a write-scoped token with
# nothing here to notice. Stated in the workflow, it cannot drift.
permissions:
  contents: read

concurrency:
  group: ga-release-cert-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend Runtime · PHPStan L8 · PostgreSQL · Redis · Security
    runs-on: ubuntu-latest
    timeout-minutes: 60
    defaults: { run: { working-directory: apps/api } }
    services:
      postgres:
        image: postgres:16
        env: { POSTGRES_USER: eruofood, POSTGRES_PASSWORD: eruofood, POSTGRES_DB: eruofood_test }
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U eruofood" --health-interval 10s --health-timeout 5s --health-retries 5
      redis:
        image: redis:7
        ports: ["6379:6379"]
        options: >-
          --health-cmd "redis-cli ping" --health-interval 10s --health-timeout 5s --health-retries 5
    env:
      # M50 Phase 1 network bound. `shivammathur/setup-php` exports
      # COMPOSER_PROCESS_TIMEOUT=0 into the runner — zero meaning UNLIMITED —
      # so every `composer install` here inherited no upper bound at all.
      # 300s is generous for a cached install and finite for a stalled one.
      COMPOSER_PROCESS_TIMEOUT: "300"
      DB_CONNECTION: pgsql
      DB_HOST: 127.0.0.1
      DB_DATABASE: eruofood_test
      DB_USERNAME: eruofood
      DB_PASSWORD: eruofood
      REDIS_HOST: 127.0.0.1
      CACHE_STORE: redis
    steps:
      - uses: actions/checkout@v7
      - uses: shivammathur/setup-php@v2
        with: { php-version: "8.4", extensions: "pdo_pgsql, redis, intl, zip, bcmath, pcntl", tools: "composer:v2" }
      - name: Composer validate — MANDATORY
        run: composer validate --strict --no-check-publish
      - run: composer install --prefer-dist --no-interaction --no-progress
      - run: cp .env.example .env && php artisan key:generate
      - name: Coding standards (Pint) — MANDATORY
        run: composer run lint
      - name: PHPStan Level 8 — MANDATORY
        run: composer run analyse
      - name: Full Pest suite on PostgreSQL — MANDATORY
        run: vendor/bin/pest
      - name: PostgreSQL fresh migrate/rollback/re-migrate — MANDATORY
        run: |
          php artisan migrate:fresh --force
          php artisan migrate:rollback --force
          php artisan migrate --force
      - name: Redis integration — MANDATORY
        run: php scripts/redis_validation.php
      - name: Security — composer audit — MANDATORY
        # Wrapped in Phase 1. A Packagist outage during release certification
        # must not be indistinguishable from a real advisory: the wrapper says
        # which of the two happened and fails closed either way.
        run: ${{ github.workspace }}/.github/scripts/composer_audit_resilient.sh composer audit

  web:
    name: React · Typecheck · Test · Build
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      # npm network policy (Phase 1). npm's defaults are fetch-retries=2 with
      # fetch-retry-maxtimeout=60000, serialised across every request an install
      # makes — which is how one `npm audit` burned 7m01s on 2026-09-04. Retry
      # stays ON here, because a dropped request mid-install is common and cheap
      # to retry; what changes is the per-retry ceiling, from 60s to 20s. A
      # healthy install is unaffected; the tail is bounded.
      npm_config_fetch_retries: "2"
      npm_config_fetch_retry_mintimeout: "1000"
      npm_config_fetch_retry_maxtimeout: "20000"
      npm_config_fetch_timeout: "60000"
    defaults: { run: { working-directory: apps/web } }
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v4
        with: { node-version: "22", cache: "npm", cache-dependency-path: apps/web/package-lock.json }
      - run: npm ci
      - run: npm run typecheck
      - run: npm run test
      - run: npm run build

  openapi:
    name: OpenAPI · Lint
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - run: npx --yes @redocly/cli@1 lint packages/api-contracts/openapi.yaml

  security-scan:
    name: Security · Secrets scan
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
        with: { fetch-depth: 0 }
      - uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ github.token }}

  docker-clean-boot:
    name: Docker Clean Boot
    uses: ./.github/workflows/ga-docker-certification.yml

  flutter:
    name: Flutter Certification
    uses: ./.github/workflows/ga-flutter-certification.yml

  certified:
    name: GA CERTIFIED (all mandatory gates green)
    needs: [backend, web, openapi, security-scan, docker-clean-boot, flutter]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Assert deploy-time confirmations
        # M46. These three comparisons interpolated `${{ inputs.* }}` straight
        # into the script. `type: boolean` constrains GitHub's own dispatch form
        # to true/false, so this was not exploitable in practice — but the
        # safety came from an input declaration twenty lines away rather than
        # from the code, and a later `type: string` would silently re-open it.
        # The values travel through `env:` now, which removes the class rather
        # than relying on the type. Logic and exit semantics are unchanged.
        env:
          STAGING_SMOKE_PASSED: ${{ inputs.staging_smoke_passed }}
          PERFORMANCE_PASSED: ${{ inputs.performance_passed }}
          PENTEST_CLEARED: ${{ inputs.pentest_cleared }}
        run: |
          echo "Automated gates: PASSED (backend, web, openapi, security, docker, flutter)."
          fail=0
          [ "$STAGING_SMOKE_PASSED" = "true" ] || { echo "::error::Staging smoke NOT confirmed"; fail=1; }
          [ "$PERFORMANCE_PASSED"   = "true" ] || { echo "::error::Performance thresholds NOT confirmed"; fail=1; }
          if [ "$PENTEST_CLEARED" != "true" ]; then
            echo "::warning::External pentest not cleared — status is TECHNICALLY READY, PENDING INDEPENDENT SECURITY ASSESSMENT."
          fi
          exit $fail
      - name: Result
        run: echo "GA CERTIFICATION COMPLETE — see docs/PRODUCTION_RELEASE_CHECKLIST.md for the GO evidence."
