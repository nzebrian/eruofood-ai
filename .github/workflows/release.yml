name: Release · Production Gates

# A production release is cut by pushing a semver tag (v1.2.3). EVERY job below is
# a MANDATORY gate: if any fails, the release is blocked (no image is promoted).
# This is the enforcement point for docs/PRODUCTION_DEPLOYMENT.md §3.

on:
  push:
    tags: ["v*.*.*"]

# Least privilege (M46). `packages: write` was here and nothing used it.
#
# The `images` job carries two `docker/build-push-action` steps and both are
# `push: false`; there is no `docker/login-action`, no registry, and no
# `docker push` in any `run:` block. This workflow builds images to prove they
# build and then discards them — the publishing path is `staging-deploy.yml`,
# which does log in and does push, and keeps `packages: write` for that reason.
#
# So this is not a behaviour change: nothing here can push a package today, and
# nothing here will push one after. It removes a write scope that a tag-
# triggered workflow was carrying into five jobs that install and execute
# third-party dependency trees. If image publishing is ever added to this
# workflow, the scope comes back with it, in the same commit.
permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  api:
    name: API · Lint · PHPStan L8 · Tests (PostgreSQL)
    runs-on: ubuntu-latest
    timeout-minutes: 60
    defaults:
      run:
        working-directory: apps/api
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: eruofood
          POSTGRES_PASSWORD: eruofood
          POSTGRES_DB: eruofood_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U eruofood"
          --health-interval 10s --health-timeout 5s --health-retries 5
      redis:
        image: redis:7
        ports: ["6379:6379"]
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s --health-timeout 5s --health-retries 5
    env:
      # M50 Phase 1 network bound. `shivammathur/setup-php` exports
      # COMPOSER_PROCESS_TIMEOUT=0 into the runner — zero meaning UNLIMITED —
      # so every `composer install` here inherited no upper bound at all.
      # 300s is generous for a cached install and finite for a stalled one.
      COMPOSER_PROCESS_TIMEOUT: "300"
      DB_CONNECTION: pgsql
      DB_HOST: 127.0.0.1
      DB_PORT: 5432
      DB_DATABASE: eruofood_test
      DB_USERNAME: eruofood
      DB_PASSWORD: eruofood
      REDIS_HOST: 127.0.0.1
      REDIS_PORT: 6379
      CACHE_STORE: redis
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: "8.4"
          extensions: pdo_pgsql, redis, intl, zip, bcmath, pcntl
          tools: composer:v2
      - run: composer install --prefer-dist --no-interaction --no-progress
      - run: cp .env.example .env && php artisan key:generate
      - name: Coding standards (Pint) — MANDATORY
        run: composer run lint
      - name: PHPStan Level 8 — MANDATORY (0 errors required for a production tag)
        run: composer run analyse
      - name: Full test suite on PostgreSQL — MANDATORY
        run: vendor/bin/pest
      - name: Fresh migrate + rollback + re-migrate (empty DB) — MANDATORY
        run: |
          php artisan migrate:fresh --force
          php artisan migrate:rollback --force
          php artisan migrate --force
      - name: Redis primitives — MANDATORY
        run: php scripts/redis_validation.php
      - name: Financial concurrency (locking / atomicity / idempotency) — MANDATORY
        # Offline provider only — see the equivalent step in ci-api.yml.
        env:
          PAYMENTS_PROVIDER: mock
        run: |
          php artisan migrate:fresh --force
          php scripts/financial_concurrency_validation.php

  web:
    name: Web · Typecheck · Test · Build
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      # npm network policy (Phase 1). npm's defaults are fetch-retries=2 with
      # fetch-retry-maxtimeout=60000, serialised across every request an install
      # makes — which is how one `npm audit` burned 7m01s on 2026-09-04. Retry
      # stays ON here, because a dropped request mid-install is common and cheap
      # to retry; what changes is the per-retry ceiling, from 60s to 20s. A
      # healthy install is unaffected; the tail is bounded.
      npm_config_fetch_retries: "2"
      npm_config_fetch_retry_mintimeout: "1000"
      npm_config_fetch_retry_maxtimeout: "20000"
      npm_config_fetch_timeout: "60000"
    defaults:
      run:
        working-directory: apps/web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v7
        with: { node-version: "22", cache: "npm", cache-dependency-path: apps/web/package-lock.json }
      - run: npm ci
      - run: npm run typecheck
      - run: npm run test
      - run: npm run build

  mobile:
    name: Mobile · Analyze · Test
    runs-on: ubuntu-latest
    timeout-minutes: 60
    defaults:
      run:
        working-directory: apps/mobile
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with: { channel: stable, cache: true }
      - run: cp .env.example .env
      # M50 Phase 1: pub has no network-timeout knob, so the bound is
      # explicit at the step.
      - timeout-minutes: 10
        run: flutter pub get
      - name: Analyzer — MANDATORY
        run: flutter analyze
      - name: Tests — MANDATORY
        run: flutter test

  contract:
    name: OpenAPI · Lint
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: packages/api-contracts
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v7
        with: { node-version: "22" }
      - run: npx --yes @redocly/cli@1 lint openapi.yaml

  security:
    name: Security · Secrets + Dependency Audit
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      # M50 Phase 1 network bound. `shivammathur/setup-php` exports
      # COMPOSER_PROCESS_TIMEOUT=0 into the runner — zero meaning UNLIMITED —
      # so every `composer install` here inherited no upper bound at all.
      # 300s is generous for a cached install and finite for a stalled one.
      COMPOSER_PROCESS_TIMEOUT: "300"
      # npm network policy (Phase 1). npm's defaults are fetch-retries=2 with
      # fetch-retry-maxtimeout=60000, serialised across every request an install
      # makes — which is how one `npm audit` burned 7m01s on 2026-09-04. Retry
      # stays ON here, because a dropped request mid-install is common and cheap
      # to retry; what changes is the per-retry ceiling, from 60s to 20s. A
      # healthy install is unaffected; the tail is bounded.
      npm_config_fetch_retries: "2"
      npm_config_fetch_retry_mintimeout: "1000"
      npm_config_fetch_retry_maxtimeout: "20000"
      npm_config_fetch_timeout: "60000"
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 0 }
      - name: Gitleaks
        uses: gitleaks/gitleaks-action@v2
        # Block style, not `env: { GITHUB_TOKEN: ${{ github.token }} }`. Inside a
        # YAML flow mapping the `{` of `${{` opens a nested mapping, so that line
        # is not valid YAML — and GitHub could not load this workflow at all
        # because of it. Every push to every branch since 2026-08-04 produced an
        # instant zero-job startup failure, which reads in the Actions tab like a
        # failing gate rather than a gate that never ran. In block context the
        # expression is an ordinary scalar and the trap does not exist.
        env:
          GITHUB_TOKEN: "${{ github.token }}"
      - name: Composer audit
        working-directory: apps/api
        # Wrapped in Phase 1. This is the production release path, which is
        # where an ambiguous audit failure is most expensive to diagnose.
        run: |
          composer install --prefer-dist --no-interaction --no-progress
          "${GITHUB_WORKSPACE}/.github/scripts/composer_audit_resilient.sh" composer audit
      - name: npm audit (web)
        working-directory: apps/web
        # Wrapped in Phase 1. M48 fixed this exact defect in security.yml and
        # left the identical unwrapped command here on the release path: an
        # npm advisory-service 503 during a tag push failed the release for a
        # reason unrelated to the code, and because `npm audit` exits 1 for
        # both, the log was indistinguishable from a genuine critical advisory.
        # The threshold is unchanged.
        run: |
          npm ci
          "${GITHUB_WORKSPACE}/.github/scripts/npm_audit_resilient.sh" npm audit --audit-level=high

  images:
    name: Docker · Build images (api, nginx, web)
    runs-on: ubuntu-latest
    timeout-minutes: 40
    # Images are only built once ALL quality/security gates pass.
    needs: [api, web, mobile, contract, security]
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: Build API image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: infra/docker/php/Dockerfile
          push: false
          tags: eruofood/api:${{ github.ref_name }}
      - name: Build web image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: infra/docker/node/Dockerfile
          push: false
          tags: eruofood/web:${{ github.ref_name }}

  release-gate:
    name: Release Gate (all mandatory gates green)
    runs-on: ubuntu-latest
    timeout-minutes: 5
    needs: [api, web, mobile, contract, security, images]
    steps:
      - name: All mandatory gates passed — release may proceed
        # M46. This line read:
        #
        #     run: echo "... green for ${{ github.ref_name }}."
        #
        # GitHub expands `${{ }}` when it RENDERS the script, before any shell
        # parses it, so the tag name arrived as shell *source*, not as data.
        # Git ref names may legally contain `$`, backtick, `;`, `&`, `|`, `(`
        # and `)` — everything the refname rules forbid is a different set — so
        # a tag like ``v1.0.0`id` `` is both a valid tag and a command
        # substitution. Quoting the expression does not help: the quotes are
        # rendered too, and a payload simply closes them.
        #
        # `env:` is the fix, and the only one. The value becomes an environment
        # variable, the shell reads it with `"$RELEASE_REF"`, and no expression
        # is ever part of the executable source. This is the same correction
        # M44 applied to `staging-deploy.yml`; the guard M44 wrote reads only
        # that file, which is why this survived here.
        env:
          RELEASE_REF: ${{ github.ref_name }}
        run: echo "OK — every mandatory gate is green for $RELEASE_REF."
