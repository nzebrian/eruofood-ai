name: Release · Production Gates

# A production release is cut by pushing a semver tag (v1.2.3). EVERY job below is
# a MANDATORY gate: if any fails, the release is blocked (no image is promoted).
# This is the enforcement point for docs/PRODUCTION_DEPLOYMENT.md §3.

on:
  push:
    tags: ["v*.*.*"]

permissions:
  contents: read
  packages: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  api:
    name: API · Lint · PHPStan L8 · Tests (PostgreSQL)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/api
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: eruofood
          POSTGRES_PASSWORD: eruofood
          POSTGRES_DB: eruofood_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U eruofood"
          --health-interval 10s --health-timeout 5s --health-retries 5
      redis:
        image: redis:7
        ports: ["6379:6379"]
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s --health-timeout 5s --health-retries 5
    env:
      DB_CONNECTION: pgsql
      DB_HOST: 127.0.0.1
      DB_PORT: 5432
      DB_DATABASE: eruofood_test
      DB_USERNAME: eruofood
      DB_PASSWORD: eruofood
      REDIS_HOST: 127.0.0.1
      REDIS_PORT: 6379
      CACHE_STORE: redis
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: "8.4"
          extensions: pdo_pgsql, redis, intl, zip, bcmath, pcntl
          tools: composer:v2
      - run: composer install --prefer-dist --no-interaction --no-progress
      - run: cp .env.example .env && php artisan key:generate
      - name: Coding standards (Pint) — MANDATORY
        run: composer run lint
      - name: PHPStan Level 8 — MANDATORY (0 errors required for a production tag)
        run: composer run analyse
      - name: Full test suite on PostgreSQL — MANDATORY
        run: vendor/bin/pest
      - name: Fresh migrate + rollback + re-migrate (empty DB) — MANDATORY
        run: |
          php artisan migrate:fresh --force
          php artisan migrate:rollback --force
          php artisan migrate --force
      - name: Redis primitives — MANDATORY
        run: php scripts/redis_validation.php
      - name: Financial concurrency (locking / atomicity / idempotency) — MANDATORY
        # Offline provider only — see the equivalent step in ci-api.yml.
        env:
          PAYMENTS_PROVIDER: mock
        run: |
          php artisan migrate:fresh --force
          php scripts/financial_concurrency_validation.php

  web:
    name: Web · Typecheck · Test · Build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: "22", cache: "npm", cache-dependency-path: apps/web/package-lock.json }
      - run: npm ci
      - run: npm run typecheck
      - run: npm run test
      - run: npm run build

  mobile:
    name: Mobile · Analyze · Test
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/mobile
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with: { channel: stable, cache: true }
      - run: cp .env.example .env
      - run: flutter pub get
      - name: Analyzer — MANDATORY
        run: flutter analyze
      - name: Tests — MANDATORY
        run: flutter test

  contract:
    name: OpenAPI · Lint
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: packages/api-contracts
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: "22" }
      - run: npx --yes @redocly/cli@1 lint openapi.yaml

  security:
    name: Security · Secrets + Dependency Audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 0 }
      - name: Gitleaks
        uses: gitleaks/gitleaks-action@v2
        env: { GITHUB_TOKEN: ${{ github.token }} }
      - name: Composer audit
        working-directory: apps/api
        run: |
          composer install --prefer-dist --no-interaction --no-progress
          composer audit
      - name: npm audit (web)
        working-directory: apps/web
        run: npm ci && npm audit --audit-level=high

  images:
    name: Docker · Build images (api, nginx, web)
    runs-on: ubuntu-latest
    # Images are only built once ALL quality/security gates pass.
    needs: [api, web, mobile, contract, security]
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: Build API image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: infra/docker/php/Dockerfile
          push: false
          tags: eruofood/api:${{ github.ref_name }}
      - name: Build web image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: infra/docker/node/Dockerfile
          push: false
          tags: eruofood/web:${{ github.ref_name }}

  release-gate:
    name: Release Gate (all mandatory gates green)
    runs-on: ubuntu-latest
    needs: [api, web, mobile, contract, security, images]
    steps:
      - name: All mandatory gates passed — release may proceed
        run: echo "OK — every mandatory gate is green for ${{ github.ref_name }}."
