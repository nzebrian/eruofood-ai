name: CI · Docker Clean Boot

# Validates the FULL stack from a clean environment: build images, boot the
# compose stack, run migrations from an empty database, and assert health +
# readiness. Runs in CI where container-registry access is available (the
# in-repo dev sandbox is registry-restricted — see docs/VALIDATION_STATUS.md).

on:
  push:
    branches: [main, develop]
    paths:
      - "docker-compose.yml"
      - "docker-compose.ci.yml"
      - "infra/**"
      - "apps/api/**"
      - "apps/web/**"
      - ".github/workflows/ci-docker.yml"
  # No `paths:` here, deliberately (M29-A).
  #
  # GitHub treats a required status check that never reports as PENDING, not as
  # satisfied. Filtering `pull_request` by path meant this workflow stayed
  # silent on unrelated pull requests — so the moment its job became a required
  # check, every such pull request would wait for a conclusion that was never
  # coming. A gate that blocks everything is as broken as one that blocks
  # nothing; it just fails in the other direction.
  #
  # A clean compose build, boot and migrate does not depend on which files a pull
  # request touched.
  # Running it always costs a little CI time and buys a check that can actually
  # be required. `push` below stays filtered, so post-merge runs remain narrow.
  #
  # See .github/governance/required-checks.json.
  pull_request:

# Least privilege (M46). Every job here checks out the repository and runs
# build/test tooling; none writes to the repository, publishes a package,
# comments on a pull request or calls the GitHub API. `contents: read` is
# therefore the whole requirement.
#
# Declaring it matters even where the repository's default is already
# read-only: that default is live GitHub state, invisible to this repository
# and reversible by an administrator toggle, at which point every job that
# installs third-party dependencies would receive a write-scoped token with
# nothing here to notice. Stated in the workflow, it cannot drift.
permissions:
  contents: read

# M50 Phase 1. This was the only workflow of fourteen with no concurrency group.
# A superseded run kept building images and booting a compose stack nobody was
# waiting for any more — wasteful rather than unsafe, but it also meant two
# runs of the same ref could contend for the same Docker resources.
concurrency:
  group: ci-docker-${{ github.ref }}
  cancel-in-progress: true

jobs:
  boot:
    name: Build · Boot · Migrate · Healthcheck
    runs-on: ubuntu-latest
    timeout-minutes: 30
    # Compose the production-shaped base + CI overlay EXPLICITLY. Setting
    # COMPOSE_FILE pins the exact files for every `docker compose` call below and
    # suppresses auto-loading of docker-compose.override.yml, whose dev bind mount
    # would otherwise shadow the image's baked vendor/ with an empty host dir.
    env:
      COMPOSE_FILE: docker-compose.yml:docker-compose.ci.yml
    steps:
      - uses: actions/checkout@v4

      - name: Validate compose config
        run: docker compose config

      - name: Build images from clean context
        run: docker compose build

      - name: Boot the full stack
        run: |
          docker compose up -d
          echo "Waiting for services to become healthy..."

      - name: Wait for health (postgres, redis, api)
        run: |
          for _ in $(seq 1 60); do
            unhealthy=$(docker compose ps --format '{{.Name}} {{.Health}}' | grep -E 'starting|unhealthy' || true)
            if [ -z "$unhealthy" ]; then echo "All services healthy."; break; fi
            echo "still starting: $unhealthy"; sleep 5
          done

      - name: Migrate from an empty database + seed bootstrap
        # The seed was masked with `|| true` from the day it was added (M20) until
        # M50-13, because bare `db:seed` resolved a root DatabaseSeeder this
        # repository never had and failed on every run. That root seeder now
        # exists, so the command works and the mask is gone: if seeding breaks,
        # this job goes red, which is the entire point of certifying a clean boot.
        run: |
          docker compose exec -T api php artisan migrate --force
          docker compose exec -T api php artisan db:seed --force

      - name: Readiness + health endpoints
        run: |
          docker compose exec -T api php artisan about
          curl -fsS http://localhost:8080/api/v1/health
          curl -fsS http://localhost:8080/api/public/v1/status

      - name: Restart-recovery (workers/scheduler reconnect)
        run: |
          docker compose restart worker scheduler api

          # After the restart, nginx's php_fpm upstream returns 502 until php-fpm
          # inside the api container finishes booting. Poll the health endpoint
          # until it recovers rather than guessing a fixed sleep. The loop is
          # bounded, so a genuine restart failure still fails the job; on timeout
          # we dump container state + logs to tell a real failure apart from a
          # startup race.
          deadline=$((SECONDS + 120))
          until curl -fsS http://localhost:8080/api/v1/health -o /tmp/health.json; do
            if [ "$SECONDS" -ge "$deadline" ]; then
              echo "::error::API did not recover within 120s after restart"
              echo "----- docker compose ps -----";  docker compose ps
              echo "----- api logs -----";           docker compose logs --no-color --tail=120 api
              echo "----- nginx logs -----";         docker compose logs --no-color --tail=60  nginx
              echo "----- worker logs -----";        docker compose logs --no-color --tail=40  worker
              echo "----- scheduler logs -----";     docker compose logs --no-color --tail=40  scheduler
              exit 1
            fi
            echo "waiting for API to recover after restart... (${SECONDS}s elapsed)"
            sleep 3
          done
          echo "API recovered after restart:"; cat /tmp/health.json

      - name: Teardown
        if: always()
        run: docker compose down -v
