name: GA Flutter Certification

# Executes the REAL Flutter toolchain (absent from the Claude sandbox) on a
# GitHub-hosted runner: doctor → pub get → analyze → test → build apk, plus a
# prepared iOS build-validation job on a macOS runner. Fails if analyze, tests,
# or required builds fail. READY TO EXECUTE; not run inside the sandbox.

on:
  workflow_dispatch:

  # No `paths:` here, deliberately (M32), and no `paths-ignore:` either.
  #
  # Until M32 this workflow had no `pull_request` trigger at all. Its only
  # automatic trigger was `push` to main, so the Android and iOS builds
  # validated main *after* a merge and never once ran on a pull request — which
  # is how they stayed red from 2026-08-04 to 2026-08-24 without blocking
  # anything.
  #
  # Filtering by path would reintroduce the trap `required-checks.json`
  # documents from M29-A: GitHub treats a check that does not report as
  # PENDING, never as satisfied. The moment anybody required these contexts, a
  # path-filtered trigger would leave every pull request touching no mobile
  # file waiting forever for a conclusion that is never coming. Today that is
  # twelve of the eighteen open pull requests. Running unconditionally is what
  # makes these checks safe to require later; the cost is one Ubuntu job and
  # one macOS job per pull request.
  #
  # `push` below stays filtered — nothing waits on a post-merge run, so
  # narrowing it is free.
  pull_request:

  push:
    branches: [main, develop]
    paths:
      - "apps/mobile/**"
      - ".github/workflows/ga-flutter-certification.yml"
  workflow_call: {}

# Read-only. Both jobs check out the repository, run a toolchain and build; they
# need nothing else. This matters more now than it did before M32: the workflow
# runs on every pull request from this commit onward, and a certification job
# holding write scope is a strange thing to hand a future contributor's branch.
# Artifact upload is unaffected — `actions/upload-artifact` authenticates with
# the runtime token, not the `contents` scope.
permissions:
  contents: read

concurrency:
  group: ga-flutter-${{ github.ref }}
  cancel-in-progress: true

defaults:
  run:
    working-directory: apps/mobile

jobs:
  android:
    name: Android · doctor · analyze · test · build apk
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: "17" }

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: flutter doctor
        run: flutter doctor -v

      - name: Prepare env asset
        # Unmasked in M50 Phase 1. `apps/mobile/.env.example` is tracked, and
        # `ci-mobile.yml` already copies it without a mask — so the `|| true`
        # here was hiding a step that cannot legitimately fail. If the asset
        # ever goes missing, the certification job should say so rather than
        # analysing and testing against whatever `.env` happened to be there.
        run: cp .env.example .env

      - name: flutter pub get
        # M50 Phase 1: pub has no network-timeout knob, so the bound is
        # explicit at the step. A stalled pub.dev fetch fails here rather
        # than consuming the job's whole budget.
        timeout-minutes: 10
        run: flutter pub get

      - name: flutter analyze — MANDATORY (fails on any issue)
        run: flutter analyze --fatal-infos --fatal-warnings

      - name: flutter test — MANDATORY
        run: flutter test --coverage

      - name: flutter build apk (release) — MANDATORY
        run: flutter build apk --release

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: eruofood-release-apk
          path: apps/mobile/build/app/outputs/flutter-apk/app-release.apk
          if-no-files-found: error

  ios:
    name: iOS · analyze · test · build (no codesign)
    runs-on: macos-14
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with: { channel: stable, cache: true }
      - name: flutter doctor
        run: flutter doctor -v
      - name: Prepare env asset
        # Unmasked in M50 Phase 1. `apps/mobile/.env.example` is tracked, and
        # `ci-mobile.yml` already copies it without a mask — so the `|| true`
        # here was hiding a step that cannot legitimately fail. If the asset
        # ever goes missing, the certification job should say so rather than
        # analysing and testing against whatever `.env` happened to be there.
        run: cp .env.example .env
      - name: flutter pub get
        # M50 Phase 1: pub has no network-timeout knob, so the bound is
        # explicit at the step. A stalled pub.dev fetch fails here rather
        # than consuming the job's whole budget.
        timeout-minutes: 10
        run: flutter pub get
      - name: flutter analyze — MANDATORY
        run: flutter analyze --fatal-infos --fatal-warnings
      - name: flutter test — MANDATORY
        run: flutter test
      - name: flutter build ios (no codesign) — build validation
        run: flutter build ios --release --no-codesign

  # ---------------------------------------------------------------------------
  # M33 — the single context that branch protection can require.
  #
  # ## Why an aggregator rather than requiring the two platform jobs
  #
  # `Android · doctor · analyze · test · build apk` and
  # `iOS · analyze · test · build (no codesign)` stay supporting jobs. Requiring
  # them individually would pin two more byte-exact context strings — both
  # containing U+00B7 MIDDLE DOT — into the ruleset, and every future rename of
  # a platform job would silently stop reporting and block every pull request.
  # One stable name, `Mobile Certification`, is the whole surface the ruleset
  # has to know about, and the platform jobs stay free to be renamed.
  #
  # ## Why `if: always()` is load-bearing, and why it is not enough on its own
  #
  # Bare `needs:` semantics SKIP a dependent job when a dependency fails. A
  # skipped required check never reports a conclusion, and GitHub treats that as
  # PENDING rather than failed — the same trap `required-checks.json` documents
  # from M29-A, arriving by a different road. So the job must run unconditionally
  # and decide for itself.
  #
  # But `always()` alone is the opposite defect: it would report success while
  # both platforms burned. The results are therefore inspected explicitly, and
  # anything that is not exactly `success` — `failure`, `cancelled`, `skipped`,
  # or any value GitHub adds later — fails the gate. Fail-closed in both
  # directions.
  mobile-certification:
    name: Mobile Certification
    needs:
      - android
      - ios
    if: ${{ always() }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    # This job checks nothing out and runs no toolchain; it reads two results.
    defaults:
      run:
        working-directory: .
    steps:
      - name: Verify both platform certifications succeeded
        # Passed through `env:` rather than interpolated into the script body.
        # The values are GitHub-generated and not attacker-controlled, but a
        # `${{ }}` expansion inside `run:` is textual substitution before the
        # shell ever sees it, and this repository's workflow-integrity gate
        # shellchecks every `run:` block. Env keeps the script analysable and
        # keeps the pattern off the injection-shaped list entirely.
        env:
          ANDROID_RESULT: ${{ needs.android.result }}
          IOS_RESULT: ${{ needs.ios.result }}
        run: |
          set -euo pipefail

          # Printed before the decision, always, so a red gate explains itself
          # without anyone opening two other jobs.
          echo "Android result: ${ANDROID_RESULT}"
          echo "iOS result:     ${IOS_RESULT}"

          if [ "${ANDROID_RESULT}" != "success" ] || [ "${IOS_RESULT}" != "success" ]; then
            echo "Mobile Certification FAILED"
            echo "Both platform certifications must report 'success'."
            exit 1
          fi

          echo "Mobile Certification PASSED"
