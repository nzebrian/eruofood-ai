name: CI · Mobile (Flutter)

on:
  push:
    branches: [main, develop]
    paths: ["apps/mobile/**", ".github/workflows/ci-mobile.yml"]
  pull_request:
    paths: ["apps/mobile/**", ".github/workflows/ci-mobile.yml"]

# Least privilege (M46). Every job here checks out the repository and runs
# build/test tooling; none writes to the repository, publishes a package,
# comments on a pull request or calls the GitHub API. `contents: read` is
# therefore the whole requirement.
#
# Declaring it matters even where the repository's default is already
# read-only: that default is live GitHub state, invisible to this repository
# and reversible by an administrator toggle, at which point every job that
# installs third-party dependencies would receive a write-scoped token with
# nothing here to notice. Stated in the workflow, it cannot drift.
permissions:
  contents: read

concurrency:
  group: ci-mobile-${{ github.ref }}
  cancel-in-progress: true

defaults:
  run:
    working-directory: apps/mobile

jobs:
  quality:
    name: Analyse · Test
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Setup Flutter
        uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2.23.0
        with:
          channel: stable
          cache: true

      - name: Prepare env asset
        run: cp .env.example .env

      - name: Install dependencies
        # M50 Phase 1: pub has no network-timeout knob, so the bound is
        # explicit at the step. A stalled pub.dev fetch fails here rather
        # than consuming the job's whole budget.
        timeout-minutes: 10
        run: flutter pub get

      - name: Static analysis
        run: flutter analyze

      - name: Tests
        run: flutter test
