version: 2
updates:
  - package-ecosystem: composer
    directory: "/apps/api"
    schedule:
      interval: weekly
    open-pull-requests-limit: 5

  - package-ecosystem: npm
    directory: "/apps/web"
    schedule:
      interval: weekly
    open-pull-requests-limit: 5

  - package-ecosystem: npm
    directory: "/packages/api-contracts"
    schedule:
      interval: weekly

  - package-ecosystem: pub
    directory: "/apps/mobile"
    schedule:
      interval: weekly

  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: weekly

  - package-ecosystem: docker
    directory: "/infra/docker/php"
    schedule:
      interval: weekly
