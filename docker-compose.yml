# =============================================================================
# EruoFood AI — Base Docker Compose (production-shaped topology).
# Dev conveniences (bind mounts, hot reload, exposed tooling) live in
# docker-compose.override.yml, which Compose loads automatically for local dev.
#
#   Production-like:   docker compose -f docker-compose.yml up -d
#   Local dev:         docker compose up -d        (base + override)
# =============================================================================

name: ${COMPOSE_PROJECT_NAME:-eruofood}

x-app-env: &app-env
  APP_ENV: ${APP_ENV:-local}
  DB_HOST: postgres
  DB_PORT: 5432
  DB_DATABASE: ${POSTGRES_DB:-eruofood_local}
  DB_USERNAME: ${POSTGRES_USER:-eruofood}
  DB_PASSWORD: ${POSTGRES_PASSWORD:-secret}
  REDIS_HOST: redis
  REDIS_PORT: 6379
  REDIS_PASSWORD: ${REDIS_PASSWORD:-}
  AWS_ENDPOINT: http://minio:9000
  AWS_BUCKET: ${MINIO_DEFAULT_BUCKET:-eruofood-media}

services:
  # ---- Edge reverse proxy --------------------------------------------------
  nginx:
    image: nginx:${NGINX_IMAGE_TAG:-1.27-alpine}
    depends_on:
      api:
        condition: service_started
    ports:
      - "${NGINX_HTTP_PORT:-8080}:80"
    volumes:
      - ./infra/nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./infra/nginx/conf.d/api.conf:/etc/nginx/conf.d/default.conf:ro
    networks: [eruofood]
    restart: unless-stopped

  # ---- Laravel API (PHP-FPM) ----------------------------------------------
  api:
    build:
      context: .
      dockerfile: infra/docker/php/Dockerfile
      args:
        PHP_IMAGE_TAG: ${PHP_IMAGE_TAG:-8.4-fpm-alpine}
    environment:
      <<: *app-env
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks: [eruofood]
    restart: unless-stopped

  # ---- Queue worker (same image, different command) ------------------------
  worker:
    build:
      context: .
      dockerfile: infra/docker/php/Dockerfile
    command: ["php", "artisan", "queue:work", "--tries=3", "--max-time=3600"]
    environment:
      <<: *app-env
    depends_on:
      api:
        condition: service_started
    networks: [eruofood]
    restart: unless-stopped

  # ---- Scheduler (runs the Laravel scheduler once a minute) ----------------
  scheduler:
    build:
      context: .
      dockerfile: infra/docker/php/Dockerfile
    command: ["php", "artisan", "schedule:work"]
    environment:
      <<: *app-env
    depends_on:
      api:
        condition: service_started
    networks: [eruofood]
    restart: unless-stopped

  # ---- PostgreSQL ----------------------------------------------------------
  postgres:
    # M38-VECTOR-001. pgvector is not in the stock postgres image, so the
    # extension the Search module's migration tries to create never existed in
    # any environment — and the migration swallowed the failure, so nothing said
    # so. This is the official postgres:16 image WITH the extension compiled in,
    # so `CREATE EXTENSION vector` succeeds and SearchCapabilityProbe can report
    # `available` truthfully instead of always reporting the fallback path.
    #
    # Overridable for anyone who must pin something else; the probe reports
    # whatever is actually there either way.
    image: ${POSTGRES_IMAGE:-pgvector/pgvector:pg16}
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-eruofood_local}
      POSTGRES_USER: ${POSTGRES_USER:-eruofood}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-secret}
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./infra/docker/postgres/initdb:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-eruofood}"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks: [eruofood]
    restart: unless-stopped

  # ---- Redis ---------------------------------------------------------------
  redis:
    image: redis:${REDIS_IMAGE_TAG:-7-alpine}
    command: ["redis-server", "/usr/local/etc/redis/redis.conf"]
    volumes:
      - ./infra/redis/redis.conf:/usr/local/etc/redis/redis.conf:ro
      - redisdata:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5
    networks: [eruofood]
    restart: unless-stopped

  # ---- MinIO (S3-compatible object storage) --------------------------------
  minio:
    # M50-18(b). This was `:latest`, and it is pulled by both Docker certification
    # gates on every run — so an upstream MinIO release could turn a green
    # certification red with no change to this repository, which is the failure
    # class M49 exists to eliminate. MinIO never re-pushes a RELEASE.* tag, so a
    # named release is immutable in practice.
    #
    # This exact release is what `:latest` already resolved to when it was pinned:
    # both tags carried digest sha256:14cea493d9a34af32f524e538b8346cf79f3321eff8e708c1e2960462bd8936e,
    # so the substitution changed nothing about what runs — it only stopped it
    # changing by itself. Bumped by Dependabot's docker ecosystem.
    image: minio/minio:RELEASE.2025-09-07T16-13-09Z
    command: ["server", "/data", "--console-address", ":9001"]
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-eruofood}
      # MinIO refuses to start (exit 1 → crash-restart loop) if the root password
      # is shorter than 8 characters. The old default "secret" (6) flapped the
      # container, churning Docker's IPAM. Keep the default at/above the minimum.
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-eruofoodminio}
    volumes:
      - miniodata:/data
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 15s
      timeout: 5s
      retries: 5
    networks: [eruofood]
    restart: unless-stopped

networks:
  eruofood:
    driver: bridge

volumes:
  pgdata:
  redisdata:
  miniodata:
