# =============================================================================
# EruoFood AI — Base Docker Compose (production-shaped topology).
# Dev conveniences (bind mounts, hot reload, exposed tooling) live in
# docker-compose.override.yml, which Compose loads automatically for local dev.
#
#   Production-like:   docker compose -f docker-compose.yml up -d
#   Local dev:         docker compose up -d        (base + override)
# =============================================================================

name: ${COMPOSE_PROJECT_NAME:-eruofood}

x-app-env: &app-env
  APP_ENV: ${APP_ENV:-local}
  DB_HOST: postgres
  DB_PORT: 5432
  DB_DATABASE: ${POSTGRES_DB:-eruofood}
  DB_USERNAME: ${POSTGRES_USER:-eruofood}
  DB_PASSWORD: ${POSTGRES_PASSWORD:-secret}
  REDIS_HOST: redis
  REDIS_PORT: 6379
  REDIS_PASSWORD: ${REDIS_PASSWORD:-}
  AWS_ENDPOINT: http://minio:9000
  AWS_BUCKET: ${MINIO_DEFAULT_BUCKET:-eruofood-media}

services:
  # ---- Edge reverse proxy --------------------------------------------------
  nginx:
    image: nginx:${NGINX_IMAGE_TAG:-1.27-alpine}
    depends_on:
      api:
        condition: service_started
    ports:
      - "${NGINX_HTTP_PORT:-8080}:80"
    volumes:
      - ./infra/nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./infra/nginx/conf.d/api.conf:/etc/nginx/conf.d/default.conf:ro
    networks: [eruofood]
    restart: unless-stopped

  # ---- Laravel API (PHP-FPM) ----------------------------------------------
  api:
    build:
      context: .
      dockerfile: infra/docker/php/Dockerfile
      args:
        PHP_IMAGE_TAG: ${PHP_IMAGE_TAG:-8.4-fpm-alpine}
    environment:
      <<: *app-env
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks: [eruofood]
    restart: unless-stopped

  # ---- Queue worker (same image, different command) ------------------------
  worker:
    build:
      context: .
      dockerfile: infra/docker/php/Dockerfile
    command: ["php", "artisan", "queue:work", "--tries=3", "--max-time=3600"]
    environment:
      <<: *app-env
    depends_on:
      api:
        condition: service_started
    networks: [eruofood]
    restart: unless-stopped

  # ---- Scheduler (runs the Laravel scheduler once a minute) ----------------
  scheduler:
    build:
      context: .
      dockerfile: infra/docker/php/Dockerfile
    command: ["php", "artisan", "schedule:work"]
    environment:
      <<: *app-env
    depends_on:
      api:
        condition: service_started
    networks: [eruofood]
    restart: unless-stopped

  # ---- PostgreSQL ----------------------------------------------------------
  postgres:
    image: postgres:${POSTGRES_IMAGE_TAG:-16-alpine}
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-eruofood}
      POSTGRES_USER: ${POSTGRES_USER:-eruofood}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-secret}
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./infra/docker/postgres/initdb:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-eruofood}"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks: [eruofood]
    restart: unless-stopped

  # ---- Redis ---------------------------------------------------------------
  redis:
    image: redis:${REDIS_IMAGE_TAG:-7-alpine}
    command: ["redis-server", "/usr/local/etc/redis/redis.conf"]
    volumes:
      - ./infra/redis/redis.conf:/usr/local/etc/redis/redis.conf:ro
      - redisdata:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5
    networks: [eruofood]
    restart: unless-stopped

  # ---- MinIO (S3-compatible object storage) --------------------------------
  minio:
    image: minio/minio:latest
    command: ["server", "/data", "--console-address", ":9001"]
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-eruofood}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-secret}
    volumes:
      - miniodata:/data
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 15s
      timeout: 5s
      retries: 5
    networks: [eruofood]
    restart: unless-stopped

networks:
  eruofood:
    driver: bridge

volumes:
  pgdata:
  redisdata:
  miniodata:
