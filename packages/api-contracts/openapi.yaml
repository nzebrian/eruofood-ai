    get:
      tags: [Public API]
      summary: Search suggestions / autocomplete (scope search:read)
      security: [{ apiKeyAuth: [] }]
      parameters:
        - { name: q, in: query, required: false, schema: { type: string } }
        - { name: type, in: query, required: false, schema: { type: string } }
      responses:
        "200":
          description: Suggestions.
          content:
            application/json:
              schema: { type: object, properties: { data: { type: object, properties: { suggestions: { type: array, items: { type: string } } } } } }
