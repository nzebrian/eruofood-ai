        base_price_minor: { type: integer, minimum: 0 }
        variants: { type: array, items: { type: object, properties: { name: { type: string }, price_delta_minor: { type: integer } } } }
        images: { type: array, items: { type: string } }
        tags: { type: array, items: { type: string } }
        track_inventory: { type: boolean }
        stock: { type: integer, minimum: 0 }
        calories: { type: integer, nullable: true }
        nutrition_item_id: { type: string, format: uuid, nullable: true }

    CartLine:
