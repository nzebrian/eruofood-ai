        status: { type: string, enum: [pending, processing, succeeded, failed, cancelled, refunded, partially_refunded] }
        provider: { type: string }
        authorization_url: { type: string, nullable: true }
    Payment:
      type: object
      properties:
        id: { type: string, format: uuid }
        reference: { type: string }
        order_id: { type: string, nullable: true }
        payer_user_id: { type: string, format: uuid }
        amount_minor: { type: integer }
        refunded_minor: { type: integer }
        currency: { type: string }
        status: { type: string, enum: [pending, processing, succeeded, failed, cancelled, refunded, partially_refunded] }
        provider: { type: string }
        method_type: { type: string }
        provider_reference: { type: string, nullable: true }
        splits:
          type: array
          items:
            type: object
            properties:
              payee_type: { type: string }
              payee_id: { type: string }
              amount_minor: { type: integer }
        failure_reason: { type: string, nullable: true }
        timeline:
          type: array
          items:
            type: object
            properties:
              status: { type: string }
              at: { type: string }
              note: { type: string, nullable: true }
        created_at: { type: string, format: date-time }
    Refund:
      type: object
