              schema: { $ref: "#/components/schemas/DeveloperApplicationPage" }
    post:
      tags: [Developer Platform]
      summary: Create an application (scope-grant boundary)
      security: [{ bearerAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [name]
              properties:
                name: { type: string }
                description: { type: string }
                scopes: { type: array, items: { type: string } }
      responses:
        "201":
          description: The created application.
          content:
            application/json:
              schema: { type: object, properties: { data: { $ref: "#/components/schemas/DeveloperApplication" } } }
  /v1/developer/applications/{applicationId}/keys:
    get:
      tags: [Developer Platform]
      summary: List an application's API keys (prefixes only — never the secret)
      security: [{ bearerAuth: [] }]
      parameters:
        - { name: applicationId, in: path, required: true, schema: { type: string, format: uuid } }
      responses:
        "200":
          description: The keys.
          content:
            application/json:
              schema: { type: object, properties: { data: { type: object, properties: { keys: { type: array, items: { $ref: "#/components/schemas/DevApiKey" } } } } } }
    post:
      tags: [Developer Platform]
      summary: Issue an API key — the plaintext is returned exactly once
      security: [{ bearerAuth: [] }]
      parameters:
        - { name: applicationId, in: path, required: true, schema: { type: string, format: uuid } }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [name]
              properties:
                name: { type: string }
                scopes: { type: array, items: { type: string } }
                ttl_days: { type: integer, nullable: true }
      responses:
        "201":
          description: The issued key (includes one-time plaintext).
          content:
            application/json:
              schema: { type: object, properties: { data: { $ref: "#/components/schemas/IssuedApiKey" } } }
  /v1/developer/keys/{keyId}/rotate:
    post:
      tags: [Developer Platform]
      summary: Rotate a key — revokes the old and issues a new one (one-time plaintext)
      security: [{ bearerAuth: [] }]
      parameters:
        - { name: keyId, in: path, required: true, schema: { type: string, format: uuid } }
      responses:
        "201":
          description: The new key.
          content:
            application/json:
              schema: { type: object, properties: { data: { $ref: "#/components/schemas/IssuedApiKey" } } }
  /v1/developer/keys/{keyId}:
    delete:
      tags: [Developer Platform]
      summary: Revoke a key
      security: [{ bearerAuth: [] }]
      parameters:
        - { name: keyId, in: path, required: true, schema: { type: string, format: uuid } }
      responses:
        "200":
          description: Revoked.
          content:
            application/json:
              schema: { type: object, properties: { data: { type: object, properties: { revoked: { type: boolean } } } } }
  /v1/developer/applications/{applicationId}/webhooks:
    get:
      tags: [Developer Platform]
      summary: List an application's webhooks
      security: [{ bearerAuth: [] }]
      parameters:
        - { name: applicationId, in: path, required: true, schema: { type: string, format: uuid } }
      responses:
        "200":
          description: The webhooks.
          content:
            application/json:
              schema: { type: object, properties: { data: { type: object, properties: { webhooks: { type: array, items: { $ref: "#/components/schemas/DevWebhook" } } } } } }
    post:
      tags: [Developer Platform]
      summary: Create a webhook — the signing secret is returned once
      security: [{ bearerAuth: [] }]
      parameters:
        - { name: applicationId, in: path, required: true, schema: { type: string, format: uuid } }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [url, events]
              properties:
                url: { type: string, format: uri }
                events: { type: array, items: { type: string } }
      responses:
        "201":
          description: The created webhook (includes the signing secret once).
          content:
            application/json:
              schema: { type: object, properties: { data: { $ref: "#/components/schemas/DevWebhook" } } }
  /v1/developer/applications/{applicationId}/usage:
    get:
      tags: [Developer Platform]
      summary: API usage + quota for an application
      security: [{ bearerAuth: [] }]
      parameters:
        - { name: applicationId, in: path, required: true, schema: { type: string, format: uuid } }
      responses:
        "200":
          description: Usage.
          content:
            application/json:
              schema: { type: object, properties: { data: { $ref: "#/components/schemas/DevUsage" } } }

  /v1/verification/me:
    get:
      tags: [Verification]
      summary: The caller's own identity verification status
      description: >-
        Status only. A subject-facing response never carries identity data, even
        to the subject it belongs to.
      security: [{ bearerAuth: [] }]
      responses:
        "200":
          description: The caller's status, or `not_started` if they have never begun.
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: object
                    properties:
                      status: { $ref: "#/components/schemas/VerificationStatus" }
                      case:
                        type: object
                        nullable: true
                        allOf:
                          - $ref: "#/components/schemas/VerificationCase"
  /v1/verification/start:
    post:
      tags: [Verification]
      summary: Begin the caller's own identity verification
      description: >-
        Idempotent: a subject who taps "verify" twice gets the same case, not two
        competing ones. Throttled harder than reads because each start creates a
        billable provider session.
      security: [{ bearerAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [country_code]
              properties:
                country_code: { type: string, minLength: 2, maxLength: 2, example: "NG" }
      responses:
        "201":
          description: The case, carrying the hosted URL the subject is sent to.
          content:
            application/json:
              schema: { type: object, properties: { data: { $ref: "#/components/schemas/VerificationCase" } } }
        "409": { description: Already verified. }
        "503": { description: No verification provider is available for this country. }
  /v1/verification/cases/{id}:
    get:
      tags: [Verification]
      summary: One of the caller's own cases
      description: >-
        Ownership is re-checked on the loaded case rather than trusted from the
        identifier. A case belonging to somebody else is refused without
        revealing whether it exists.
      security: [{ bearerAuth: [] }]
      parameters:
        - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
      responses:
        "200":
          description: The case.
          content:
            application/json:
              schema: { type: object, properties: { data: { $ref: "#/components/schemas/VerificationCase" } } }
        "403": { description: Not the caller's case. }
  /v1/verification/level:
    get:
      tags: [Verification]
      summary: The account's current assurance level
      description: >-
        What a client reads to decide whether to prompt for a step-up before
        starting a sensitive operation.
      security: [{ bearerAuth: [] }]
      responses:
        "200":
          description: The level.
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: object
                    properties:
                      level: { $ref: "#/components/schemas/VerificationLevel" }
                      phone_verified: { type: boolean }
  /v1/verification/phone/request:
    post:
      tags: [Verification]
      summary: Send a confirmation code to a number
      description: >-
        The cheap rung of progressive verification. Re-requesting replaces the
        outstanding code rather than adding a second valid one. The response does
        not echo the number, and the code is never stored — only a hash.
      security: [{ bearerAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [phone]
              properties:
                phone: { type: string, minLength: 7, maxLength: 32, example: "+2348030000001" }
      responses:
        "202":
          description: Accepted for delivery.
          content:
            application/json:
              schema: { type: object, properties: { data: { type: object, properties: { sent: { type: boolean } } } } }
        "429": { description: Rate limited — each request sends an SMS. }
  /v1/verification/phone/confirm:
    post:
      tags: [Verification]
      summary: Spend an attempt against the outstanding code
      description: >-
        Attempts are counted on the stored row, not in a cache, so the limit
        survives a cache flush. The response does not say how many attempts
        remain.
      security: [{ bearerAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [code]
              properties:
                code: { type: string, minLength: 4, maxLength: 10 }
      responses:
        "200":
          description: Confirmed; the account's level has risen.
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: object
                    properties:
                      verified: { type: boolean }
                      level: { $ref: "#/components/schemas/VerificationLevel" }
        "422": { description: "Wrong, expired, or out of attempts." }
  /v1/verification/rider/start:
    post:
      tags: [Verification]
      summary: Begin the calling rider's KYC
      description: >-
        The strictest flow the platform runs — government document, liveness and
        face match, plus a driving licence where the vehicle requires one. The
        case is always keyed to the authenticated user, never to an id in the
        request.
      security: [{ bearerAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [country_code]
              properties:
                country_code: { type: string, minLength: 2, maxLength: 2 }
                requires_driving_licence:
                  type: boolean
                  default: true
                  description: False for a bicycle courier, where a licence check would be a barrier with no purpose.
      responses:
        "201":
          description: The rider's case.
          content:
            application/json:
              schema: { type: object, properties: { data: { $ref: "#/components/schemas/VerificationCase" } } }
  /v1/verification/rider/status:
    get:
      tags: [Verification]
      summary: Where the calling rider's verification stands
      security: [{ bearerAuth: [] }]
      responses:
        "200":
          description: Status, plus dispatch eligibility spelled out so the rider app need not interpret status values itself.
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: object
                    properties:
                      status: { $ref: "#/components/schemas/VerificationStatus" }
                      eligible_for_delivery: { type: boolean }
                      case:
                        type: object
                        nullable: true
                        allOf:
                          - $ref: "#/components/schemas/VerificationCase"
  /v1/verification/business/profiles:
    post:
      tags: [Verification]
      summary: Submit a business for KYB
      description: >-
        Restaurants and groceries alike. The registration number is encrypted at
        rest; which registry validates it is decided by the country.
      security: [{ bearerAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [business_kind, business_id, legal_name, registration_number, country_code]
              properties:
                business_kind: { type: string, enum: [restaurant, grocery] }
                business_id: { type: string, format: uuid }
                legal_name: { type: string, example: "Mama Put Kitchen Limited" }
                registration_number: { type: string, example: "RC1234567" }
                country_code: { type: string, minLength: 2, maxLength: 2 }
                registered_address: { type: string }
      responses:
        "201":
          description: The business profile.
          content:
            application/json:
              schema: { type: object, properties: { data: { $ref: "#/components/schemas/BusinessProfile" } } }
        "403": { description: The caller does not own this business. }
  /v1/verification/business/profiles/{profileId}/representatives:
    post:
      tags: [Verification]
      summary: Add an authorised representative
      description: The person who can act for the business, verified as an individual in their own right.
      security: [{ bearerAuth: [] }]
      parameters:
        - { name: profileId, in: path, required: true, schema: { type: string, format: uuid } }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [user_id, full_name, role]
              properties:
                user_id: { type: string, format: uuid }
                full_name: { type: string }
                role: { type: string, example: "director" }
                is_primary: { type: boolean }
                ownership_percentage: { type: integer, minimum: 0, maximum: 100 }
      responses:
        "201":
          description: The representative.
          content:
            application/json:
              schema: { type: object, properties: { data: { $ref: "#/components/schemas/BusinessRepresentative" } } }
  /v1/verification/business/profiles/{profileId}/verify-registration:
    post:
      tags: [Verification]
      summary: Check the registration number against the country's registry
      description: >-
        Nigeria resolves to the CAC adapter, which knows the RC/BN/IT series and
        compares the claimed name against the registered one. A market with no
        registry integration routes to human review rather than inheriting
        another country's registry — and an unreachable or unconfigured registry
        also routes to review, never to "assumed valid".
      security: [{ bearerAuth: [] }]
      parameters:
        - { name: profileId, in: path, required: true, schema: { type: string, format: uuid } }
      responses:
        "200":
          description: The lookup outcome and the resulting case state.
          content:
            application/json:
              schema: { type: object, properties: { data: { $ref: "#/components/schemas/RegistryLookup" } } }
  /v1/verification/business/representatives/{representativeId}/verify:
    post:
      tags: [Verification]
      summary: Start identity verification for a representative
      security: [{ bearerAuth: [] }]
      parameters:
        - { name: representativeId, in: path, required: true, schema: { type: string, format: uuid } }
      responses:
        "201":
          description: The representative's identity case.
          content:
            application/json:
              schema: { type: object, properties: { data: { $ref: "#/components/schemas/VerificationCase" } } }
  /v1/verification/business/{kind}/{businessId}/status:
    get:
      tags: [Verification]
      summary: A business's KYB standing
      security: [{ bearerAuth: [] }]
      parameters:
        - { name: kind, in: path, required: true, schema: { type: string, enum: [restaurant, grocery] } }
        - { name: businessId, in: path, required: true, schema: { type: string, format: uuid } }
      responses:
        "200":
          description: Status and whether it currently blocks trading.
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: object
                    properties:
                      status: { $ref: "#/components/schemas/VerificationStatus" }
                      blocked: { type: boolean, description: True only when the business is unverified *and* enforcement applies to its kind. }
  /v1/verification/webhooks/{provider}:
    post:
      tags: [Verification]
      summary: Provider callback (public, signed)
      description: >-
        Unauthenticated by necessity — the provider's signature is the
        authentication, verified before the body is trusted as a result. A
        forgery, a replay outside the tolerance window, an unknown session
        reference and an unknown provider all return an identical bare 401, so
        the endpoint cannot be used to refine an attack. Application is
        exactly-once: the event id is claimed before the decision is applied, so
        a redelivery is a no-op.
      security: []
      parameters:
        - { name: provider, in: path, required: true, schema: { type: string, example: didit } }
        - { name: X-Signature, in: header, required: false, schema: { type: string }, description: HMAC-SHA256 over the raw body. }
        - { name: X-Timestamp, in: header, required: false, schema: { type: string }, description: Unix seconds; outside the tolerance window the callback is treated as a replay. }
      requestBody:
        required: true
        content:
          application/json:
            schema: { type: object, description: "Provider-specific payload, parsed only inside that provider's adapter." }
      responses:
        "200":
          description: Received. `applied` is false for a redelivery of an event already processed.
          content:
            application/json:
              schema:
                type: object
                properties:
                  received: { type: boolean }
                  applied: { type: boolean }
        "401": { description: Rejected. Deliberately uniform and uninformative. }
  /v1/verification/admin/queue:
    get:
      tags: [Verification]
      summary: Cases awaiting a human
      description: >-
        Requires `verification.read`. Returns cases only — no identity data is
        loaded, so clearing a verification backlog never involves opening
        anybody's documents.
      security: [{ bearerAuth: [] }]
      parameters:
        - { name: status, in: query, schema: { type: array, items: { $ref: "#/components/schemas/VerificationStatus" } } }
        - { name: subject_type, in: query, schema: { type: string, enum: [customer, rider, business] } }
        - { name: page, in: query, schema: { type: integer, minimum: 1 } }
        - { name: per_page, in: query, schema: { type: integer, minimum: 1, maximum: 100 } }
      responses:
        "200":
          description: A page of cases.
          content:
            application/json:
              schema:
                type: object
                properties:
                  data: { type: array, items: { $ref: "#/components/schemas/VerificationCase" } }
                  meta: { type: object }
        "403": { description: Missing `verification.read`. }
  /v1/verification/admin/reason-codes:
    get:
      tags: [Verification]
      summary: The rejection-reason catalogue
      description: So a reviewer picks from the same vocabulary the providers map onto.
      security: [{ bearerAuth: [] }]
      responses:
        "200":
          description: Reason codes, with whether each is retryable by the subject.
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items:
                      type: object
                      properties:
                        value: { type: string }
                        label: { type: string }
                        retryable: { type: boolean }
  /v1/verification/admin/cases/{id}:
    get:
      tags: [Verification]
      summary: A case, as a reviewer sees it
      description: Requires `verification.read`. Carries no identity data.
      security: [{ bearerAuth: [] }]
      parameters:
        - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
      responses:
        "200":
          description: The case.
          content:
            application/json:
              schema: { type: object, properties: { data: { $ref: "#/components/schemas/VerificationCase" } } }
  /v1/verification/admin/cases/{id}/history:
    get:
      tags: [Verification]
      summary: Every transition on a case
      description: >-
        Who decided what, when and why. Append-only in the database: a correction
        is made by appending a further transition, never by rewriting history.
      security: [{ bearerAuth: [] }]
      parameters:
        - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
      responses:
        "200":
          description: The transition history, oldest first.
          content:
            application/json:
              schema:
                type: object
                properties:
                  data: { type: array, items: { $ref: "#/components/schemas/VerificationStatusChange" } }
  /v1/verification/admin/cases/{id}/approve:
    post:
      tags: [Verification]
      summary: Approve a case by hand
      description: Requires `verification.review`. Applied under a row lock, so a reviewer and an arriving webhook cannot overwrite each other.
      security: [{ bearerAuth: [] }]
      parameters:
        - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
      requestBody:
        content:
          application/json:
            schema: { type: object, properties: { note: { type: string, maxLength: 500 } } }
      responses:
        "200":
          description: The decided case.
          content:
            application/json:
              schema: { type: object, properties: { data: { $ref: "#/components/schemas/VerificationCase" } } }
        "403": { description: Missing `verification.review`. }
        "422": { description: Not a legal transition from the case's current status. }
  /v1/verification/admin/cases/{id}/reject:
    post:
      tags: [Verification]
      summary: Reject a case by hand
      security: [{ bearerAuth: [] }]
      parameters:
        - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [reason_code]
              properties:
                reason_code: { type: string, example: document_unreadable }
                note: { type: string, maxLength: 500 }
      responses:
        "200":
          description: The decided case.
          content:
            application/json:
              schema: { type: object, properties: { data: { $ref: "#/components/schemas/VerificationCase" } } }
  /v1/verification/admin/cases/{id}/require-reverification:
    post:
      tags: [Verification]
      summary: Demand that a subject verify again
      description: A data change, a policy change, or a concern. Consumers treat this exactly like a loss of verification.
      security: [{ bearerAuth: [] }]
      parameters:
        - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
      requestBody:
        content:
          application/json:
            schema: { type: object, properties: { note: { type: string, maxLength: 500 } } }
      responses:
        "200":
          description: The case.
          content:
            application/json:
              schema: { type: object, properties: { data: { $ref: "#/components/schemas/VerificationCase" } } }
  /v1/verification/admin/cases/{id}/documents:
    get:
      tags: [Verification]
      summary: The regulated identity fields
      description: >-
        The narrowest permission on the platform (`verification.pii`) and the
        only endpoint that returns regulated identity data. No raw document is
        ever returned or stored — the provider holds the artefact and the
        platform holds the last four characters of the number, encrypted at rest.

        Every call writes an immutable audit event naming the actor, the case,
        the permission, the action, the stated reason, the result and the request
        correlation id — granted or denied, and whoever made it. A SuperAdmin
        retains this permission; what they do not retain is the ability to look
        unobserved.
      security: [{ bearerAuth: [] }]
      parameters:
        - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
        - { name: reason, in: query, required: false, schema: { type: string, maxLength: 255 }, description: Why this access is necessary; recorded on the audit event. }
      responses:
        "200":
          description: Document metadata.
          content:
            application/json:
              schema:
                type: object
                properties:
                  data: { type: array, items: { $ref: "#/components/schemas/VerificationDocument" } }
        "403": { description: Missing `verification.pii`. The refusal is itself audited. }
  /v1/notifications/preferences/marketing:
    put:
      tags: [Notifications]
      summary: Opt in or out of marketing messages
      description: >-
        Marketing is the one notification class that requires a positive opt-in;
        transactional and security messages are unaffected by this setting.
        Opting in issues the unsubscribe token at the same moment, so every
        marketing message the platform is now permitted to send already has a
        working way out of it.
      security: [{ bearerAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [opt_in]
              properties:
                opt_in: { type: boolean }
      responses:
        "200":
          description: The updated preferences. The unsubscribe token is never returned.
          content:
            application/json:
              schema: { type: object, properties: { data: { $ref: "#/components/schemas/NotificationPreference" } } }
  /v1/notifications/unsubscribe/{token}:
    post:
      tags: [Notifications]
      summary: Unsubscribe from marketing via an emailed link
      description: >-
        Public by necessity — clicked from an email client with no session, where
        the token stands in for authentication. Withdraws marketing consent only:
        an unsubscribe from a campaign must never silence delivery receipts or
        account-security messages.

        The response is identical whether or not the token matched, so the
        endpoint cannot be used to test tokens.
      security: []
      parameters:
        - { name: token, in: path, required: true, schema: { type: string } }
      responses:
        "200":
          description: Acknowledged.
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: object
                    properties:
                      unsubscribed: { type: boolean }
                      note: { type: string }
        "429": { description: Rate limited. }

  # ==========================================================================
  # Maps & Geolocation (M25)
  # ==========================================================================
  /v1/geo/addresses:
    get:
      tags: [Geo]
      summary: The caller's own saved addresses
      description: >-
        Default first, then most recently used. Takes no user identifier: the
        owner comes from the token and nowhere else, so there is no parameter
        that could be changed to reach somebody else's address book.
      security: [{ bearerAuth: [] }]
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  data: { type: array, items: { $ref: "#/components/schemas/CustomerAddress" } }
        "401": { description: Unauthenticated. }
    post:
      tags: [Geo]
      summary: Save an address
      description: >-
        Geocoded on the way in, so a customer learns that an address cannot be
        resolved while they are still looking at the form rather than at
        checkout. An explicit latitude/longitude is a pin the customer dragged
        and outranks the geocoded point.
      security: [{ bearerAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [address, label]
              properties:
                address: { type: string, minLength: 3, maxLength: 500 }
                label: { type: string, enum: [home, work, other] }
                custom_name: { type: string, nullable: true, description: "Required when label is other." }
                delivery_instructions: { type: string, nullable: true, maxLength: 500 }
                contact_phone: { type: string, nullable: true }
                country_code: { type: string, minLength: 2, maxLength: 2 }
                latitude: { type: number, format: double, nullable: true }
                longitude: { type: number, format: double, nullable: true }
                is_default: { type: boolean }
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema:
                type: object
                properties:
                  data: { $ref: "#/components/schemas/CustomerAddress" }
        "401": { description: Unauthenticated. }
        "422": { description: "Invalid address, or the saved-address limit is reached." }
        "429": { description: Rate limited. }
        "503": { description: No geocoding provider is available. }
  /v1/geo/addresses/{id}:
    parameters:
      - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
    get:
      tags: [Geo]
      summary: One saved address
      description: >-
        An address belonging to another customer is reported as not-found
        rather than forbidden — a 403 would confirm the identifier is real,
        which is exactly what an enumeration attempt is looking for.
      security: [{ bearerAuth: [] }]
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  data: { $ref: "#/components/schemas/CustomerAddress" }
        "404": { description: No such address for this caller. }
    patch:
      tags: [Geo]
      summary: Rename an address or change its instructions
      security: [{ bearerAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                label: { type: string, enum: [home, work, other] }
                custom_name: { type: string, nullable: true }
                delivery_instructions: { type: string, nullable: true }
                contact_phone: { type: string, nullable: true }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  data: { $ref: "#/components/schemas/CustomerAddress" }
        "404": { description: No such address for this caller. }
    delete:
      tags: [Geo]
      summary: Remove an address
      description: >-
        Deactivated, never deleted — historical orders point at it, and an order
        whose destination vanished is one nobody can investigate. If it was the
        default, the most recently used survivor takes over.
      security: [{ bearerAuth: [] }]
      responses:
        "204": { description: Removed. }
        "404": { description: No such address for this caller. }
  /v1/geo/addresses/{id}/relocate:
    post:
      tags: [Geo]
      summary: Point an address at a different place
      description: >-
        Creates a new location record rather than editing the old one, because
        past orders reference the old geocode and rewriting it in place would
        silently change where a completed delivery says it went.
      security: [{ bearerAuth: [] }]
      parameters:
        - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [address]
              properties:
                address: { type: string }
                country_code: { type: string, minLength: 2, maxLength: 2 }
                latitude: { type: number, format: double, nullable: true }
                longitude: { type: number, format: double, nullable: true }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  data: { $ref: "#/components/schemas/CustomerAddress" }
        "404": { description: No such address for this caller. }
  /v1/geo/addresses/{id}/default:
    post:
      tags: [Geo]
      summary: Make an address the default
      description: >-
        Clearing the old default and setting the new one happen in one
        transaction, so a customer cannot end up with two defaults or none.
      security: [{ bearerAuth: [] }]
      parameters:
        - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  data: { $ref: "#/components/schemas/CustomerAddress" }
        "404": { description: No such address for this caller. }
  /v1/geo/autocomplete:
    get:
      tags: [Geo]
      summary: Address suggestions
      description: >-
        The most expensive endpoint per useful outcome on the platform — a
        client that fires on every keystroke makes twenty billable calls to save
        one address — so it is cached hard and rate-limited separately. The
        device coordinates bias suggestions towards where the caller is
        standing; they are never stored and never become a saved address.
      security: [{ bearerAuth: [] }]
      parameters:
        - { name: q, in: query, required: true, schema: { type: string, minLength: 3, maxLength: 200 } }
        - { name: country_code, in: query, required: false, schema: { type: string, minLength: 2, maxLength: 2 } }
        - { name: device_latitude, in: query, required: false, schema: { type: number, format: double } }
        - { name: device_longitude, in: query, required: false, schema: { type: number, format: double } }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  data: { type: array, items: { $ref: "#/components/schemas/PlaceSuggestion" } }
        "429": { description: Rate limited. }
        "503": { description: No places provider is available. }
  /v1/geo/merchants/{ownerType}/{ownerId}/location:
    parameters:
      - { name: ownerType, in: path, required: true, schema: { type: string, enum: [vendor, store] } }
      - { name: ownerId, in: path, required: true, schema: { type: string, format: uuid } }
    get:
      tags: [Geo]
      summary: A merchant's public location
      description: >-
        Unauthenticated, and deliberately coarse — the point is rounded to about
        110 metres, which places a restaurant on a map without identifying a
        doorway. A location that has never been geocoded, or that somebody has
        disputed, is withheld entirely: a pin in the wrong place is worse than
        no pin. The registered address collected during KYB never appears here.
      security: []
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: object
                    properties:
                      location: { $ref: "#/components/schemas/PublicLocation" }
    post:
      tags: [Geo]
      summary: Set the merchant's trading address
      security: [{ bearerAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [address]
              properties:
                address: { type: string }
                country_code: { type: string, minLength: 2, maxLength: 2 }
                latitude: { type: number, format: double, nullable: true }
                longitude: { type: number, format: double, nullable: true }
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema:
                type: object
                properties:
                  data: { $ref: "#/components/schemas/MerchantLocation" }
        "403": { description: That merchant does not belong to the caller. }
  /v1/geo/merchants/{ownerType}/{ownerId}/location/manage:
    get:
      tags: [Geo]
      summary: The merchant's own view of their location
      description: Full precision, because it is their address and they need to know exactly where riders will be sent.
      security: [{ bearerAuth: [] }]
      parameters:
        - { name: ownerType, in: path, required: true, schema: { type: string, enum: [vendor, store] } }
        - { name: ownerId, in: path, required: true, schema: { type: string, format: uuid } }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: object
                    properties:
                      location: { $ref: "#/components/schemas/MerchantLocation" }
        "403": { description: That merchant does not belong to the caller. }
  /v1/geo/merchants/{ownerType}/{ownerId}/location/confirm:
    post:
      tags: [Geo]
      summary: Confirm the pin is right
      description: A confirmed location is not downgraded by a later automated re-geocode.
      security: [{ bearerAuth: [] }]
      parameters:
        - { name: ownerType, in: path, required: true, schema: { type: string, enum: [vendor, store] } }
        - { name: ownerId, in: path, required: true, schema: { type: string, format: uuid } }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  data: { $ref: "#/components/schemas/MerchantLocation" }
        "403": { description: That merchant does not belong to the caller. }
  /v1/geo/merchants/{ownerType}/{ownerId}/zones:
    parameters:
      - { name: ownerType, in: path, required: true, schema: { type: string, enum: [vendor, store] } }
      - { name: ownerId, in: path, required: true, schema: { type: string, format: uuid } }
    get:
      tags: [Geo]
      summary: A merchant's delivery zones
      security: [{ bearerAuth: [] }]
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  data: { type: array, items: { $ref: "#/components/schemas/DeliveryZone" } }
    post:
      tags: [Geo]
      summary: Create a delivery zone
      description: >-
        A radius zone is a circle; a polygon zone is an arbitrary boundary, for
        areas a circle describes badly — a lagoon, a gated estate. Polygon
        points are [longitude, latitude] in GeoJSON order. A restricted zone is
        an exclusion and defaults to a lower priority number so it is consulted
        before the service area it sits inside; a restriction that sorted after
        its parent would never fire.
      security: [{ bearerAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [name, zone_type]
              properties:
                name: { type: string, maxLength: 120 }
                zone_type: { type: string, enum: [radius, polygon] }
                latitude: { type: number, format: double, description: "Required for a radius zone." }
                longitude: { type: number, format: double, description: "Required for a radius zone." }
                radius_metres: { type: integer, minimum: 1, maximum: 200000 }
                polygon:
                  type: array
                  minItems: 3
                  description: "[longitude, latitude] pairs, GeoJSON order."
                  items: { type: array, items: { type: number, format: double }, minItems: 2, maxItems: 2 }
                fee_minor: { type: integer, minimum: 0, nullable: true }
                is_restricted: { type: boolean }
                priority: { type: integer, minimum: 1, maximum: 1000, description: "Lowest wins." }
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema:
                type: object
                properties:
                  data: { $ref: "#/components/schemas/DeliveryZone" }
        "422": { description: The shape is not a valid zone. }
  /v1/geo/merchants/{ownerType}/{ownerId}/zones/{zoneId}:
    patch:
      tags: [Geo]
      summary: Rename or deactivate a zone
      security: [{ bearerAuth: [] }]
      parameters:
        - { name: ownerType, in: path, required: true, schema: { type: string, enum: [vendor, store] } }
        - { name: ownerId, in: path, required: true, schema: { type: string, format: uuid } }
        - { name: zoneId, in: path, required: true, schema: { type: string, format: uuid } }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                name: { type: string, maxLength: 120 }
                is_active: { type: boolean }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  data: { $ref: "#/components/schemas/DeliveryZone" }
        "403": { description: That zone does not belong to the caller. }
  /v1/geo/merchants/{ownerType}/{ownerId}/zones/check:
    post:
      tags: [Geo]
      summary: Can this merchant deliver here?
      description: >-
        Answered before a customer builds a basket rather than at checkout. The
        matching zone is named, so a customer can be told which of "outside our
        area" and "we do not deliver to that estate" applies.
      security: [{ bearerAuth: [] }]
      parameters:
        - { name: ownerType, in: path, required: true, schema: { type: string, enum: [vendor, store] } }
        - { name: ownerId, in: path, required: true, schema: { type: string, format: uuid } }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [latitude, longitude]
              properties:
                latitude: { type: number, format: double }
                longitude: { type: number, format: double }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: object
                    properties:
                      is_serviceable: { type: boolean }
                      zone:
                        type: object
                        nullable: true
                        properties:
                          id: { type: string, format: uuid }
                          name: { type: string }
                          is_restricted: { type: boolean }
                          fee_minor: { type: integer, nullable: true }
                          min_order_minor: { type: integer, nullable: true }
  /v1/geo/riders/{riderId}/location:
    parameters:
      - { name: riderId, in: path, required: true, schema: { type: string, format: uuid } }
    post:
      tags: [Geo]
      summary: Report a rider's position
      description: >-
        A rider may only report their own position, checked against the rider
        record rather than trusted from the path. One row per rider is kept and
        overwritten — no movement history is accumulated, because nothing in
        this milestone reads one. A timestamp in the future is pulled back to
        now, so a wrong device clock cannot make a position look permanently
        fresh.
      security: [{ bearerAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [latitude, longitude]
              properties:
                latitude: { type: number, format: double }
                longitude: { type: number, format: double }
                accuracy_metres: { type: number, format: double, nullable: true }
                heading_degrees: { type: number, format: double, nullable: true }
                speed_mps: { type: number, format: double, nullable: true }
                recorded_at: { type: string, format: date-time, nullable: true }
      responses:
        "202":
          description: Accepted
          content:
            application/json:
              schema:
                type: object
                properties:
                  data: { $ref: "#/components/schemas/RiderLocation" }
        "403": { description: A rider may only report their own position. }
        "404": { description: No such rider. }
        "429": { description: Reporting too often. }
    get:
      tags: [Geo]
      summary: A rider's own last reported position
      security: [{ bearerAuth: [] }]
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  data: { $ref: "#/components/schemas/RiderLocation" }
        "403": { description: That rider position does not belong to the caller. }
        "404": { description: No position reported. }
    delete:
      tags: [Geo]
      summary: Go offline and forget the position
      description: >-
        A real delete rather than a soft one. There is nothing to audit in a
        position a rider is entitled to stop sharing, and keeping it would
        retain location data past the purpose that justified collecting it.
      security: [{ bearerAuth: [] }]
      responses:
        "204": { description: Forgotten. }
        "403": { description: That rider position does not belong to the caller. }
  /v1/geo/admin/provider-health:
    get:
      tags: [Geo Admin]
      summary: Mapping provider cost and health
      description: >-
        Call volume, cache hit rate, failure rate and latency over 24 hours,
        plus the daily billable-call budget. Built from a telemetry table that
        by construction holds no coordinates and no address text, because this
        surface is exported and graphed by people who have no business seeing
        where a customer lives.
      security: [{ bearerAuth: [] }]
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  data: { $ref: "#/components/schemas/GeoProviderHealth" }
        "403": { description: Requires geo.read. }
  /v1/geo/admin/pricing-mode:
    get:
      tags: [Geo Admin]
      summary: Whether customers are billed on routed distance
      description: >-
        Read live, so it reflects what the next quote will actually do. Exists
        because "why did this delivery cost that?" is a question the command
        centre will be asked and the answer depends on a switch.
      security: [{ bearerAuth: [] }]
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: object
                    properties:
                      routed_pricing_enabled: { type: boolean }
                      shadow_mode: { type: boolean }
                      refuse_when_unavailable: { type: boolean }
                      stale_route_grace_seconds: { type: integer }
        "403": { description: Requires geo.read. }
  /v1/geo/admin/coverage:
    get:
      tags: [Geo Admin]
      summary: Geocoding coverage and fleet reporting health
      description: >-
        An unresolved location is a delivery that will fail later, so this is a
        backlog to work through rather than a statistic. Riders are reported as
        a count, never as positions.
      security: [{ bearerAuth: [] }]
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  data: { $ref: "#/components/schemas/GeoCoverage" }
        "403": { description: Requires geo.read. }
  /v1/geo/admin/locations/{id}:
    get:
      tags: [Geo Admin]
      summary: One location, for investigating a delivery
      security: [{ bearerAuth: [] }]
      parameters:
        - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  data: { $ref: "#/components/schemas/MerchantLocation" }
        "403": { description: Requires geo.read. }
        "404": { description: No such location. }
  /v1/geo/admin/locations/{id}/confirm:
    post:
      tags: [Geo Admin]
      summary: Mark an operator-checked location as correct
      security: [{ bearerAuth: [] }]
      parameters:
        - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  data: { $ref: "#/components/schemas/MerchantLocation" }
        "403": { description: Requires geo.manage. }
  /v1/geo/admin/locations/{id}/dispute:
    post:
      tags: [Geo Admin]
      summary: Flag a location as wrong
      security: [{ bearerAuth: [] }]
      parameters:
        - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [reason]
              properties:
                reason: { type: string, maxLength: 280 }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  data: { $ref: "#/components/schemas/MerchantLocation" }
        "403": { description: Requires geo.manage. }
  /v1/geo/admin/measure:
    post:
      tags: [Geo Admin]
      summary: Measure a journey, with its provenance
      description: >-
        Returns where the number came from alongside the number, because "the
        fee was wrong" and "the fee was computed from a six-hour-old route" are
        different findings and only one of them is a bug. Never returns a
        straight-line estimate.
      security: [{ bearerAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [origin_latitude, origin_longitude, destination_latitude, destination_longitude]
              properties:
                origin_latitude: { type: number, format: double }
                origin_longitude: { type: number, format: double }
                destination_latitude: { type: number, format: double }
                destination_longitude: { type: number, format: double }
                travel_mode: { type: string, enum: [driving, two_wheeler, bicycle, walking] }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: object
                    properties:
                      route: { $ref: "#/components/schemas/GeoRoute" }
                      reason: { type: string, description: "Present only when no route could be established." }
        "403": { description: Requires geo.read. }
        "429": { description: Rate limited. }

  /v1/dispatch/offers/current:
    get:
      tags: [Dispatch]
      summary: The offer currently on this rider's screen
      description: >-
        The rider is resolved from the token; no rider id is accepted. Carries
        both the expiry instant and the countdown, so a slow network cannot make
        the app show more time than the rider actually has. Deliberately omits
        the score, the score breakdown, and anything about the other riders who
        were considered.
      security: [{ bearerAuth: [] }]
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: object
                    properties:
                      offer:
                        type: object
                        nullable: true
                        allOf:
                          - $ref: "#/components/schemas/DispatchOffer"
        "401": { description: Unauthenticated. }
  /v1/dispatch/offers/{offerId}/accept:
    post:
      tags: [Dispatch]
      summary: Take the delivery
      description: >-
        Atomic and idempotent. Exactly one rider wins a contested delivery; the
        losers get 409 rather than a second assignment. A repeated tap returns
        the same assignment. Eligibility is re-checked inside the lock, so a
        rider suspended or with lapsed insurance since the offer is refused.
      security: [{ bearerAuth: [] }]
      parameters:
        - { name: offerId, in: path, required: true, schema: { type: string, format: uuid } }
      responses:
        "201":
          description: The delivery is theirs.
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: object
                    properties:
                      assignment: { $ref: "#/components/schemas/DispatchAssignment" }
        "403": { description: The offer was not made to you. }
        "404": { description: No such offer. }
        "409":
          description: >-
            Somebody else got there first, the offer was already answered or
            expired, or the rider is no longer eligible. Nothing changed.
  /v1/dispatch/offers/{offerId}/decline:
    post:
      tags: [Dispatch]
      summary: Say no
      description: >-
        Frees the rider without failing the search — declining is a normal thing
        a rider does. They are not offered this delivery again.
      security: [{ bearerAuth: [] }]
      parameters:
        - { name: offerId, in: path, required: true, schema: { type: string, format: uuid } }
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              properties:
                reason: { type: string, maxLength: 255 }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: object
                    properties:
                      offer: { $ref: "#/components/schemas/DispatchOffer" }
        "403": { description: The offer was not made to you. }
        "409": { description: Already answered or expired. }
  /v1/dispatch/assignments/current:
    get:
      tags: [Dispatch]
      summary: What this rider is carrying right now
      security: [{ bearerAuth: [] }]
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: object
                    properties:
                      assignment:
                        type: object
                        nullable: true
                        allOf:
                          - $ref: "#/components/schemas/DispatchAssignment"
        "401": { description: Unauthenticated. }
  /v1/dispatch/assignments/{assignmentId}/state:
    post:
      tags: [Dispatch]
      summary: Report where the rider has got to
      description: >-
        The journey is OFFERED to ACCEPTED to EN_ROUTE_PICKUP to ARRIVED_PICKUP
        to PICKED_UP to IN_TRANSIT to DELIVERED, and DELIVERED is terminal.
        Marketplace's delivery is advanced first and the dispatch assignment
        mirrors it, so the two records cannot disagree. Only the rider-drivable
        states are accepted — cancellation and reassignment are not a rider's to
        declare.
      security: [{ bearerAuth: [] }]
      parameters:
        - { name: assignmentId, in: path, required: true, schema: { type: string, format: uuid } }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [state]
              properties:
                state:
                  type: string
                  enum: [en_route_pickup, arrived_pickup, picked_up, in_transit, delivered]
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: object
                    properties:
                      assignment: { $ref: "#/components/schemas/DispatchAssignment" }
        "403": { description: This delivery is not assigned to you. }
        "422": { description: "Not a legal transition, or not a state a rider may declare." }
  /v1/dispatch/vehicles:
    get:
      tags: [Dispatch]
      summary: The rider's own vehicles
      security: [{ bearerAuth: [] }]
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items: { $ref: "#/components/schemas/DispatchVehicle" }
    post:
      tags: [Dispatch]
      summary: Register a vehicle
      description: >-
        Lands pending verification, always. There is no argument to this
        endpoint that could make a vehicle dispatchable — approval requires an
        operator, and lives under /admin.
      security: [{ bearerAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [type]
              properties:
                type: { type: string, enum: [bike, tricycle, car, bus] }
                registration_number: { type: string, maxLength: 32 }
                make: { type: string, maxLength: 64 }
                model: { type: string, maxLength: 64 }
                colour: { type: string, maxLength: 32 }
                capacity_kg: { type: integer, minimum: 1, maximum: 5000 }
                capacity_litres: { type: integer, minimum: 1, maximum: 20000 }
      responses:
        "201":
          description: Registered, pending verification.
          content:
            application/json:
              schema:
                type: object
                properties:
                  data: { $ref: "#/components/schemas/DispatchVehicle" }
        "422": { description: "A plated vehicle type with no registration number, or the per-rider limit is reached." }
  /v1/dispatch/vehicles/{vehicleId}:
    get:
      tags: [Dispatch]
      summary: One of the rider's vehicles
      security: [{ bearerAuth: [] }]
      parameters:
        - { name: vehicleId, in: path, required: true, schema: { type: string, format: uuid } }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  data: { $ref: "#/components/schemas/DispatchVehicle" }
        "403": { description: Not your vehicle. }
    delete:
      tags: [Dispatch]
      summary: Retire a vehicle
      description: Kept for the record, never dispatched on again.
      security: [{ bearerAuth: [] }]
      parameters:
        - { name: vehicleId, in: path, required: true, schema: { type: string, format: uuid } }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  data: { $ref: "#/components/schemas/DispatchVehicle" }
        "403": { description: Not your vehicle. }
  /v1/dispatch/vehicles/{vehicleId}/documents:
    put:
      tags: [Dispatch]
      summary: Record the paperwork dates
      description: >-
        Sends a previously verified vehicle back to pending. A rider who could
        extend their own insurance date on a verified vehicle would make the
        check ceremonial.
      security: [{ bearerAuth: [] }]
      parameters:
        - { name: vehicleId, in: path, required: true, schema: { type: string, format: uuid } }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                insurance_expires_at: { type: string, format: date-time, nullable: true }
                roadworthiness_expires_at: { type: string, format: date-time, nullable: true }
                licence_expires_at: { type: string, format: date-time, nullable: true }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  data: { $ref: "#/components/schemas/DispatchVehicle" }
        "403": { description: Not your vehicle. }
  /v1/dispatch/vehicles/{vehicleId}/submit:
    post:
      tags: [Dispatch]
      summary: Put the vehicle in front of an operator
      security: [{ bearerAuth: [] }]
      parameters:
        - { name: vehicleId, in: path, required: true, schema: { type: string, format: uuid } }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  data: { $ref: "#/components/schemas/DispatchVehicle" }
        "422": { description: A retired vehicle cannot be resubmitted. }
  /v1/dispatch/vehicles/{vehicleId}/primary:
    post:
      tags: [Dispatch]
      summary: Nominate the primary vehicle
      security: [{ bearerAuth: [] }]
      parameters:
        - { name: vehicleId, in: path, required: true, schema: { type: string, format: uuid } }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  data: { $ref: "#/components/schemas/DispatchVehicle" }
        "422": { description: A retired vehicle cannot be made primary. }
  /v1/admin/dispatch/queue:
    get:
      tags: [Dispatch Admin]
      summary: Deliveries still looking for a rider
      description: Longest wait first. Requires dispatch.read. Returns no coordinates.
      security: [{ bearerAuth: [] }]
      parameters:
        - { name: limit, in: query, schema: { type: integer, minimum: 1, maximum: 200, default: 50 } }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items: { $ref: "#/components/schemas/DispatchRequestSummary" }
        "403": { description: Requires dispatch.read. }
  /v1/admin/dispatch/active:
    get:
      tags: [Dispatch Admin]
      summary: Deliveries somebody is carrying right now
      security: [{ bearerAuth: [] }]
      parameters:
        - { name: limit, in: query, schema: { type: integer, minimum: 1, maximum: 500, default: 100 } }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items: { $ref: "#/components/schemas/DispatchAssignmentAdmin" }
        "403": { description: Requires dispatch.read. }
  /v1/admin/dispatch/failures:
    get:
      tags: [Dispatch Admin]
      summary: Searches that ended without a rider
      security: [{ bearerAuth: [] }]
      parameters:
        - { name: limit, in: query, schema: { type: integer, minimum: 1, maximum: 200, default: 50 } }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items: { $ref: "#/components/schemas/DispatchRequestSummary" }
                  meta:
                    type: object
                    properties:
                      reasons: { type: array, items: { type: object } }
        "403": { description: Requires dispatch.read. }
  /v1/admin/dispatch/availability:
    get:
      tags: [Dispatch Admin]
      summary: How much of the fleet could take work
      description: >-
        Counts, never positions. The gap between riders reporting a position and
        riders with a dispatchable vehicle is what tells an operations team
        whether they have a supply problem or a paperwork one.
      security: [{ bearerAuth: [] }]
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  data: { $ref: "#/components/schemas/DispatchAvailability" }
        "403": { description: Requires dispatch.read. }
  /v1/admin/dispatch/health:
    get:
      tags: [Dispatch Admin]
      summary: Is dispatch healthy right now
      description: >-
        Says whether the engine is switched on, how many customers are waiting
        and how long the oldest has been. The engine ships off.
      security: [{ bearerAuth: [] }]
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  data: { $ref: "#/components/schemas/DispatchHealth" }
        "403": { description: Requires dispatch.read. }
  /v1/admin/dispatch/vehicles/queue:
    get:
      tags: [Dispatch Admin]
      summary: Vehicles waiting on an operator's decision
      description: Oldest first — any other order lets a rider wait indefinitely.
      security: [{ bearerAuth: [] }]
      parameters:
        - { name: limit, in: query, schema: { type: integer, minimum: 1, maximum: 200, default: 50 } }
        - { name: offset, in: query, schema: { type: integer, minimum: 0, default: 0 } }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items: { $ref: "#/components/schemas/DispatchVehicle" }
                  meta:
                    type: object
                    properties:
                      total: { type: integer }
        "403": { description: Requires dispatch.read. }
  /v1/admin/dispatch/requests/{requestId}/history:
    get:
      tags: [Dispatch Admin]
      summary: Everything tried for one delivery
      description: >-
        The rejection breakdown is why this endpoint exists — "eleven riders
        nearby, nine stale locations" is a next action, and "no eligible riders"
        is not. Operators see the score internals; riders do not.
      security: [{ bearerAuth: [] }]
      parameters:
        - { name: requestId, in: path, required: true, schema: { type: string, format: uuid } }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: object
                    properties:
                      request: { $ref: "#/components/schemas/DispatchRequestSummary" }
                      attempts:
                        type: array
                        items: { $ref: "#/components/schemas/DispatchAttempt" }
                      offers: { type: array, items: { type: object } }
        "403": { description: Requires dispatch.read. }
        "404": { description: No such dispatch request. }
  /v1/admin/dispatch/requests/{requestId}/assign:
    post:
      tags: [Dispatch Admin]
      summary: Put a delivery on a specific rider
      description: >-
        Break-glass. Goes through the same exclusivity guarantees — the partial
        unique indexes do not care that a human made the decision. Eligibility
        is deliberately not re-checked, which is what makes it an override; the
        audit entry is what makes that accountable. Requires dispatch.manage and
        a stated reason.
      security: [{ bearerAuth: [] }]
      parameters:
        - { name: requestId, in: path, required: true, schema: { type: string, format: uuid } }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [rider_id, reason]
              properties:
                rider_id: { type: string, format: uuid }
                reason: { type: string, maxLength: 255 }
      responses:
        "201":
          description: Assigned.
          content:
            application/json:
              schema:
                type: object
                properties:
                  data: { $ref: "#/components/schemas/DispatchAssignmentAdmin" }
        "403": { description: Requires dispatch.manage. }
        "409": { description: The delivery or the rider is already taken. }
        "422": { description: No stated reason. }
  /v1/admin/dispatch/requests/{requestId}/cancel:
    post:
      tags: [Dispatch Admin]
      summary: Stop a search
      security: [{ bearerAuth: [] }]
      parameters:
        - { name: requestId, in: path, required: true, schema: { type: string, format: uuid } }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [reason]
              properties:
                reason: { type: string, maxLength: 255 }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  data: { $ref: "#/components/schemas/DispatchRequestSummary" }
        "403": { description: Requires dispatch.manage. }
        "422": { description: "No stated reason, or the search already ended." }
  /v1/admin/dispatch/assignments/{assignmentId}/reassign:
    post:
      tags: [Dispatch Admin]
      summary: Take a delivery off the rider holding it
      description: >-
        Opens a new search rather than reopening the old one, and the
        replacement inherits what is left of the customer's original deadline
        rather than a fresh grant. Refused once the rider has the food — past
        pickup that is an operational incident, not a dispatch decision.
      security: [{ bearerAuth: [] }]
      parameters:
        - { name: assignmentId, in: path, required: true, schema: { type: string, format: uuid } }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [reason]
              properties:
                reason: { type: string, maxLength: 255 }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: object
                    properties:
                      replacement_request:
                        type: object
                        nullable: true
                        allOf:
                          - $ref: "#/components/schemas/DispatchRequestSummary"
                      needs_manual_handling:
                        type: boolean
                        description: >-
                          True when too little of the deadline remained to open a
                          fresh search. The delivery needs a human.
        "403": { description: Requires dispatch.manage. }
        "422": { description: The rider already has the food. }
  /v1/admin/dispatch/vehicles/{vehicleId}/approve:
    post:
      tags: [Dispatch Admin]
      summary: Accept a vehicle's paperwork
      description: The only path to a dispatchable vehicle. Requires dispatch.manage.
      security: [{ bearerAuth: [] }]
      parameters:
        - { name: vehicleId, in: path, required: true, schema: { type: string, format: uuid } }
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              properties:
                note: { type: string, maxLength: 500 }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  data: { $ref: "#/components/schemas/DispatchVehicle" }
        "403": { description: Requires dispatch.manage. }
        "409": { description: Another operator decided first. }
        "422": { description: The documents have already expired. }
  /v1/admin/dispatch/vehicles/{vehicleId}/reject:
    post:
      tags: [Dispatch Admin]
      summary: Refuse a vehicle's paperwork
      security: [{ bearerAuth: [] }]
      parameters:
        - { name: vehicleId, in: path, required: true, schema: { type: string, format: uuid } }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [reason]
              properties:
                reason: { type: string, maxLength: 500 }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  data: { $ref: "#/components/schemas/DispatchVehicle" }
        "403": { description: Requires dispatch.manage. }
  /v1/admin/dispatch/vehicles/{vehicleId}/suspend:
    post:
      tags: [Dispatch Admin]
      summary: Withdraw a vehicle from service
      security: [{ bearerAuth: [] }]
      parameters:
        - { name: vehicleId, in: path, required: true, schema: { type: string, format: uuid } }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [reason]
              properties:
                reason: { type: string, maxLength: 500 }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  data: { $ref: "#/components/schemas/DispatchVehicle" }
        "403": { description: Requires dispatch.manage. }

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
    apiKeyAuth:
      type: http
      scheme: bearer
      description: "Public API key sent as `Authorization: Bearer <key>` (or the `X-Api-Key` header)."
    oauth2:
      type: oauth2
      description: >
        OAuth2 access token for the public API, layered on the same scope model
        as API keys. Presented as `Authorization: Bearer <access_token>`.
      flows:
        authorizationCode:
          authorizationUrl: https://api.eruofood.ai/v1/oauth/authorize
          tokenUrl: https://api.eruofood.ai/api/public/v1/oauth/token
          refreshUrl: https://api.eruofood.ai/api/public/v1/oauth/token
          scopes:
            "foods:read": Read the public food catalogue.
            "recipes:read": Read published recipes.
            "restaurants:read": Read restaurant/vendor profiles.
            "products:read": Read the grocery/product catalogue.
            "nutrition:read": Read nutrition information.
            "search:read": Query the public search index.
            "orders:read": Read the caller's orders.
            "orders:write": Create, update and cancel the caller's orders.
        clientCredentials:
          tokenUrl: https://api.eruofood.ai/api/public/v1/oauth/token
          scopes:
            "foods:read": Read the public food catalogue.
            "recipes:read": Read published recipes.
            "restaurants:read": Read restaurant/vendor profiles.
            "products:read": Read the grocery/product catalogue.
            "nutrition:read": Read nutrition information.
            "search:read": Query the public search index.

  parameters:
    IdempotencyKey:
      name: Idempotency-Key
      in: header
      required: false
      description: >
        A client-generated key that makes this request safe to retry. The first
        request under a given key is executed and its response stored; any later
        request with the same key and the same body returns that stored response
        with status 200 instead of performing the operation again. Reusing a key
        with a different body is rejected with 422. A duplicate that arrives
        while the first is still running is rejected with 409 and may be retried.
        Keys expire after 24 hours. Omitting the header preserves the previous
        at-least-once behaviour.
      schema: { type: string, maxLength: 255 }
      example: "6f1a2c4e-9b3d-4a71-8f2e-5c7d9a0b1e33"

  responses:
    Error:
      description: Error envelope.
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }
    IdempotencyInFlight:
      description: >
        A request carrying this idempotency key is still being processed, or the
        resource was modified concurrently. Nothing was changed — retry shortly.
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }
    Message:
      description: Simple message envelope.
      content:
        application/json:
          schema:
            type: object
            properties:
              data:
                type: object
                properties:
                  message: { type: string }
    User:
      description: A user resource.
      content:
        application/json:
          schema:
            type: object
            properties:
              data: { $ref: "#/components/schemas/User" }
    AuthSuccess:
      description: Authenticated — user + tokens.
      content:
        application/json:
          schema:
            type: object
            properties:
              data: { $ref: "#/components/schemas/AuthPayload" }
    AuthSuccessOrChallenge:
      description: Either authenticated (user + tokens) or a two-factor challenge.
      content:
        application/json:
          schema:
            oneOf:
              - type: object
                properties:
                  data: { $ref: "#/components/schemas/AuthPayload" }
              - type: object
                properties:
                  data: { $ref: "#/components/schemas/TwoFactorChallenge" }
    NutritionAdvice:
      description: AI personalisation advice + provenance.
      content:
        application/json:
          schema:
            type: object
            properties:
              data: { $ref: "#/components/schemas/NutritionAdvicePayload" }

  schemas:
    VerificationStatus:
      type: string
      description: >-
        The verification state machine. Transitions are enforced by the domain
        and recorded individually: a verified case may only decay (expire, or be
        sent back for reverification), so a late "declined" callback can never
        silently strip somebody's verification.
      enum:
        - not_started
        - pending
        - processing
        - requires_review
        - verified
        - rejected
        - expired
        - reverification_required
    VerificationLevel:
      type: string
      description: >-
        Progressive assurance. Every account starts at `basic` and stays there
        until an operation needs more; a stronger level satisfies any weaker
        requirement.
      enum: [basic, phone, identity]
    Coordinates:
      type: object
      nullable: true
      properties:
        latitude: { type: number, format: double }
        longitude: { type: number, format: double }
    OwnedLocation:
      type: object
      nullable: true
      description: The place a saved address points at, at full precision — it is the caller's own.
      properties:
        id: { type: string, format: uuid }
        formatted_address: { type: string, nullable: true }
        area: { type: string, nullable: true, description: "The coarse part — district, city, state." }
        country_code: { type: string, nullable: true }
        coordinates: { $ref: "#/components/schemas/Coordinates" }
        precision: { type: string, enum: [rooftop, range_interpolated, geometric_centre, approximate, unknown] }
        status: { type: string, enum: [unverified, geocoded, confirmed, disputed] }
        is_deliverable: { type: boolean, description: "Whether the point is precise enough to send a rider to." }
    CustomerAddress:
      type: object
      properties:
        id: { type: string, format: uuid }
        label: { type: string, enum: [home, work, other] }
        display_name: { type: string }
        custom_name: { type: string, nullable: true }
        delivery_instructions: { type: string, nullable: true, description: "Personal, and returned only to the owner." }
        contact_phone: { type: string, nullable: true }
        is_default: { type: boolean }
        last_used_at: { type: string, format: date-time, nullable: true }
        created_at: { type: string, format: date-time }
        location: { $ref: "#/components/schemas/OwnedLocation" }
    PublicLocation:
      type: object
      nullable: true
      description: >-
        A merchant's location as the public sees it. The point is rounded to
        about 110 metres — enough to place a restaurant on a map, not enough to
        identify a doorway — and precision_metres states how wide it is so a
        client can draw an honest circle rather than a falsely precise pin.
      properties:
        area: { type: string, nullable: true }
        locality: { type: string, nullable: true }
        admin_area: { type: string, nullable: true }
        country_code: { type: string, nullable: true }
        coordinates: { $ref: "#/components/schemas/Coordinates" }
        precision_metres: { type: integer }
    MerchantLocation:
      type: object
      nullable: true
      description: A merchant's own location, at full precision.
      properties:
        id: { type: string, format: uuid }
        formatted_address: { type: string, nullable: true }
        area: { type: string, nullable: true }
        country_code: { type: string, nullable: true }
        coordinates: { $ref: "#/components/schemas/Coordinates" }
        precision: { type: string, enum: [rooftop, range_interpolated, geometric_centre, approximate, unknown] }
        status: { type: string, enum: [unverified, geocoded, confirmed, disputed] }
        is_deliverable: { type: boolean }
        geocoded_at: { type: string, format: date-time, nullable: true }
        verified_at: { type: string, format: date-time, nullable: true }
    PlaceSuggestion:
      type: object
      properties:
        description: { type: string }
        main_text: { type: string, nullable: true }
        secondary_text: { type: string, nullable: true }
        provider_place_id: { type: string }
    DeliveryZone:
      type: object
      properties:
        id: { type: string, format: uuid }
        name: { type: string }
        owner_type: { type: string, enum: [vendor, store, platform] }
        owner_id: { type: string, format: uuid, nullable: true }
        zone_type: { type: string, enum: [radius, polygon, administrative] }
        centre: { $ref: "#/components/schemas/Coordinates" }
        radius_metres: { type: integer, nullable: true }
        polygon:
          type: array
          nullable: true
          description: "[longitude, latitude] pairs, GeoJSON order."
          items: { type: array, items: { type: number, format: double } }
        country_code: { type: string, nullable: true }
        admin_area: { type: string, nullable: true }
        fee_minor: { type: integer, nullable: true }
        min_order_minor: { type: integer, nullable: true }
        is_restricted: { type: boolean, description: "An exclusion — the inverse of a service area." }
        is_active: { type: boolean }
        priority: { type: integer, description: "Lowest wins, so an exclusion can sit inside a broader area." }
    RiderLocation:
      type: object
      description: >-
        Deliberately spare. The account behind the rider is not named, the
        accuracy is reported so a poor fix cannot masquerade as a good one, and
        the age is explicit — a position with no timestamp was exactly what made
        the pre-M25 columns unusable.
      properties:
        rider_id: { type: string, format: uuid }
        coordinates: { $ref: "#/components/schemas/Coordinates" }
        accuracy_metres: { type: number, format: double, nullable: true }
        heading_degrees: { type: number, format: double, nullable: true }
        recorded_at: { type: string, format: date-time }
        age_seconds: { type: integer }
        is_stale: { type: boolean }
    GeoRoute:
      type: object
      nullable: true
      description: >-
        A measured journey. `source` and `is_billable` travel with every quote
        because a client that cannot tell a fresh measurement from a stale one
        will eventually present one as the other. A source of `haversine` is
        never billable, at any age.
      properties:
        distance_metres: { type: integer }
        duration_seconds: { type: integer }
        duration_in_traffic_seconds: { type: integer, nullable: true }
        travel_mode: { type: string, enum: [driving, two_wheeler, bicycle, walking] }
        source: { type: string, enum: [provider, cache, haversine] }
        calculated_at: { type: string, format: date-time }
        age_seconds: { type: integer }
        is_billable: { type: boolean }
    GeoProviderHealth:
      type: object
      properties:
        window: { type: string, example: 24h }
        capabilities:
          type: array
          items:
            type: object
            properties:
              provider: { type: string }
              capability: { type: string, enum: [geocode, reverse_geocode, route, matrix, autocomplete] }
              total: { type: integer }
              served_from_cache: { type: integer }
              billable: { type: integer, description: "The only part that costs anything." }
              failed: { type: integer }
              cache_hit_rate: { type: number, format: double }
              failure_rate: { type: number, format: double }
              avg_duration_ms: { type: integer, nullable: true }
        daily_quota:
          type: object
          properties:
            billable_calls_today: { type: integer }
            limit: { type: integer }
            remaining: { type: integer }
        failure_codes:
          type: array
          items:
            type: object
            properties:
              code: { type: string, description: "A normalised code, never the provider's own message." }
              total: { type: integer }
    GeoCoverage:
      type: object
      properties:
        locations:
          type: object
          properties:
            total: { type: integer }
            awaiting_geocode: { type: integer }
            confirmed: { type: integer }
            disputed: { type: integer }
            precise_enough_to_deliver: { type: integer }
        riders:
          type: object
          properties:
            reporting_recently: { type: integer, description: "A count, never positions." }
            stale_after_seconds: { type: integer }
    VerificationCase:
      type: object
      description: One subject's verification of one kind. A subject holds at most one open case per case type.
      properties:
        id: { type: string, format: uuid }
        subject_type: { type: string, enum: [customer, rider, business] }
        subject_id: { type: string, format: uuid }
        case_type: { type: string, enum: [identity, business] }
        country_code: { type: string, example: "NG" }
        status: { $ref: "#/components/schemas/VerificationStatus" }
        required_level: { $ref: "#/components/schemas/VerificationLevel" }
        provider: { type: string, nullable: true, enum: [didit, cac, manual, mock] }
        hosted_url:
          type: string
          format: uri
          nullable: true
          description: Where the subject completes the provider's flow. Present only while an attempt is live.
        decision_reason_code: { type: string, nullable: true }
        verified_at: { type: string, format: date-time, nullable: true }
        expires_at: { type: string, format: date-time, nullable: true }
        created_at: { type: string, format: date-time }
        updated_at: { type: string, format: date-time }
    VerificationStatusChange:
      type: object
      description: One transition. Append-only — history is corrected by appending, never by editing.
      properties:
        from_status: { $ref: "#/components/schemas/VerificationStatus" }
        to_status: { $ref: "#/components/schemas/VerificationStatus" }
        actor_type: { type: string, enum: [system, provider, admin, subject] }
        actor_id:
          type: string
          nullable: true
          description: A person's id, or the name of the component that acted (`reconciliation`, a provider).
        reason_code: { type: string, nullable: true }
        note: { type: string, nullable: true }
        occurred_at: { type: string, format: date-time }
    VerificationDocument:
      type: object
      description: >-
        What the platform keeps about a document, and deliberately nothing more.
        There is no image, file path or blob anywhere in this context — the
        provider holds the artefact.
      properties:
        id: { type: string, format: uuid }
        document_type: { type: string, enum: [passport, national_id, drivers_licence, residence_permit, voters_card, other] }
        issuing_country: { type: string, nullable: true }
        number_last4:
          type: string
          nullable: true
          description: The last four characters only — enough to reconcile a support call, useless to an attacker, and encrypted at rest.
        expires_on: { type: string, format: date, nullable: true }
        created_at: { type: string, format: date-time }
    BusinessProfile:
      type: object
      properties:
        id: { type: string, format: uuid }
        business_kind: { type: string, enum: [restaurant, grocery] }
        business_id: { type: string, format: uuid }
        legal_name: { type: string }
        registration_number: { type: string, description: Encrypted at rest; returned only to the owning merchant and to holders of the PII permission. }
        country_code: { type: string }
        status: { $ref: "#/components/schemas/VerificationStatus" }
        created_at: { type: string, format: date-time }
    BusinessRepresentative:
      type: object
      properties:
        id: { type: string, format: uuid }
        business_profile_id: { type: string, format: uuid }
        user_id: { type: string, format: uuid }
        full_name: { type: string }
        role: { type: string }
        is_primary: { type: boolean }
        ownership_percentage: { type: integer, nullable: true }
        identity_case_id: { type: string, format: uuid, nullable: true }
    RegistryLookup:
      type: object
      description: >-
        The outcome of a business-registry check. `found`, `active` and `matched`
        are reported separately because "no such company" and "a real company
        under a different name" are materially different things to a reviewer.
      properties:
        authority: { type: string, example: "CAC" }
        found: { type: boolean }
        active: { type: boolean }
        matched: { type: boolean, description: "Whether the claimed name matches the registered one, allowing for suffix variation (Limited/Ltd/PLC)." }
        requires_manual_review: { type: boolean, description: True when the registry is unconfigured or unreachable — never treated as "assumed valid". }
        registered_name: { type: string, nullable: true }
        note: { type: string, nullable: true }
    SystemStatus:
      type: object
      required: [status, service, version, environment, timestamp]
      properties:
        status: { type: string, enum: [ok, degraded] }
        service: { type: string }
        version: { type: string }
        environment: { type: string }
        timestamp: { type: string, format: date-time }

    RegisterRequest:
      type: object
      required: [name, email, password, password_confirmation]
      properties:
        name: { type: string, minLength: 2, maxLength: 120 }
        email: { type: string, format: email }
        password: { type: string, minLength: 8 }
        password_confirmation: { type: string }

    LoginRequest:
      type: object
      required: [email, password]
      properties:
        email: { type: string, format: email }
        password: { type: string }

    ResetPasswordRequest:
      type: object
      required: [email, token, password, password_confirmation]
      properties:
        email: { type: string, format: email }
        token: { type: string }
        password: { type: string, minLength: 8 }
        password_confirmation: { type: string }

    Tokens:
      type: object
      properties:
        access_token: { type: string }
        token_type: { type: string, example: Bearer }
        expires_in: { type: integer, description: Access-token lifetime in seconds. }
        refresh_token: { type: string }

    AuthPayload:
      type: object
      properties:
        user: { $ref: "#/components/schemas/User" }
        tokens: { $ref: "#/components/schemas/Tokens" }

    TwoFactorChallenge:
      type: object
      properties:
        two_factor_required: { type: boolean, example: true }
        challenge_token: { type: string }

    TwoFactorEnrollment:
      type: object
      properties:
        secret: { type: string }
        provisioning_uri: { type: string, description: otpauth:// URI for QR codes. }
        recovery_codes:
          type: array
          items: { type: string }

    User:
      type: object
      properties:
        id: { type: string, format: uuid }
        name: { type: string }
        email: { type: string, format: email }
        phone: { type: string, nullable: true }
        email_verified: { type: boolean }
        avatar_url: { type: string, nullable: true }
        roles:
          type: array
          items: { type: string, enum: [admin, moderator, user] }
        permissions:
          type: array
          items: { type: string }
        preferences: { type: object, additionalProperties: true }
        two_factor_enabled: { type: boolean }
        status: { type: string, enum: [active, suspended] }

    Session:
      type: object
      properties:
        session_id: { type: string, format: uuid }
        ip_address: { type: string, nullable: true }
        user_agent: { type: string, nullable: true }
        created_at: { type: string, format: date-time }
        last_used_at: { type: string, format: date-time, nullable: true }

    PageMeta:
      type: object
      properties:
        page: { type: integer }
        per_page: { type: integer }
        total: { type: integer }

    Error:
      type: object
      required: [error]
      properties:
        error:
          type: object
          required: [code, message]
          properties:
            code: { type: string, example: INVALID_CREDENTIALS }
            message: { type: string }
            details:
              type: array
              items: { type: object }

    Category:
      type: object
      properties:
        id: { type: string, format: uuid }
        name: { type: string }
        slug: { type: string }
        type: { type: string, enum: [soup, swallow, rice, protein, snack, street_food, drink, dessert, breakfast, side_dish] }
        description: { type: string, nullable: true }
        sort_order: { type: integer }
        active: { type: boolean }

    LocalName:
      type: object
      properties:
        name: { type: string, example: Iyan }
        language: { type: string, example: yoruba }

    Nutrition:
      type: object
      properties:
        calories: { type: integer }
        protein_grams: { type: number }
        carbohydrate_grams: { type: number }
        fat_grams: { type: number }
        fiber_grams: { type: number }
        basis: { type: string, example: per_serving }

    Ingredient:
      type: object
      properties:
        id: { type: string, format: uuid }
        name: { type: string }
        slug: { type: string }
        description: { type: string, nullable: true }
        local_names: { type: array, items: { $ref: "#/components/schemas/LocalName" } }
        nutrition_per_100g: { $ref: "#/components/schemas/Nutrition" }

    FoodSummary:
      type: object
      properties:
        id: { type: string, format: uuid }
        name: { type: string }
        slug: { type: string }
        category_id: { type: string, format: uuid }
        region: { type: string }
        tags: { type: array, items: { type: string } }
        status: { type: string, enum: [draft, published, archived] }
        primary_image: { type: string, nullable: true }

    Food:
      allOf:
        - $ref: "#/components/schemas/FoodSummary"
        - type: object
          properties:
            description: { type: string, nullable: true }
            states: { type: array, items: { type: string } }
            local_names: { type: array, items: { $ref: "#/components/schemas/LocalName" } }
            nutrition: { $ref: "#/components/schemas/Nutrition" }
            images: { type: array, items: { type: string } }
            video_url: { type: string, nullable: true }

    FoodInput:
      type: object
      required: [name, category_id, region]
      properties:
        name: { type: string }
        category_id: { type: string, format: uuid }
        region: { type: string, enum: [north_central, north_east, north_west, south_east, south_south, south_west, nationwide] }
        description: { type: string, nullable: true }
        states: { type: array, items: { type: string } }
        local_names: { type: array, items: { $ref: "#/components/schemas/LocalName" } }
        nutrition: { $ref: "#/components/schemas/Nutrition" }
        tags: { type: array, items: { type: string } }

    RecipeIngredientInput:
      type: object
      required: [name, amount, unit]
      properties:
        name: { type: string }
        amount: { type: number }
        unit: { type: string, enum: [g, kg, ml, l, cup, tbsp, tsp, piece, pinch, handful, wrap, to_taste] }
        ingredient_id: { type: string, format: uuid, nullable: true }
        note: { type: string, nullable: true }

    CookingStepInput:
      type: object
      required: [order, instruction]
      properties:
        order: { type: integer }
        instruction: { type: string }
        duration_minutes: { type: integer, nullable: true }

    RecipeInput:
      type: object
      required: [food_id, title, prep_time_minutes, cook_time_minutes, difficulty, serving_size, ingredients, steps]
      properties:
        food_id: { type: string, format: uuid }
        title: { type: string }
        summary: { type: string, nullable: true }
        prep_time_minutes: { type: integer }
        cook_time_minutes: { type: integer }
        difficulty: { type: string, enum: [easy, medium, hard] }
        serving_size: { type: integer }
        ingredients: { type: array, items: { $ref: "#/components/schemas/RecipeIngredientInput" } }
        steps: { type: array, items: { $ref: "#/components/schemas/CookingStepInput" } }
        tips: { type: array, items: { type: string } }
        tags: { type: array, items: { type: string } }

    RecipeSummary:
      type: object
      properties:
        id: { type: string, format: uuid }
        food_id: { type: string, format: uuid }
        title: { type: string }
        slug: { type: string }
        summary: { type: string, nullable: true }
        difficulty: { type: string, enum: [easy, medium, hard] }
        prep_time_minutes: { type: integer }
        cook_time_minutes: { type: integer }
        total_time_minutes: { type: integer }
        serving_size: { type: integer }
        rating_average: { type: number }
        rating_count: { type: integer }
        tags: { type: array, items: { type: string } }
        status: { type: string, enum: [draft, published, archived] }

    Recipe:
      allOf:
        - $ref: "#/components/schemas/RecipeSummary"
        - type: object
          properties:
            author_id: { type: string, format: uuid }
            version: { type: integer }
            ingredients: { type: array, items: { $ref: "#/components/schemas/RecipeIngredientInput" } }
            steps:
              type: array
              items:
                type: object
                properties:
                  order: { type: integer }
                  instruction: { type: string }
                  image_url: { type: string, nullable: true }
                  duration_minutes: { type: integer, nullable: true }
            tips: { type: array, items: { type: string } }
            related_recipe_ids: { type: array, items: { type: string, format: uuid } }
            is_favourited: { type: boolean }

    RecipeReview:
      type: object
      properties:
        id: { type: string, format: uuid }
        recipe_id: { type: string, format: uuid }
        user_id: { type: string, format: uuid }
        rating: { type: integer, minimum: 1, maximum: 5 }
        comment: { type: string, nullable: true }
        created_at: { type: string, format: date-time }

    # ---- AI Engine schemas (Milestone 4) ----
    AiFeature:
      type: string
      enum:
        - recipe_generation
        - recipe_improvement
        - recipe_translation
        - ingredient_substitution
        - cooking_assistant
        - meal_suggestions
        - leftover_recipes
        - recipe_summarization
        - cooking_tips
        - food_description

    AiMeta:
      type: object
      description: Provenance for a generation (provider, model, cache, tokens).
      properties:
        provider: { type: string, enum: [anthropic, openai, gemini, local, mock] }
        model: { type: string }
        cached: { type: boolean }
        finish_reason: { type: string }
        tokens:
          type: object
          properties:
            input: { type: integer }
            output: { type: integer }
            total: { type: integer }

    AiStructuredResult:
      type: object
      description: A structured (JSON) generation result plus its metadata.
      properties:
        content: { type: object, additionalProperties: true }
        meta: { $ref: "#/components/schemas/AiMeta" }

    AiTextResult:
      type: object
      description: A plain-text generation result plus its metadata.
      properties:
        content: { type: string }
        meta: { $ref: "#/components/schemas/AiMeta" }

    AiRecipeGenerationRequest:
      type: object
      required: [dish_name]
      properties:
        dish_name: { type: string, minLength: 2, maxLength: 160 }
        servings: { type: integer, minimum: 1, maximum: 50 }
        difficulty: { type: string, enum: [easy, medium, hard] }
        dietary_preferences: { type: array, items: { type: string } }
        available_ingredients: { type: array, items: { type: string } }
        notes: { type: string, nullable: true }

    AiRecipeImprovementRequest:
      type: object
      required: [title, ingredients, steps]
      properties:
        title: { type: string }
        ingredients: { type: array, items: { type: string } }
        steps: { type: array, items: { type: string } }
        goal: { type: string, nullable: true }

    AiLeftoverRequest:
      type: object
      required: [ingredients]
      properties:
        ingredients: { type: array, items: { type: string } }
        dietary_preferences: { type: array, items: { type: string } }
        meal_type: { type: string, nullable: true }

    AiSummarizationRequest:
      type: object
      required: [content]
      properties:
        content: { type: string, maxLength: 8000 }
        max_words: { type: integer, minimum: 10, maximum: 400 }

    AiTranslationRequest:
      type: object
      required: [content, target_language]
      properties:
        content: { type: string, maxLength: 8000 }
        target_language: { type: string }

    AiFoodDescriptionRequest:
      type: object
      required: [food_name]
      properties:
        food_name: { type: string, minLength: 2, maxLength: 160 }
        region: { type: string, nullable: true }
        keywords: { type: array, items: { type: string } }

    AiCookingTipsRequest:
      type: object
      required: [topic]
      properties:
        topic: { type: string, minLength: 2, maxLength: 160 }
        skill_level: { type: string, enum: [beginner, "home cook", intermediate, advanced] }

    AiSubstitutionRequest:
      type: object
      required: [ingredient]
      properties:
        ingredient: { type: string }
        reason: { type: string, nullable: true }
        dish_context: { type: string, nullable: true }
        dietary_preferences: { type: array, items: { type: string } }

    AiMealSuggestionRequest:
      type: object
      properties:
        meal_type: { type: string }
        dietary_preferences: { type: array, items: { type: string } }
        count: { type: integer, minimum: 1, maximum: 10 }
        budget: { type: string, nullable: true }

    AiChatRequest:
      type: object
      required: [message]
      properties:
        message: { type: string, minLength: 1, maxLength: 4000 }
        conversation_id: { type: string, format: uuid, nullable: true }

    ChatMessage:
      type: object
      properties:
        role: { type: string, enum: [system, user, assistant] }
        content: { type: string }
        created_at: { type: string, format: date-time }

    ConversationSummary:
      type: object
      properties:
        id: { type: string, format: uuid }
        title: { type: string }
        feature: { $ref: "#/components/schemas/AiFeature" }
        message_count: { type: integer }
        created_at: { type: string, format: date-time }
        updated_at: { type: string, format: date-time }

    Conversation:
      allOf:
        - $ref: "#/components/schemas/ConversationSummary"
        - type: object
          properties:
            messages: { type: array, items: { $ref: "#/components/schemas/ChatMessage" } }

    AiChatTurn:
      type: object
      properties:
        conversation_id: { type: string, format: uuid }
        reply: { type: string }
        conversation: { $ref: "#/components/schemas/Conversation" }
        meta: { $ref: "#/components/schemas/AiMeta" }

    AiUsageSummary:
      type: object
      properties:
        requests: { type: integer }
        cached_requests: { type: integer }
        input_tokens: { type: integer }
        output_tokens: { type: integer }
        total_tokens: { type: integer }
        cost_usd: { type: number }

    PromptTemplate:
      type: object
      properties:
        id: { type: string, format: uuid }
        feature: { $ref: "#/components/schemas/AiFeature" }
        version: { type: integer }
        name: { type: string }
        system_template: { type: string }
        user_template: { type: string }
        model: { type: string, nullable: true }
        variables: { type: array, items: { type: string } }
        active: { type: boolean }
        created_at: { type: string, format: date-time }

    PromptRequest:
      type: object
      required: [feature, name, user_template]
      properties:
        feature: { $ref: "#/components/schemas/AiFeature" }
        name: { type: string, maxLength: 160 }
        system_template: { type: string, nullable: true }
        user_template: { type: string }
        model: { type: string, nullable: true }
        variables: { type: array, items: { type: string } }
        activate: { type: boolean, default: true }

    # ---- Nutrition schemas (Milestone 5) ----
    NutritionFacts:
      type: object
      properties:
        calories: { type: number }
        protein_grams: { type: number }
        carb_grams: { type: number }
        fat_grams: { type: number }
        fibre_grams: { type: number }
        sugar_grams: { type: number }
        sodium_mg: { type: number }
        cholesterol_mg: { type: number }
        water_ml: { type: number }
        micronutrients: { type: object, additionalProperties: { type: number } }

    NutritionFactsInput:
      type: object
      required: [calories, protein_grams, carb_grams, fat_grams]
      properties:
        calories: { type: number, minimum: 0 }
        protein_grams: { type: number, minimum: 0 }
        carb_grams: { type: number, minimum: 0 }
        fat_grams: { type: number, minimum: 0 }
        fibre_grams: { type: number, minimum: 0 }
        sugar_grams: { type: number, minimum: 0 }
        sodium_mg: { type: number, minimum: 0 }
        cholesterol_mg: { type: number, minimum: 0 }
        water_ml: { type: number, minimum: 0 }
        micronutrients: { type: object, additionalProperties: { type: number } }

    NutritionItem:
      type: object
      properties:
        id: { type: string, format: uuid }
        name: { type: string }
        slug: { type: string }
        category: { type: string }
        serving_size:
          type: object
          properties: { label: { type: string }, grams: { type: number } }
        nutrition: { $ref: "#/components/schemas/NutritionFacts" }
        food_id: { type: string, format: uuid, nullable: true }

    NutritionItemRequest:
      type: object
      required: [name, serving_size, nutrition]
      properties:
        name: { type: string, minLength: 2, maxLength: 160 }
        category: { type: string }
        serving_size:
          type: object
          required: [label, grams]
          properties: { label: { type: string }, grams: { type: number, minimum: 0.1 } }
        nutrition: { $ref: "#/components/schemas/NutritionFactsInput" }
        food_id: { type: string, format: uuid, nullable: true }

    MacroTargets:
      type: object
      properties:
        protein_grams: { type: integer }
        carb_grams: { type: integer }
        fat_grams: { type: integer }

    NutritionAssessment:
      type: object
      properties:
        bmi: { type: number }
        bmi_category: { type: string, enum: [underweight, normal, overweight, obese] }
        bmr: { type: integer }
        tdee: { type: integer }
        calorie_target: { type: integer }
        macro_targets: { $ref: "#/components/schemas/MacroTargets" }

    CalculationRequest:
      type: object
      required: [weight_kg, height_cm, age, gender]
      properties:
        weight_kg: { type: number, minimum: 20, maximum: 500 }
        height_cm: { type: number, minimum: 50, maximum: 260 }
        age: { type: integer, minimum: 1, maximum: 120 }
        gender: { type: string, enum: [male, female, other] }
        activity_level: { type: string, enum: [sedentary, light, moderate, active, very_active] }
        goal: { type: string, enum: [lose_weight, maintain, gain_weight, gain_muscle] }

    HealthProfile:
      type: object
      nullable: true
      properties:
        user_id: { type: string, format: uuid }
        weight_kg: { type: number }
        height_cm: { type: number }
        age: { type: integer }
        gender: { type: string, enum: [male, female, other] }
        activity_level: { type: string, enum: [sedentary, light, moderate, active, very_active] }
        goal: { type: string, enum: [lose_weight, maintain, gain_weight, gain_muscle] }
        dietary_preferences: { type: array, items: { type: string } }
        allergies: { type: array, items: { type: string } }
        medical_restrictions: { type: array, items: { type: string } }
        updated_at: { type: string, format: date-time }

