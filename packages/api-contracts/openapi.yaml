        status: { type: string, enum: [active, disabled] }
        secret: { type: string, description: "Signing secret — returned only on create/rotate." }
        created_at: { type: string, format: date-time }
        updated_at: { type: string, format: date-time }
    DevWebhookDelivery:
      type: object
      properties:
        id: { type: string, format: uuid }
        event_id: { type: string }
        event: { type: string }
        status: { type: string, enum: [pending, delivered, retrying, failed] }
        attempts: { type: integer }
        last_response_code: { type: integer, nullable: true }
        created_at: { type: string, format: date-time }
        delivered_at: { type: string, format: date-time, nullable: true }
    DispatchOffer:
      type: object
      description: >-
        An offer as the rider it was made to sees it. Deliberately omits the
        score, the score breakdown, and anything about the other riders who were
        considered — a leaderboard of colleagues is not something a delivery app
        should hand out.
      properties:
        id: { type: string, format: uuid }
        delivery_id: { type: string, format: uuid }
        vehicle_id: { type: string, format: uuid, nullable: true }
        state: { type: string, enum: [offered, accepted, declined, expired, cancelled] }
        expires_at: { type: string, format: date-time }
        seconds_remaining: { type: integer, description: "Countdown, so the app need not trust the device clock." }
        eta_seconds: { type: integer, nullable: true }
        distance_metres: { type: integer, nullable: true }
    DispatchAssignment:
      type: object
      description: An assignment as the rider carrying it sees it.
      properties:
        id: { type: string, format: uuid }
        delivery_id: { type: string, format: uuid }
        vehicle_id: { type: string, format: uuid, nullable: true }
        state:
          type: string
          enum: [accepted, en_route_pickup, arrived_pickup, picked_up, in_transit, delivered, cancelled, reassignment_required]
        eta_seconds: { type: integer, nullable: true }
        accepted_at: { type: string, format: date-time }
        ended_at: { type: string, format: date-time, nullable: true }
        next_states:
          type: array
          description: >-
            What the app's next button may offer, decided by the server. A client
            computing its own transition table will eventually disagree with it.
          items: { type: string }
    DispatchAssignmentAdmin:
      type: object
      description: An assignment as operations sees it. Adds the rider; still no coordinates.
      properties:
        id: { type: string, format: uuid }
        request_id: { type: string, format: uuid }
        offer_id: { type: string, format: uuid }
        delivery_id: { type: string, format: uuid }
        rider_id: { type: string, format: uuid }
        vehicle_id: { type: string, format: uuid, nullable: true }
        state: { type: string }
        is_active: { type: boolean }
        eta_seconds: { type: integer, nullable: true }
        ended_reason: { type: string, nullable: true }
        accepted_at: { type: string, format: date-time }
        ended_at: { type: string, format: date-time, nullable: true }
    DispatchRequestSummary:
      type: object
      description: >-
        A delivery's search for a rider. Pickup and dropoff are deliberately
        absent — an operator who needs them reads the delivery, where Geo's
        presenter decides how much precision leaves the building.
      properties:
        id: { type: string, format: uuid }
        delivery_id: { type: string, format: uuid }
        order_id: { type: string, format: uuid }
        vendor_id: { type: string, format: uuid }
        state: { type: string, enum: [pending, dispatching, assigned, failed, cancelled] }
        required_vehicle_type: { type: string, enum: [bike, tricycle, car, bus] }
        attempt_count: { type: integer }
        max_attempts: { type: integer }
        assigned_rider_id: { type: string, format: uuid, nullable: true }
        failure_reason: { type: string, nullable: true }
        waiting_seconds: { type: integer, description: "How long the customer has been waiting." }
        expires_at: { type: string, format: date-time }
        has_expired: { type: boolean }
        created_at: { type: string, format: date-time }
    DispatchAttempt:
      type: object
      description: >-
        One round of looking. The rejection breakdown is the most useful field
        in this context when dispatch is struggling — it separates a platform
        outage from a fleet paperwork backlog.
      properties:
        attempt_number: { type: integer }
        search_radius_metres: { type: integer }
        raw_candidate_count: { type: integer }
        eligible_candidate_count: { type: integer }
        rejection_breakdown:
          type: object
          additionalProperties: { type: integer }
          description: "Rejection reason to rider count. Each rider counted once, under their first objection."
        dominant_rejection: { type: string, nullable: true }
        summary: { type: string, description: "A one-line explanation an operator can read without opening the JSON." }
        offered_rider_id: { type: string, format: uuid, nullable: true }
        offered_score: { type: number, format: double, nullable: true }
        outcome: { type: string, nullable: true }
        duration_ms: { type: integer }
        completed_at: { type: string, format: date-time }
    DispatchVehicle:
      type: object
      description: >-
        Status, verification state and document expiry are three separate fields
        because they fail independently. A verified vehicle whose insurance
        lapsed last night is still verified — its documents simply are not
        current, and it stops receiving work at the moment the policy lapses.
      properties:
        id: { type: string, format: uuid }
        rider_id: { type: string, format: uuid }
        type: { type: string, enum: [bike, tricycle, car, bus] }
        registration_number: { type: string, nullable: true }
        make: { type: string, nullable: true }
        model: { type: string, nullable: true }
        colour: { type: string, nullable: true }
        capacity_kg: { type: integer, nullable: true }
        capacity_litres: { type: integer, nullable: true }
        status: { type: string, enum: [pending_verification, active, suspended, retired] }
        verification_state: { type: string, enum: [unverified, pending, verified, rejected, expired] }
        verification_note: { type: string, nullable: true }
        is_primary: { type: boolean }
        is_dispatchable: { type: boolean, description: "Status, verification and document expiry, evaluated against the clock." }
        documents_current: { type: boolean }
        expires_soon: { type: boolean }
        insurance_expires_at: { type: string, format: date-time, nullable: true }
        roadworthiness_expires_at: { type: string, format: date-time, nullable: true }
        licence_expires_at: { type: string, format: date-time, nullable: true }
        verified_at: { type: string, format: date-time, nullable: true }
    DispatchAvailability:
      type: object
      description: Counts, never positions.
      properties:
        riders_online: { type: integer }
        riders_reporting_position: { type: integer }
        riders_carrying_a_delivery: { type: integer }
        vehicles_awaiting_verification: { type: integer }
        vehicles_expiring_soon: { type: integer }
        vehicles_expired: { type: integer }
    DispatchHealth:
      type: object
      properties:
        engine_enabled: { type: boolean, description: "Ships off. Turning it on changes how work reaches every rider." }
        manual_override_allowed: { type: boolean }
        searches_waiting: { type: integer }
        oldest_wait_seconds: { type: integer }
        searches_past_deadline: { type: integer }
        offers_awaiting_answer: { type: integer }
        availability: { $ref: "#/components/schemas/DispatchAvailability" }
    DevUsage:
      type: object
      properties:
        application_id: { type: string, format: uuid }
        quota:
          type: object
          properties:
            daily_used: { type: integer }
            daily_limit: { type: integer }
            monthly_used: { type: integer }
            monthly_limit: { type: integer }
        rate_limit:
          type: object
          properties:
            per_minute: { type: integer }
            burst: { type: integer }
