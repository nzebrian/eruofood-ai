    AiChatRequest:
      type: object
      required: [message]
      properties:
        message: { type: string, minLength: 1, maxLength: 4000 }
        conversation_id: { type: string, format: uuid, nullable: true }

    ChatMessage:
      type: object
      properties:
        role: { type: string, enum: [system, user, assistant] }
        content: { type: string }
        created_at: { type: string, format: date-time }

    ConversationSummary:
      type: object
      properties:
        id: { type: string, format: uuid }
        title: { type: string }
        feature: { $ref: "#/components/schemas/AiFeature" }
        message_count: { type: integer }
        created_at: { type: string, format: date-time }
        updated_at: { type: string, format: date-time }

    Conversation:
      allOf:
        - $ref: "#/components/schemas/ConversationSummary"
        - type: object
          properties:
            messages: { type: array, items: { $ref: "#/components/schemas/ChatMessage" } }

    AiChatTurn:
      type: object
      properties:
        conversation_id: { type: string, format: uuid }
        reply: { type: string }
        conversation: { $ref: "#/components/schemas/Conversation" }
        meta: { $ref: "#/components/schemas/AiMeta" }

    AiUsageSummary:
      type: object
      properties:
        requests: { type: integer }
        cached_requests: { type: integer }
        input_tokens: { type: integer }
        output_tokens: { type: integer }
        total_tokens: { type: integer }
        cost_usd: { type: number }

    PromptTemplate:
      type: object
      properties:
        id: { type: string, format: uuid }
        feature: { $ref: "#/components/schemas/AiFeature" }
        version: { type: integer }
        name: { type: string }
        system_template: { type: string }
        user_template: { type: string }
        model: { type: string, nullable: true }
        variables: { type: array, items: { type: string } }
        active: { type: boolean }
        created_at: { type: string, format: date-time }

    PromptRequest:
      type: object
      required: [feature, name, user_template]
      properties:
        feature: { $ref: "#/components/schemas/AiFeature" }
        name: { type: string, maxLength: 160 }
        system_template: { type: string, nullable: true }
        user_template: { type: string }
        model: { type: string, nullable: true }
        variables: { type: array, items: { type: string } }
        activate: { type: boolean, default: true }

    # ---- Nutrition schemas (Milestone 5) ----
    NutritionFacts:
      type: object
      properties:
        calories: { type: number }
        protein_grams: { type: number }
        carb_grams: { type: number }
        fat_grams: { type: number }
        fibre_grams: { type: number }
        sugar_grams: { type: number }
        sodium_mg: { type: number }
        cholesterol_mg: { type: number }
        water_ml: { type: number }
        micronutrients: { type: object, additionalProperties: { type: number } }

    NutritionFactsInput:
      type: object
      required: [calories, protein_grams, carb_grams, fat_grams]
      properties:
        calories: { type: number, minimum: 0 }
        protein_grams: { type: number, minimum: 0 }
        carb_grams: { type: number, minimum: 0 }
        fat_grams: { type: number, minimum: 0 }
        fibre_grams: { type: number, minimum: 0 }
        sugar_grams: { type: number, minimum: 0 }
        sodium_mg: { type: number, minimum: 0 }
        cholesterol_mg: { type: number, minimum: 0 }
        water_ml: { type: number, minimum: 0 }
        micronutrients: { type: object, additionalProperties: { type: number } }

    NutritionItem:
      type: object
      properties:
        id: { type: string, format: uuid }
        name: { type: string }
        slug: { type: string }
        category: { type: string }
        serving_size:
          type: object
          properties: { label: { type: string }, grams: { type: number } }
        nutrition: { $ref: "#/components/schemas/NutritionFacts" }
        food_id: { type: string, format: uuid, nullable: true }

    NutritionItemRequest:
      type: object
      required: [name, serving_size, nutrition]
      properties:
        name: { type: string, minLength: 2, maxLength: 160 }
        category: { type: string }
        serving_size:
          type: object
          required: [label, grams]
          properties: { label: { type: string }, grams: { type: number, minimum: 0.1 } }
        nutrition: { $ref: "#/components/schemas/NutritionFactsInput" }
        food_id: { type: string, format: uuid, nullable: true }

    MacroTargets:
      type: object
      properties:
        protein_grams: { type: integer }
        carb_grams: { type: integer }
        fat_grams: { type: integer }

    NutritionAssessment:
      type: object
      properties:
        bmi: { type: number }
        bmi_category: { type: string, enum: [underweight, normal, overweight, obese] }
        bmr: { type: integer }
        tdee: { type: integer }
        calorie_target: { type: integer }
        macro_targets: { $ref: "#/components/schemas/MacroTargets" }

    CalculationRequest:
      type: object
      required: [weight_kg, height_cm, age, gender]
      properties:
        weight_kg: { type: number, minimum: 20, maximum: 500 }
        height_cm: { type: number, minimum: 50, maximum: 260 }
        age: { type: integer, minimum: 1, maximum: 120 }
        gender: { type: string, enum: [male, female, other] }
        activity_level: { type: string, enum: [sedentary, light, moderate, active, very_active] }
        goal: { type: string, enum: [lose_weight, maintain, gain_weight, gain_muscle] }

    HealthProfile:
      type: object
      nullable: true
      properties:
        user_id: { type: string, format: uuid }
        weight_kg: { type: number }
        height_cm: { type: number }
        age: { type: integer }
        gender: { type: string, enum: [male, female, other] }
        activity_level: { type: string, enum: [sedentary, light, moderate, active, very_active] }
        goal: { type: string, enum: [lose_weight, maintain, gain_weight, gain_muscle] }
        dietary_preferences: { type: array, items: { type: string } }
        allergies: { type: array, items: { type: string } }
        medical_restrictions: { type: array, items: { type: string } }
        updated_at: { type: string, format: date-time }

    HealthProfileRequest:
      type: object
      required: [weight_kg, height_cm, age, gender, activity_level, goal]
      properties:
        weight_kg: { type: number, minimum: 20, maximum: 500 }
        height_cm: { type: number, minimum: 50, maximum: 260 }
        age: { type: integer, minimum: 1, maximum: 120 }
        gender: { type: string, enum: [male, female, other] }
        activity_level: { type: string, enum: [sedentary, light, moderate, active, very_active] }
        goal: { type: string, enum: [lose_weight, maintain, gain_weight, gain_muscle] }
        dietary_preferences: { type: array, items: { type: string } }
        allergies: { type: array, items: { type: string } }
        medical_restrictions: { type: array, items: { type: string } }

    DiaryEntry:
      type: object
      properties:
        id: { type: string, format: uuid }
        date: { type: string, format: date }
        meal_type: { type: string, enum: [breakfast, lunch, dinner, snack] }
        item_name: { type: string }
        servings: { type: number }
        nutrition_item_id: { type: string, format: uuid, nullable: true }
        nutrition: { $ref: "#/components/schemas/NutritionFacts" }

    DiaryEntryRequest:
      type: object
      required: [date, meal_type, servings]
      properties:
        date: { type: string, format: date }
        meal_type: { type: string, enum: [breakfast, lunch, dinner, snack] }
        servings: { type: number, minimum: 0.1, maximum: 100 }
        nutrition_item_id: { type: string, format: uuid, nullable: true }
        item_name: { type: string, nullable: true }
        nutrition: { $ref: "#/components/schemas/NutritionFactsInput" }

    DailyNutritionSummary:
      type: object
      properties:
        date: { type: string, format: date }
        entries: { type: array, items: { $ref: "#/components/schemas/DiaryEntry" } }
        totals: { $ref: "#/components/schemas/NutritionFacts" }
        targets: { $ref: "#/components/schemas/NutritionAssessment" }
