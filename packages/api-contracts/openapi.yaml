    # ---- Notifications schemas ----
    AppNotification:
      type: object
      properties:
        id: { type: string, format: uuid }
        category: { type: string, enum: [account, order, payment, wallet, delivery, promotional, ai, nutrition, admin] }
        channel: { type: string, enum: [email, sms, push, in_app, whatsapp, telegram] }
        template_key: { type: string }
        subject: { type: string }
        body: { type: string }
        priority: { type: string, enum: [low, normal, high] }
        status: { type: string, enum: [pending, queued, sent, delivered, failed] }
        read: { type: boolean }
        read_at: { type: string, format: date-time, nullable: true }
        scheduled_for: { type: string, format: date-time, nullable: true }
        created_at: { type: string, format: date-time }
    NotificationPreference:
      type: object
      description: >-
        Per-user delivery preferences. `marketing_opt_in` governs the marketing
        class only; security notifications are never suppressed by any
        preference, because an account whose owner has silenced its security
        alerts has lost its only warning that it is being tampered with.

        The unsubscribe token is deliberately absent: it is a bearer secret that
        belongs in an emailed link, not in an API response.
      properties:
        user_id: { type: string, format: uuid }
        channels_by_category:
          type: object
          additionalProperties: { type: array, items: { type: string, enum: [email, sms, push, in_app, whatsapp, telegram] } }
        quiet_hours:
          type: object
          properties:
            enabled: { type: boolean }
            start: { type: string }
            end: { type: string }
        language: { type: string, example: en }
        max_per_day: { type: integer }
        marketing_opt_in: { type: boolean }
        marketing_opt_in_at: { type: string, format: date-time, nullable: true }
    MessagingConversation:
      type: object
      properties:
        id: { type: string, format: uuid }
        type: { type: string, enum: [customer_restaurant, customer_vendor, customer_rider, admin_user, group] }
        participant_ids: { type: array, items: { type: string } }
        subject: { type: string, nullable: true }
        context_ref: { type: string, nullable: true }
        last_message_at: { type: string, format: date-time }
        created_at: { type: string, format: date-time }
    MessagingMessage:
      type: object
      properties:
        id: { type: string, format: uuid }
        conversation_id: { type: string, format: uuid }
        sender_id: { type: string, format: uuid }
        type: { type: string, enum: [text, file, voice] }
        body: { type: string }
        attachments:
          type: array
          items:
            type: object
            properties:
              url: { type: string }
              name: { type: string }
              mime_type: { type: string }
              size_bytes: { type: integer }
        read_by: { type: array, items: { type: string } }
        created_at: { type: string, format: date-time }
    Broadcast:
      type: object
      properties:
        id: { type: string, format: uuid }
        title: { type: string }
        body: { type: string }
        category: { type: string }
        channels: { type: array, items: { type: string } }
        segment: { type: string }
        scheduled_for: { type: string, format: date-time, nullable: true }
        sent: { type: boolean }
        recipient_count: { type: integer }
        created_at: { type: string, format: date-time }
    NotificationTemplate:
      type: object
      properties:
        id: { type: string, format: uuid }
        key: { type: string }
        channel: { type: string }
        locale: { type: string }
        subject: { type: string }
