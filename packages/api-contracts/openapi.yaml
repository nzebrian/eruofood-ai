components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT

  responses:
    Error:
      description: Error envelope.
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }
    Message:
      description: Simple message envelope.
      content:
        application/json:
          schema:
            type: object
            properties:
              data:
                type: object
                properties:
                  message: { type: string }
    User:
      description: A user resource.
      content:
        application/json:
          schema:
            type: object
            properties:
              data: { $ref: "#/components/schemas/User" }
    AuthSuccess:
      description: Authenticated — user + tokens.
      content:
        application/json:
          schema:
            type: object
            properties:
              data: { $ref: "#/components/schemas/AuthPayload" }
    AuthSuccessOrChallenge:
      description: Either authenticated (user + tokens) or a two-factor challenge.
      content:
        application/json:
          schema:
            oneOf:
              - type: object
                properties:
                  data: { $ref: "#/components/schemas/AuthPayload" }
              - type: object
                properties:
                  data: { $ref: "#/components/schemas/TwoFactorChallenge" }
    NutritionAdvice:
      description: AI personalisation advice + provenance.
      content:
        application/json:
          schema:
            type: object
            properties:
              data: { $ref: "#/components/schemas/NutritionAdvicePayload" }

  schemas:
    SystemStatus:
      type: object
      required: [status, service, version, environment, timestamp]
      properties:
        status: { type: string, enum: [ok, degraded] }
        service: { type: string }
        version: { type: string }
        environment: { type: string }
        timestamp: { type: string, format: date-time }

    RegisterRequest:
      type: object
      required: [name, email, password, password_confirmation]
      properties:
        name: { type: string, minLength: 2, maxLength: 120 }
        email: { type: string, format: email }
        password: { type: string, minLength: 8 }
        password_confirmation: { type: string }

    LoginRequest:
      type: object
      required: [email, password]
      properties:
        email: { type: string, format: email }
        password: { type: string }

    ResetPasswordRequest:
      type: object
      required: [email, token, password, password_confirmation]
      properties:
        email: { type: string, format: email }
        token: { type: string }
        password: { type: string, minLength: 8 }
        password_confirmation: { type: string }

    Tokens:
      type: object
      properties:
        access_token: { type: string }
        token_type: { type: string, example: Bearer }
        expires_in: { type: integer, description: Access-token lifetime in seconds. }
        refresh_token: { type: string }

    AuthPayload:
      type: object
      properties:
        user: { $ref: "#/components/schemas/User" }
        tokens: { $ref: "#/components/schemas/Tokens" }

    TwoFactorChallenge:
      type: object
      properties:
        two_factor_required: { type: boolean, example: true }
        challenge_token: { type: string }

    TwoFactorEnrollment:
      type: object
      properties:
        secret: { type: string }
        provisioning_uri: { type: string, description: otpauth:// URI for QR codes. }
        recovery_codes:
          type: array
          items: { type: string }

    User:
      type: object
      properties:
        id: { type: string, format: uuid }
        name: { type: string }
        email: { type: string, format: email }
        phone: { type: string, nullable: true }
        email_verified: { type: boolean }
        avatar_url: { type: string, nullable: true }
        roles:
          type: array
          items: { type: string, enum: [admin, moderator, user] }
        permissions:
          type: array
          items: { type: string }
        preferences: { type: object, additionalProperties: true }
        two_factor_enabled: { type: boolean }
        status: { type: string, enum: [active, suspended] }

    Session:
      type: object
      properties:
        session_id: { type: string, format: uuid }
        ip_address: { type: string, nullable: true }
        user_agent: { type: string, nullable: true }
        created_at: { type: string, format: date-time }
        last_used_at: { type: string, format: date-time, nullable: true }

    PageMeta:
      type: object
      properties:
        page: { type: integer }
        per_page: { type: integer }
        total: { type: integer }

    Error:
      type: object
      required: [error]
      properties:
        error:
          type: object
          required: [code, message]
          properties:
            code: { type: string, example: INVALID_CREDENTIALS }
            message: { type: string }
            details:
              type: array
              items: { type: object }

    Category:
      type: object
      properties:
        id: { type: string, format: uuid }
        name: { type: string }
        slug: { type: string }
        type: { type: string, enum: [soup, swallow, rice, protein, snack, street_food, drink, dessert, breakfast, side_dish] }
        description: { type: string, nullable: true }
        sort_order: { type: integer }
        active: { type: boolean }

    LocalName:
      type: object
      properties:
        name: { type: string, example: Iyan }
        language: { type: string, example: yoruba }

    Nutrition:
      type: object
      properties:
        calories: { type: integer }
        protein_grams: { type: number }
        carbohydrate_grams: { type: number }
        fat_grams: { type: number }
        fiber_grams: { type: number }
        basis: { type: string, example: per_serving }

    Ingredient:
      type: object
      properties:
        id: { type: string, format: uuid }
        name: { type: string }
        slug: { type: string }
        description: { type: string, nullable: true }
        local_names: { type: array, items: { $ref: "#/components/schemas/LocalName" } }
        nutrition_per_100g: { $ref: "#/components/schemas/Nutrition" }

    FoodSummary:
      type: object
      properties:
        id: { type: string, format: uuid }
        name: { type: string }
        slug: { type: string }
        category_id: { type: string, format: uuid }
        region: { type: string }
        tags: { type: array, items: { type: string } }
        status: { type: string, enum: [draft, published, archived] }
        primary_image: { type: string, nullable: true }

    Food:
      allOf:
        - $ref: "#/components/schemas/FoodSummary"
        - type: object
          properties:
            description: { type: string, nullable: true }
            states: { type: array, items: { type: string } }
            local_names: { type: array, items: { $ref: "#/components/schemas/LocalName" } }
            nutrition: { $ref: "#/components/schemas/Nutrition" }
            images: { type: array, items: { type: string } }
            video_url: { type: string, nullable: true }

    FoodInput:
      type: object
      required: [name, category_id, region]
      properties:
        name: { type: string }
        category_id: { type: string, format: uuid }
        region: { type: string, enum: [north_central, north_east, north_west, south_east, south_south, south_west, nationwide] }
        description: { type: string, nullable: true }
        states: { type: array, items: { type: string } }
        local_names: { type: array, items: { $ref: "#/components/schemas/LocalName" } }
        nutrition: { $ref: "#/components/schemas/Nutrition" }
        tags: { type: array, items: { type: string } }

    RecipeIngredientInput:
      type: object
      required: [name, amount, unit]
      properties:
        name: { type: string }
        amount: { type: number }
        unit: { type: string, enum: [g, kg, ml, l, cup, tbsp, tsp, piece, pinch, handful, wrap, to_taste] }
        ingredient_id: { type: string, format: uuid, nullable: true }
        note: { type: string, nullable: true }

    CookingStepInput:
      type: object
      required: [order, instruction]
      properties:
        order: { type: integer }
        instruction: { type: string }
        duration_minutes: { type: integer, nullable: true }

    RecipeInput:
      type: object
      required: [food_id, title, prep_time_minutes, cook_time_minutes, difficulty, serving_size, ingredients, steps]
      properties:
        food_id: { type: string, format: uuid }
        title: { type: string }
        summary: { type: string, nullable: true }
        prep_time_minutes: { type: integer }
        cook_time_minutes: { type: integer }
        difficulty: { type: string, enum: [easy, medium, hard] }
        serving_size: { type: integer }
        ingredients: { type: array, items: { $ref: "#/components/schemas/RecipeIngredientInput" } }
        steps: { type: array, items: { $ref: "#/components/schemas/CookingStepInput" } }
        tips: { type: array, items: { type: string } }
        tags: { type: array, items: { type: string } }

    RecipeSummary:
      type: object
      properties:
        id: { type: string, format: uuid }
        food_id: { type: string, format: uuid }
        title: { type: string }
        slug: { type: string }
        summary: { type: string, nullable: true }
        difficulty: { type: string, enum: [easy, medium, hard] }
        prep_time_minutes: { type: integer }
        cook_time_minutes: { type: integer }
        total_time_minutes: { type: integer }
        serving_size: { type: integer }
        rating_average: { type: number }
        rating_count: { type: integer }
        tags: { type: array, items: { type: string } }
        status: { type: string, enum: [draft, published, archived] }

    Recipe:
      allOf:
        - $ref: "#/components/schemas/RecipeSummary"
        - type: object
          properties:
            author_id: { type: string, format: uuid }
            version: { type: integer }
            ingredients: { type: array, items: { $ref: "#/components/schemas/RecipeIngredientInput" } }
            steps:
              type: array
              items:
                type: object
                properties:
                  order: { type: integer }
                  instruction: { type: string }
                  image_url: { type: string, nullable: true }
                  duration_minutes: { type: integer, nullable: true }
            tips: { type: array, items: { type: string } }
            related_recipe_ids: { type: array, items: { type: string, format: uuid } }
            is_favourited: { type: boolean }

    RecipeReview:
      type: object
      properties:
        id: { type: string, format: uuid }
        recipe_id: { type: string, format: uuid }
        user_id: { type: string, format: uuid }
        rating: { type: integer, minimum: 1, maximum: 5 }
        comment: { type: string, nullable: true }
        created_at: { type: string, format: date-time }

    # ---- AI Engine schemas (Milestone 4) ----
    AiFeature:
      type: string
      enum:
        - recipe_generation
        - recipe_improvement
        - recipe_translation
        - ingredient_substitution
        - cooking_assistant
        - meal_suggestions
        - leftover_recipes
        - recipe_summarization
        - cooking_tips
        - food_description

    AiMeta:
      type: object
      description: Provenance for a generation (provider, model, cache, tokens).
      properties:
        provider: { type: string, enum: [anthropic, openai, gemini, local, mock] }
        model: { type: string }
        cached: { type: boolean }
        finish_reason: { type: string }
        tokens:
          type: object
          properties:
            input: { type: integer }
            output: { type: integer }
            total: { type: integer }

    AiStructuredResult:
      type: object
      description: A structured (JSON) generation result plus its metadata.
      properties:
        content: { type: object, additionalProperties: true }
        meta: { $ref: "#/components/schemas/AiMeta" }

    AiTextResult:
      type: object
      description: A plain-text generation result plus its metadata.
      properties:
        content: { type: string }
        meta: { $ref: "#/components/schemas/AiMeta" }

    AiRecipeGenerationRequest:
      type: object
      required: [dish_name]
      properties:
        dish_name: { type: string, minLength: 2, maxLength: 160 }
        servings: { type: integer, minimum: 1, maximum: 50 }
        difficulty: { type: string, enum: [easy, medium, hard] }
        dietary_preferences: { type: array, items: { type: string } }
        available_ingredients: { type: array, items: { type: string } }
        notes: { type: string, nullable: true }

    AiRecipeImprovementRequest:
      type: object
      required: [title, ingredients, steps]
      properties:
        title: { type: string }
        ingredients: { type: array, items: { type: string } }
        steps: { type: array, items: { type: string } }
        goal: { type: string, nullable: true }

    AiLeftoverRequest:
      type: object
      required: [ingredients]
      properties:
        ingredients: { type: array, items: { type: string } }
        dietary_preferences: { type: array, items: { type: string } }
        meal_type: { type: string, nullable: true }

    AiSummarizationRequest:
      type: object
      required: [content]
      properties:
        content: { type: string, maxLength: 8000 }
        max_words: { type: integer, minimum: 10, maximum: 400 }

    AiTranslationRequest:
      type: object
      required: [content, target_language]
      properties:
        content: { type: string, maxLength: 8000 }
        target_language: { type: string }

    AiFoodDescriptionRequest:
      type: object
      required: [food_name]
      properties:
        food_name: { type: string, minLength: 2, maxLength: 160 }
        region: { type: string, nullable: true }
        keywords: { type: array, items: { type: string } }

    AiCookingTipsRequest:
      type: object
      required: [topic]
      properties:
        topic: { type: string, minLength: 2, maxLength: 160 }
        skill_level: { type: string, enum: [beginner, "home cook", intermediate, advanced] }

    AiSubstitutionRequest:
      type: object
      required: [ingredient]
      properties:
        ingredient: { type: string }
        reason: { type: string, nullable: true }
        dish_context: { type: string, nullable: true }
        dietary_preferences: { type: array, items: { type: string } }

    AiMealSuggestionRequest:
      type: object
      properties:
        meal_type: { type: string }
        dietary_preferences: { type: array, items: { type: string } }
        count: { type: integer, minimum: 1, maximum: 10 }
        budget: { type: string, nullable: true }

    AiChatRequest:
      type: object
      required: [message]
      properties:
        message: { type: string, minLength: 1, maxLength: 4000 }
        conversation_id: { type: string, format: uuid, nullable: true }

    ChatMessage:
      type: object
      properties:
        role: { type: string, enum: [system, user, assistant] }
        content: { type: string }
        created_at: { type: string, format: date-time }

    ConversationSummary:
      type: object
      properties:
        id: { type: string, format: uuid }
        title: { type: string }
        feature: { $ref: "#/components/schemas/AiFeature" }
        message_count: { type: integer }
        created_at: { type: string, format: date-time }
        updated_at: { type: string, format: date-time }

    Conversation:
      allOf:
        - $ref: "#/components/schemas/ConversationSummary"
        - type: object
          properties:
            messages: { type: array, items: { $ref: "#/components/schemas/ChatMessage" } }

    AiChatTurn:
      type: object
      properties:
        conversation_id: { type: string, format: uuid }
        reply: { type: string }
        conversation: { $ref: "#/components/schemas/Conversation" }
        meta: { $ref: "#/components/schemas/AiMeta" }

    AiUsageSummary:
      type: object
      properties:
        requests: { type: integer }
        cached_requests: { type: integer }
        input_tokens: { type: integer }
        output_tokens: { type: integer }
        total_tokens: { type: integer }
        cost_usd: { type: number }

    PromptTemplate:
      type: object
      properties:
        id: { type: string, format: uuid }
        feature: { $ref: "#/components/schemas/AiFeature" }
        version: { type: integer }
        name: { type: string }
        system_template: { type: string }
        user_template: { type: string }
        model: { type: string, nullable: true }
        variables: { type: array, items: { type: string } }
        active: { type: boolean }
        created_at: { type: string, format: date-time }

    PromptRequest:
      type: object
      required: [feature, name, user_template]
      properties:
        feature: { $ref: "#/components/schemas/AiFeature" }
        name: { type: string, maxLength: 160 }
        system_template: { type: string, nullable: true }
        user_template: { type: string }
        model: { type: string, nullable: true }
        variables: { type: array, items: { type: string } }
        activate: { type: boolean, default: true }

    # ---- Nutrition schemas (Milestone 5) ----
    NutritionFacts:
      type: object
      properties:
        calories: { type: number }
        protein_grams: { type: number }
        carb_grams: { type: number }
        fat_grams: { type: number }
        fibre_grams: { type: number }
        sugar_grams: { type: number }
        sodium_mg: { type: number }
        cholesterol_mg: { type: number }
        water_ml: { type: number }
        micronutrients: { type: object, additionalProperties: { type: number } }

    NutritionFactsInput:
      type: object
      required: [calories, protein_grams, carb_grams, fat_grams]
      properties:
        calories: { type: number, minimum: 0 }
        protein_grams: { type: number, minimum: 0 }
        carb_grams: { type: number, minimum: 0 }
        fat_grams: { type: number, minimum: 0 }
        fibre_grams: { type: number, minimum: 0 }
        sugar_grams: { type: number, minimum: 0 }
        sodium_mg: { type: number, minimum: 0 }
        cholesterol_mg: { type: number, minimum: 0 }
        water_ml: { type: number, minimum: 0 }
        micronutrients: { type: object, additionalProperties: { type: number } }

    NutritionItem:
      type: object
      properties:
        id: { type: string, format: uuid }
        name: { type: string }
        slug: { type: string }
        category: { type: string }
        serving_size:
          type: object
          properties: { label: { type: string }, grams: { type: number } }
        nutrition: { $ref: "#/components/schemas/NutritionFacts" }
        food_id: { type: string, format: uuid, nullable: true }

    NutritionItemRequest:
      type: object
      required: [name, serving_size, nutrition]
      properties:
        name: { type: string, minLength: 2, maxLength: 160 }
        category: { type: string }
        serving_size:
          type: object
          required: [label, grams]
          properties: { label: { type: string }, grams: { type: number, minimum: 0.1 } }
        nutrition: { $ref: "#/components/schemas/NutritionFactsInput" }
        food_id: { type: string, format: uuid, nullable: true }

    MacroTargets:
      type: object
      properties:
        protein_grams: { type: integer }
        carb_grams: { type: integer }
        fat_grams: { type: integer }

    NutritionAssessment:
      type: object
      properties:
        bmi: { type: number }
        bmi_category: { type: string, enum: [underweight, normal, overweight, obese] }
        bmr: { type: integer }
        tdee: { type: integer }
        calorie_target: { type: integer }
        macro_targets: { $ref: "#/components/schemas/MacroTargets" }

    CalculationRequest:
      type: object
      required: [weight_kg, height_cm, age, gender]
      properties:
        weight_kg: { type: number, minimum: 20, maximum: 500 }
        height_cm: { type: number, minimum: 50, maximum: 260 }
        age: { type: integer, minimum: 1, maximum: 120 }
        gender: { type: string, enum: [male, female, other] }
        activity_level: { type: string, enum: [sedentary, light, moderate, active, very_active] }
        goal: { type: string, enum: [lose_weight, maintain, gain_weight, gain_muscle] }

    HealthProfile:
      type: object
      nullable: true
      properties:
        user_id: { type: string, format: uuid }
        weight_kg: { type: number }
        height_cm: { type: number }
        age: { type: integer }
        gender: { type: string, enum: [male, female, other] }
        activity_level: { type: string, enum: [sedentary, light, moderate, active, very_active] }
        goal: { type: string, enum: [lose_weight, maintain, gain_weight, gain_muscle] }
        dietary_preferences: { type: array, items: { type: string } }
        allergies: { type: array, items: { type: string } }
        medical_restrictions: { type: array, items: { type: string } }
        updated_at: { type: string, format: date-time }

    HealthProfileRequest:
      type: object
      required: [weight_kg, height_cm, age, gender, activity_level, goal]
      properties:
        weight_kg: { type: number, minimum: 20, maximum: 500 }
        height_cm: { type: number, minimum: 50, maximum: 260 }
        age: { type: integer, minimum: 1, maximum: 120 }
        gender: { type: string, enum: [male, female, other] }
        activity_level: { type: string, enum: [sedentary, light, moderate, active, very_active] }
        goal: { type: string, enum: [lose_weight, maintain, gain_weight, gain_muscle] }
        dietary_preferences: { type: array, items: { type: string } }
        allergies: { type: array, items: { type: string } }
        medical_restrictions: { type: array, items: { type: string } }

    DiaryEntry:
      type: object
      properties:
        id: { type: string, format: uuid }
        date: { type: string, format: date }
        meal_type: { type: string, enum: [breakfast, lunch, dinner, snack] }
        item_name: { type: string }
        servings: { type: number }
        nutrition_item_id: { type: string, format: uuid, nullable: true }
        nutrition: { $ref: "#/components/schemas/NutritionFacts" }

    DiaryEntryRequest:
      type: object
      required: [date, meal_type, servings]
      properties:
        date: { type: string, format: date }
        meal_type: { type: string, enum: [breakfast, lunch, dinner, snack] }
        servings: { type: number, minimum: 0.1, maximum: 100 }
        nutrition_item_id: { type: string, format: uuid, nullable: true }
        item_name: { type: string, nullable: true }
        nutrition: { $ref: "#/components/schemas/NutritionFactsInput" }

    DailyNutritionSummary:
      type: object
      properties:
        date: { type: string, format: date }
        entries: { type: array, items: { $ref: "#/components/schemas/DiaryEntry" } }
        totals: { $ref: "#/components/schemas/NutritionFacts" }
        targets:
          oneOf:
            - { $ref: "#/components/schemas/NutritionAssessment" }
            - { type: "null" }
        remaining_calories: { type: integer, nullable: true }

    MealAnalysis:
      type: object
      properties:
        totals: { $ref: "#/components/schemas/NutritionFacts" }
        items:
          type: array
          items:
            type: object
            properties:
              name: { type: string }
              servings: { type: number }
              facts: { $ref: "#/components/schemas/NutritionFacts" }

    AnalysisRequest:
      type: object
      required: [items]
      properties:
        items:
          type: array
          minItems: 1
          items:
            type: object
            required: [nutrition_item_id, servings]
            properties:
              nutrition_item_id: { type: string, format: uuid }
              servings: { type: number, minimum: 0.1, maximum: 100 }

    MealPlanEntry:
      type: object
      properties:
        date: { type: string, format: date }
        meal_type: { type: string, enum: [breakfast, lunch, dinner, snack] }
        label: { type: string }
        servings: { type: number }
        nutrition_item_id: { type: string, format: uuid, nullable: true }
        estimated_cost: { type: number, nullable: true }

    MealPlan:
      type: object
      properties:
        id: { type: string, format: uuid }
        title: { type: string }
        period: { type: string, enum: [daily, weekly, monthly] }
        start_date: { type: string, format: date }
        entries: { type: array, items: { $ref: "#/components/schemas/MealPlanEntry" } }
        estimated_cost: { type: number }
        created_at: { type: string, format: date-time }

    MealPlanRequest:
      type: object
      required: [title, period, start_date]
      properties:
        title: { type: string, minLength: 2, maxLength: 160 }
        period: { type: string, enum: [daily, weekly, monthly] }
        start_date: { type: string, format: date }
        entries:
          type: array
          items:
            type: object
            required: [date, meal_type, label, servings]
            properties:
              date: { type: string, format: date }
              meal_type: { type: string, enum: [breakfast, lunch, dinner, snack] }
              label: { type: string }
              servings: { type: number, minimum: 0.1, maximum: 100 }
              nutrition_item_id: { type: string, format: uuid, nullable: true }
              estimated_cost: { type: number, nullable: true }

    ShoppingList:
      type: object
      properties:
        items:
          type: array
          items:
            type: object
            properties:
              name: { type: string }
              servings: { type: number }
              estimated_cost: { type: number, nullable: true }
        total_estimated_cost: { type: number }

    ProgressEntry:
      type: object
      properties:
        id: { type: string, format: uuid }
        date: { type: string, format: date }
        weight_kg: { type: number }
        note: { type: string, nullable: true }

    ProgressRequest:
      type: object
      required: [date, weight_kg]
      properties:
        date: { type: string, format: date }
        weight_kg: { type: number, minimum: 20, maximum: 500 }
        note: { type: string, nullable: true }

    NutritionAdvicePayload:
      type: object
      properties:
        advice: { type: string }
        meta:
          type: object
          properties:
            provider: { type: string }
            model: { type: string }
            cached: { type: boolean }
