  # ----- Reviews & Ratings (Milestone 14) -----
  /v1/reviews/{subjectType}/{subjectId}:
    get:
      tags: [Reviews]
      summary: Published reviews for a subject (public)
      parameters:
        - { name: subjectType, in: path, required: true, schema: { type: string, enum: [product, food, recipe, vendor, restaurant, rider] } }
        - { name: subjectId, in: path, required: true, schema: { type: string } }
        - { name: sort, in: query, required: false, schema: { type: string, enum: [newest, oldest, helpful, rating_desc, rating_asc] } }
        - { name: verified, in: query, required: false, schema: { type: boolean } }
        - { name: page, in: query, required: false, schema: { type: integer } }
        - { name: per_page, in: query, required: false, schema: { type: integer } }
      responses:
        "200":
          description: A page of reviews.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/PaginatedReviews" }
