    MealAnalysis:
      type: object
      properties:
        totals: { $ref: "#/components/schemas/NutritionFacts" }
        items:
          type: array
          items:
            type: object
            properties:
              name: { type: string }
              servings: { type: number }
              facts: { $ref: "#/components/schemas/NutritionFacts" }

    AnalysisRequest:
      type: object
      required: [items]
      properties:
        items:
          type: array
          minItems: 1
          items:
            type: object
            required: [nutrition_item_id, servings]
            properties:
              nutrition_item_id: { type: string, format: uuid }
              servings: { type: number, minimum: 0.1, maximum: 100 }

    MealPlanEntry:
      type: object
      properties:
        date: { type: string, format: date }
        meal_type: { type: string, enum: [breakfast, lunch, dinner, snack] }
        label: { type: string }
        servings: { type: number }
        nutrition_item_id: { type: string, format: uuid, nullable: true }
        estimated_cost: { type: number, nullable: true }

    MealPlan:
      type: object
      properties:
        id: { type: string, format: uuid }
        title: { type: string }
        period: { type: string, enum: [daily, weekly, monthly] }
        start_date: { type: string, format: date }
        entries: { type: array, items: { $ref: "#/components/schemas/MealPlanEntry" } }
        estimated_cost: { type: number }
        created_at: { type: string, format: date-time }

    MealPlanRequest:
      type: object
      required: [title, period, start_date]
      properties:
        title: { type: string, minLength: 2, maxLength: 160 }
        period: { type: string, enum: [daily, weekly, monthly] }
        start_date: { type: string, format: date }
        entries:
          type: array
          items:
            type: object
            required: [date, meal_type, label, servings]
            properties:
              date: { type: string, format: date }
              meal_type: { type: string, enum: [breakfast, lunch, dinner, snack] }
              label: { type: string }
              servings: { type: number, minimum: 0.1, maximum: 100 }
              nutrition_item_id: { type: string, format: uuid, nullable: true }
              estimated_cost: { type: number, nullable: true }

    ShoppingList:
      type: object
      properties:
        items:
          type: array
          items:
            type: object
            properties:
              name: { type: string }
              servings: { type: number }
              estimated_cost: { type: number, nullable: true }
        total_estimated_cost: { type: number }

    ProgressEntry:
      type: object
      properties:
        id: { type: string, format: uuid }
        date: { type: string, format: date }
        weight_kg: { type: number }
        note: { type: string, nullable: true }

    ProgressRequest:
      type: object
      required: [date, weight_kg]
      properties:
        date: { type: string, format: date }
        weight_kg: { type: number, minimum: 20, maximum: 500 }
        note: { type: string, nullable: true }

