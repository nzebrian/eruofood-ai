  # ----- Search, Discovery & Recommendation (Milestone 12) -----
  /v1/search:
    get:
      tags: [Search]
      summary: Global or typed search with filters, sorting and facets
      description: >
        Ranked results blending full-text relevance with pgvector semantic
        similarity. Supports every filter (region, cuisine, category,
        ingredients, price, rating, cooking time, dietary, allergens, …) and
        sort (relevance, popularity, rating, newest, price, prep time, distance).
      parameters:
        - { name: q, in: query, required: false, schema: { type: string } }
        - { name: type, in: query, required: false, schema: { type: string, enum: [global, recipe, food, ingredient, restaurant, vendor, product, category] } }
        - { name: sort, in: query, required: false, schema: { type: string, enum: [relevance, popularity, rating, newest, price, prep_time, distance] } }
        - { name: page, in: query, required: false, schema: { type: integer, default: 1 } }
        - { name: per_page, in: query, required: false, schema: { type: integer } }
        - { name: region, in: query, required: false, schema: { type: string } }
        - { name: cuisine, in: query, required: false, schema: { type: string } }
        - { name: category, in: query, required: false, schema: { type: string } }
        - { name: state, in: query, required: false, schema: { type: string } }
        - { name: ingredients, in: query, required: false, schema: { type: string }, description: "Comma-separated; all must be present." }
        - { name: dietary, in: query, required: false, schema: { type: string }, description: "Comma-separated dietary preferences." }
        - { name: exclude_allergens, in: query, required: false, schema: { type: string }, description: "Comma-separated allergens to exclude." }
        - { name: max_calories, in: query, required: false, schema: { type: integer } }
        - { name: min_price, in: query, required: false, schema: { type: integer } }
        - { name: max_price, in: query, required: false, schema: { type: integer } }
        - { name: min_rating, in: query, required: false, schema: { type: number } }
        - { name: max_cooking_time, in: query, required: false, schema: { type: integer } }
        - { name: difficulty, in: query, required: false, schema: { type: string } }
        - { name: lat, in: query, required: false, schema: { type: number } }
        - { name: lng, in: query, required: false, schema: { type: number } }
      responses:
        "200":
          description: Ranked search results.
          content:
            application/json:
              schema: { type: object, properties: { data: { $ref: "#/components/schemas/SearchResults" } } }
        "422": { $ref: "#/components/responses/Error" }
  /v1/search/autocomplete:
    get:
      tags: [Search]
      summary: Type-ahead completions for a prefix
      parameters:
        - { name: q, in: query, required: true, schema: { type: string } }
        - { name: type, in: query, required: false, schema: { type: string } }
      responses:
        "200":
          description: Suggestions.
          content:
            application/json:
              schema: { type: object, properties: { data: { type: object, properties: { suggestions: { type: array, items: { type: string } } } } } }
  /v1/search/trending:
    get:
      tags: [Search]
      summary: Trending search terms
      responses:
        "200":
          description: Trending terms.
          content:
            application/json:
              schema: { type: object, properties: { data: { type: object, properties: { trending: { type: array, items: { type: string } } } } } }
  /v1/search/recommendations:
    get:
      tags: [Search]
      summary: Recommendation widgets (related/similar/trending/seasonal/restaurant)
      parameters:
        - { name: kind, in: query, required: false, schema: { type: string, enum: [related, similar, restaurant, personalised, frequently_viewed_together, seasonal, trending] } }
        - { name: type, in: query, required: false, schema: { type: string } }
        - { name: anchor_id, in: query, required: false, schema: { type: string }, description: "Source id for content-based (related/similar) recommendations." }
        - { name: limit, in: query, required: false, schema: { type: integer, default: 8 } }
      responses:
        "200":
          description: Recommended items.
          content:
            application/json:
              schema: { type: object, properties: { data: { $ref: "#/components/schemas/Recommendations" } } }
  /v1/search/click:
    post:
      tags: [Search]
      summary: Record a result click (for click-through rate)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [query_id, document_id]
              properties:
                query_id: { type: string }
                document_id: { type: string }
                position: { type: integer }
                from_recommendation: { type: boolean }
      responses:
        "204": { description: Recorded. }
  /v1/search/recent:
    get:
      tags: [Search]
      summary: The authenticated user's recent searches
      security: [{ bearerAuth: [] }]
      responses:
        "200":
          description: Recent terms.
          content:
            application/json:
              schema: { type: object, properties: { data: { type: object, properties: { recent: { type: array, items: { type: string } } } } } }
  /v1/search/recommendations/personalised:
    get:
      tags: [Search]
      summary: Personalised recommendations for the authenticated user
      security: [{ bearerAuth: [] }]
      parameters:
        - { name: type, in: query, required: false, schema: { type: string } }
        - { name: limit, in: query, required: false, schema: { type: integer } }
      responses:
        "200":
          description: Recommended items.
          content:
            application/json:
              schema: { type: object, properties: { data: { $ref: "#/components/schemas/Recommendations" } } }
  /v1/search/users:
    get:
      tags: [Search]
      summary: Admin user search (admin role required)
      security: [{ bearerAuth: [] }]
      parameters:
        - { name: q, in: query, required: false, schema: { type: string } }
      responses:
        "200":
          description: Ranked user documents.
          content:
            application/json:
              schema: { type: object, properties: { data: { $ref: "#/components/schemas/SearchResults" } } }
        "403": { $ref: "#/components/responses/Error" }
  /v1/search/saved:
    get:
      tags: [Search]
      summary: List the user's saved searches
      security: [{ bearerAuth: [] }]
      responses:
        "200":
          description: Saved searches.
          content:
            application/json:
              schema: { type: object, properties: { data: { type: object, properties: { saved_searches: { type: array, items: { $ref: "#/components/schemas/SavedSearch" } } } } } }
    post:
      tags: [Search]
      summary: Save the current search
      security: [{ bearerAuth: [] }]
      parameters:
        - { name: q, in: query, required: false, schema: { type: string } }
        - { name: type, in: query, required: false, schema: { type: string } }
        - { name: sort, in: query, required: false, schema: { type: string } }
      requestBody:
        required: true
        content:
          application/json:
            schema: { type: object, required: [name], properties: { name: { type: string } } }
      responses:
        "201":
          description: The saved search.
          content:
            application/json:
              schema: { type: object, properties: { data: { $ref: "#/components/schemas/SavedSearch" } } }
  /v1/search/saved/{id}:
    delete:
      tags: [Search]
      summary: Delete a saved search
      security: [{ bearerAuth: [] }]
      parameters:
        - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
      responses:
        "204": { description: Deleted. }
        "403": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
  /v1/search/saved/{id}/run:
    post:
      tags: [Search]
      summary: Re-run a saved search
      security: [{ bearerAuth: [] }]
      parameters:
        - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
      responses:
        "200":
          description: Ranked results.
          content:
            application/json:
              schema: { type: object, properties: { data: { $ref: "#/components/schemas/SearchResults" } } }
  /v1/search/admin/metrics:
    get:
      tags: [Search]
      summary: Search KPIs (admin role required)
      security: [{ bearerAuth: [] }]
      parameters:
        - { name: days, in: query, required: false, schema: { type: integer, default: 30 } }
      responses:
        "200":
          description: Search metrics.
          content:
            application/json:
              schema: { type: object, properties: { data: { $ref: "#/components/schemas/SearchMetrics" } } }
        "403": { $ref: "#/components/responses/Error" }
  /v1/search/admin/popular:
    get:
      tags: [Search]
      summary: Most popular searches (admin role required)
      security: [{ bearerAuth: [] }]
      parameters:
        - { name: days, in: query, required: false, schema: { type: integer } }
      responses:
        "200":
          description: Popular terms.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/PopularTerms" }
        "403": { $ref: "#/components/responses/Error" }
  /v1/search/admin/failed:
    get:
      tags: [Search]
      summary: Failed (zero-result) searches (admin role required)
      security: [{ bearerAuth: [] }]
      parameters:
        - { name: days, in: query, required: false, schema: { type: integer } }
      responses:
        "200":
          description: Zero-result terms.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/PopularTerms" }
        "403": { $ref: "#/components/responses/Error" }
  /v1/search/admin/reindex:
    post:
      tags: [Search]
      summary: Rebuild the index from source contexts (admin role required)
      security: [{ bearerAuth: [] }]
      requestBody:
        required: false
        content:
          application/json:
            schema: { type: object, properties: { type: { type: string, description: "Limit to one document type." } } }
      responses:
        "200":
          description: Reindex count.
          content:
            application/json:
              schema: { type: object, properties: { data: { type: object, properties: { reindexed: { type: integer } } } } }
        "403": { $ref: "#/components/responses/Error" }

  # ----- Customer Support, Helpdesk & CRM (Milestone 13) -----
  /v1/support/kb/articles:
    get:
      tags: [Support]
      summary: Browse/search published knowledge-base articles (public)
      parameters:
        - { name: q, in: query, required: false, schema: { type: string } }
        - { name: category, in: query, required: false, schema: { type: string } }
