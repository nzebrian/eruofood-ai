    get:
      tags: [Reviews]
      summary: The authoritative rating summary for a subject (public)
      parameters:
        - { name: subjectType, in: path, required: true, schema: { type: string, enum: [product, food, recipe, vendor, restaurant, rider] } }
        - { name: subjectId, in: path, required: true, schema: { type: string } }
      responses:
        "200":
          description: The rating summary.
          content:
            application/json:
              schema: { type: object, properties: { data: { $ref: "#/components/schemas/RatingSummary" } } }
  /v1/reviews/{id}:
    get:
      tags: [Reviews]
      summary: A single review (public)
      parameters:
        - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
      responses:
        "200":
          description: The review.
          content:
            application/json:
              schema: { type: object, properties: { data: { $ref: "#/components/schemas/Review" } } }
        "404": { $ref: "#/components/responses/Error" }
    put:
      tags: [Reviews]
      summary: Edit your own review
      security: [{ bearerAuth: [] }]
      parameters:
        - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [rating]
              properties:
                rating: { type: integer, minimum: 1, maximum: 5 }
                title: { type: string, nullable: true }
                body: { type: string, nullable: true }
                photos: { type: array, items: { type: string } }
      responses:
        "200":
          description: The updated review.
          content:
            application/json:
              schema: { type: object, properties: { data: { $ref: "#/components/schemas/Review" } } }
        "403": { $ref: "#/components/responses/Error" }
  /v1/reviews:
    post:
      tags: [Reviews]
      summary: Submit a review (auto-publishes under post-moderation, else held)
      security: [{ bearerAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [subject_type, subject_id, rating]
              properties:
                subject_type: { type: string, enum: [product, food, recipe, vendor, restaurant, rider] }
                subject_id: { type: string }
                rating: { type: integer, minimum: 1, maximum: 5 }
                title: { type: string, nullable: true }
                body: { type: string, nullable: true }
                photos: { type: array, items: { type: string } }
      responses:
        "201":
          description: The created review.
          content:
            application/json:
              schema: { type: object, properties: { data: { $ref: "#/components/schemas/Review" } } }
        "409": { $ref: "#/components/responses/Error" }
