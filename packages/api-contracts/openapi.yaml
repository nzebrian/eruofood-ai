        balance_minor: { type: integer }
        currency: { type: string }
        created_at: { type: string, format: date-time }
    WalletTransaction:
      type: object
      properties:
        id: { type: string, format: uuid }
        wallet_id: { type: string, format: uuid }
        type: { type: string }
        direction: { type: string, enum: [credit, debit] }
        amount_minor: { type: integer }
        balance_after_minor: { type: integer }
        reference: { type: string, nullable: true }
        description: { type: string, nullable: true }
        created_at: { type: string, format: date-time }
    BankAccount:
      type: object
      properties:
        account_name: { type: string }
        account_number: { type: string }
        bank_code: { type: string }
        bank_name: { type: string, nullable: true }
    Settlement:
      type: object
      properties:
        id: { type: string, format: uuid }
        payee_type: { type: string }
        payee_id: { type: string, format: uuid }
        gross_minor: { type: integer }
        commission_minor: { type: integer }
        fees_minor: { type: integer }
        net_minor: { type: integer }
        currency: { type: string }
        status: { type: string, enum: [pending, processing, completed, failed] }
