        (`page`, `per_page`), search (`q`) and sort (`sort`). Responses carry
        `X-RateLimit-*`, `X-Quota-*` and `X-Request-Id` headers.
      security: [{ apiKeyAuth: [] }]
      parameters:
        - { name: q, in: query, required: false, schema: { type: string } }
        - { name: page, in: query, required: false, schema: { type: integer } }
        - { name: per_page, in: query, required: false, schema: { type: integer, maximum: 100 } }
        - { name: sort, in: query, required: false, schema: { type: string } }
      responses:
        "200":
          description: A page of foods.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/PublicFoodPage" }
        "401": { $ref: "#/components/responses/Error" }
        "403": { $ref: "#/components/responses/Error" }
        "429": { $ref: "#/components/responses/Error" }
  /api/public/v1/foods/{slug}:
