        "200":
          description: Supported filters.
          content:
            application/json:
              schema: { type: object, properties: { data: { type: object, properties: { filters: { type: array, items: { $ref: "#/components/schemas/PublicSearchFilter" } } } } } }
        "403": { $ref: "#/components/responses/Error" }

  /api/public/v1/orders:
    get:
      tags: [Public API]
      summary: List the caller's orders (scope orders:read)
      description: >
        Returns only orders belonging to the API credential's subject user
        (object-level authorization / BOLA). An application-level credential
        with no subject user is refused with 403.
      security: [{ apiKeyAuth: [] }]
      parameters:
        - { name: page, in: query, required: false, schema: { type: integer } }
        - { name: per_page, in: query, required: false, schema: { type: integer, maximum: 100 } }
      responses:
        "200":
          description: A page of the caller's orders.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/PublicOrderPage" }
        "403": { $ref: "#/components/responses/Error" }
    post:
      tags: [Public API]
      summary: Create an order for the caller (scope orders:write)
      description: Placed through the Order domain's checkout — the domain is never bypassed. The customer is always the credential's subject user.
      security: [{ apiKeyAuth: [] }]
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              properties:
                pickup: { type: boolean }
                note: { type: string, nullable: true }
                scheduled_for: { type: string, format: date-time, nullable: true }
                shipping_address: { type: object, nullable: true }
      responses:
        "201":
          description: The created order.
          content:
            application/json:
              schema: { type: object, properties: { data: { $ref: "#/components/schemas/PublicOrder" } } }
        "403": { $ref: "#/components/responses/Error" }
  /api/public/v1/orders/{id}:
    get:
      tags: [Public API]
      summary: Retrieve one of the caller's orders (scope orders:read)
      description: The Order domain re-checks ownership; a caller can never read another user's order (BOLA-safe).
      security: [{ apiKeyAuth: [] }]
      parameters:
        - { name: id, in: path, required: true, schema: { type: string } }
      responses:
        "200":
          description: The order.
          content:
            application/json:
              schema: { type: object, properties: { data: { $ref: "#/components/schemas/PublicOrder" } } }
        "403": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
  /api/public/v1/orders/{id}/status:
    get:
      tags: [Public API]
      summary: Retrieve an order's status (scope orders:read)
      security: [{ apiKeyAuth: [] }]
      parameters:
        - { name: id, in: path, required: true, schema: { type: string } }
      responses:
        "200":
          description: The order status.
          content:
            application/json:
              schema: { type: object, properties: { data: { $ref: "#/components/schemas/PublicOrderStatus" } } }
        "403": { $ref: "#/components/responses/Error" }
  /api/public/v1/orders/{id}/cancel:
    post:
      tags: [Public API]
      summary: Cancel one of the caller's orders (scope orders:write)
      description: Cancellation is permitted only where the Order domain's rules allow it; ownership is enforced downstream.
      security: [{ apiKeyAuth: [] }]
      parameters:
        - { name: id, in: path, required: true, schema: { type: string } }
      responses:
        "200":
          description: The cancelled order.
          content:
            application/json:
              schema: { type: object, properties: { data: { $ref: "#/components/schemas/PublicOrder" } } }
        "403": { $ref: "#/components/responses/Error" }
        "409": { $ref: "#/components/responses/Error" }

  /api/public/v1/oauth/token:
    post:
      tags: [Public API]
      summary: OAuth2 token endpoint
      description: >
        Issues access (and, for the appropriate grants, refresh) tokens for the
        `authorization_code` (with PKCE), `client_credentials` and
        `refresh_token` grants. The client authenticates with HTTP Basic or body
        parameters. The resulting access token is presented as
        `Authorization: Bearer <token>` on subsequent public-API calls and
        carries the same scopes/BOLA semantics as an API key.
      requestBody:
        required: true
        content:
          application/x-www-form-urlencoded:
            schema: { $ref: "#/components/schemas/OAuthTokenRequest" }
          application/json:
            schema: { $ref: "#/components/schemas/OAuthTokenRequest" }
      responses:
        "200":
          description: The issued token.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/OAuthTokenResponse" }
        "400":
          description: OAuth error (invalid_request/invalid_grant/invalid_scope/unsupported_grant_type).
          content:
            application/json:
              schema: { $ref: "#/components/schemas/OAuthError" }
        "401":
          description: Client authentication failed (invalid_client).
          content:
            application/json:
              schema: { $ref: "#/components/schemas/OAuthError" }

  # ===== OAuth2 consent (internal, JWT resource owner) =====
  /v1/oauth/authorize:
    post:
      tags: [Developer Platform]
      summary: Approve an authorization request and mint a code (Authorization Code + PKCE)
      description: >
        The consent step, performed by the logged-in resource owner. The subject
        user is taken from the JWT session, never from a parameter. Returns a
        single-use authorization code the client exchanges (with its PKCE
        verifier) at the token endpoint.
      security: [{ bearerAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [client_id, redirect_uri, code_challenge, code_challenge_method]
              properties:
                client_id: { type: string }
                redirect_uri: { type: string, format: uri }
                scope: { type: string, nullable: true }
                code_challenge: { type: string }
                code_challenge_method: { type: string, enum: [S256, plain] }
                state: { type: string, nullable: true }
      responses:
        "201":
          description: The authorization code.
          content:
            application/json:
              schema:
                type: object
                properties:
                  code: { type: string }
                  redirect_uri: { type: string }
                  state: { type: string, nullable: true }
        "400":
          description: OAuth error.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/OAuthError" }

  # ===== Developer Platform (internal, JWT) =====
  /v1/developer/register:
    post:
      tags: [Developer Platform]
      summary: Register (or return) the developer account for the authenticated user
      security: [{ bearerAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { type: object, required: [name, email], properties: { name: { type: string }, email: { type: string, format: email } } }
      responses:
        "201":
          description: The developer account.
          content:
            application/json:
              schema: { type: object, properties: { data: { $ref: "#/components/schemas/DeveloperAccount" } } }
