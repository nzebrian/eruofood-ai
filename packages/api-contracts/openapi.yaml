                type: object
                properties:
                  data: { type: array, items: { $ref: "#/components/schemas/AnalyticsReport" } }
                  meta: { $ref: "#/components/schemas/PageMeta" }
    post:
      tags: [Analytics]
      summary: Generate a report (RBAC)
      security: [{ bearerAuth: [] }]
      parameters:
        - { name: days, in: query, schema: { type: integer } }
        - { name: from, in: query, schema: { type: string, format: date } }
        - { name: to, in: query, schema: { type: string, format: date } }
      requestBody:
        required: true
        content:
          application/json:
            schema: { type: object, required: [key], properties: { key: { type: string } } }
      responses:
        "201":
          description: The generated report.
          content:
            application/json:
              schema: { type: object, properties: { data: { $ref: "#/components/schemas/AnalyticsReport" } } }
  /v1/analytics/reports/{id}:
    get:
      tags: [Analytics]
      summary: A generated report (RBAC)
      security: [{ bearerAuth: [] }]
      parameters:
        - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
      responses:
        "200":
          description: The report.
          content:
            application/json:
              schema: { type: object, properties: { data: { $ref: "#/components/schemas/AnalyticsReport" } } }
        "404": { $ref: "#/components/responses/Error" }
  /v1/analytics/reports/{id}/export:
    get:
      tags: [Analytics]
      summary: Download a report (CSV/XLSX/PDF, RBAC)
      security: [{ bearerAuth: [] }]
      parameters:
        - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
        - { name: format, in: query, schema: { type: string, enum: [csv, xlsx, pdf], default: csv } }
      responses:
        "200":
          description: The exported file.
          content:
            text/csv: { schema: { type: string, format: binary } }
            application/pdf: { schema: { type: string, format: binary } }
            application/vnd.openxmlformats-officedocument.spreadsheetml.sheet: { schema: { type: string, format: binary } }
  /v1/analytics/scheduled-reports:
    get:
      tags: [Analytics]
      summary: Scheduled email reports (RBAC)
      security: [{ bearerAuth: [] }]
      responses:
        "200":
          description: Scheduled reports.
          content:
            application/json:
              schema: { type: object, properties: { data: { type: array, items: { $ref: "#/components/schemas/ScheduledReport" } } } }
    post:
      tags: [Analytics]
      summary: Schedule a recurring emailed report (RBAC)
      security: [{ bearerAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [name, report_key, cadence, format, recipients]
              properties:
                name: { type: string }
                report_key: { type: string }
                cadence: { type: string, enum: [daily, weekly, monthly] }
                format: { type: string, enum: [csv, xlsx, pdf] }
                recipients: { type: array, items: { type: string, format: email } }
      responses:
        "201":
          description: The scheduled report.
          content:
            application/json:
              schema: { type: object, properties: { data: { $ref: "#/components/schemas/ScheduledReport" } } }
  /v1/analytics/scheduled-reports/{id}/deactivate:
    post:
      tags: [Analytics]
      summary: Deactivate a scheduled report (RBAC)
      security: [{ bearerAuth: [] }]
      parameters:
        - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
      responses:
        "200":
          description: The scheduled report.
          content:
            application/json:
              schema: { type: object, properties: { data: { $ref: "#/components/schemas/ScheduledReport" } } }

