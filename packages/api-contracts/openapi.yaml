        bank_name: { type: string, nullable: true }
    Settlement:
      type: object
      properties:
        id: { type: string, format: uuid }
        payee_type: { type: string }
        payee_id: { type: string, format: uuid }
        gross_minor: { type: integer }
        commission_minor: { type: integer }
        fees_minor: { type: integer }
        net_minor: { type: integer }
        currency: { type: string }
        status: { type: string, enum: [pending, processing, completed, failed] }
        payout_id: { type: string, nullable: true }
        period_start: { type: string, format: date-time }
        period_end: { type: string, format: date-time }
        completed_at: { type: string, format: date-time, nullable: true }
    SettlementRunState:
      type: string
      description: >-
        Where a settlement run has got to. `unknown` means the transfer was
        dispatched and no answer came back — it is not a failure, and it has no
        transition back to `pending`, because retrying it could pay the merchant
        twice. The only way onward is `reconciling`.
      enum:
        - draft
        - pending
        - processing
        - unknown
        - reconciling
        - reconciliation_required
        - succeeded
        - failed
        - cancelled
        - reversed
    PayoutAttemptState:
      type: string
      description: >-
        One attempt to move money. A retry is always a new attempt, never a
        reset of an old one, so this sequence is a permanent record of what was
        tried.
      enum:
        - created
        - submitted
        - confirmed
        - rejected
        - unknown
        - reconciling
        - reconciliation_required
    ReconciliationState:
      type: string
      enum:
        - open
        - investigating
        - resolved_matched
        - resolved_adjusted
        - escalated
    MerchantPayable:
      type: object
      description: >-
        What a merchant is owed, derived from accrual records at read time and
        never stored. `overdrawn` is true when refunds have taken the balance
        below zero, meaning the platform is owed money back.
      properties:
        merchant_type: { type: string }
        merchant_id: { type: string, format: uuid }
        payable_minor: { type: integer }
        currency: { type: string }
        settleable: { type: boolean }
        overdrawn: { type: boolean }
    PayableAccrual:
      type: object
      description: >-
        One line of what a merchant earned, or what a refund took back. Never
        edited: a refund is recorded as a separate row with a negative net.
      properties:
        id: { type: string, format: uuid }
        type: { type: string, enum: [earning, refund_adjustment] }
        order_id: { type: string, format: uuid }
        gross_minor: { type: integer }
        commission_minor: { type: integer }
        fee_minor: { type: integer }
        net_minor: { type: integer }
        currency: { type: string }
        commission_rate_bps:
          type: integer
          description: The commission rate in force when the sale happened, snapshotted so a later rate change cannot alter it.
        settleable:
          type: boolean
          description: False for a report-only accrual, whose ledger movement was not posted.
        accrued_at: { type: string, format: date-time }
    SettlementRun:
      type: object
      description: >-
        One settlement of one merchant over one window. The amounts are derived
        from accruals; no API accepts them.
      properties:
        id: { type: string, format: uuid }
        merchant_type: { type: string }
        merchant_id: { type: string, format: uuid }
        reference:
          type: string
          description: Deterministic, provider-safe reference shared with the payout narration.
        window_start: { type: string, format: date-time }
        window_end: { type: string, format: date-time }
        gross_minor: { type: integer }
        commission_minor: { type: integer }
        fee_minor: { type: integer }
        net_minor: { type: integer }
        currency: { type: string }
        state: { $ref: "#/components/schemas/SettlementRunState" }
        server_phase:
          type: string
          description: The platform-wide coarse phase, for clients that do not model settlement states.
          enum: [draft, submitted, pending, processing, confirmed, failed, cancelled, expired]
        requires_reconciliation: { type: boolean }
        failure_reason: { type: string, nullable: true }
        created_at: { type: string, format: date-time }
        updated_at: { type: string, format: date-time }
    PayoutAttempt:
      type: object
      description: >-
        An operator view of one transfer attempt. Not exposed on merchant-facing
        endpoints — the provider reference is an operational identifier.
      properties:
        id: { type: string, format: uuid }
        settlement_run_id: { type: string, format: uuid }
        attempt_no: { type: integer }
        provider: { type: string }
        provider_reference: { type: string, nullable: true }
        amount_minor: { type: integer }
        currency: { type: string }
        state: { $ref: "#/components/schemas/PayoutAttemptState" }
        server_phase:
          type: string
          enum: [draft, submitted, pending, processing, confirmed, failed, cancelled, expired]
        failure_reason: { type: string, nullable: true }
        created_at: { type: string, format: date-time }
        submitted_at: { type: string, format: date-time, nullable: true }
        settled_at: { type: string, format: date-time, nullable: true }
    ReconciliationCase:
      type: object
      description: >-
        A disagreement between two things that should agree. Closing one as
        `resolved_adjusted` requires both a named resolver and the correlation
        id of a compensating ledger posting.
      properties:
        id: { type: string, format: uuid }
        kind:
          type: string
          enum: [payout_state_mismatch, ledger_wallet_drift, payable_drift, missing_accrual, orphan_accrual]
        subject_type: { type: string }
        subject_id: { type: string }
        expected_minor: { type: integer }
        observed_minor: { type: integer }
        difference_minor: { type: integer }
        currency: { type: string }
        state: { $ref: "#/components/schemas/ReconciliationState" }
        detail: { type: string, nullable: true }
        opened_at: { type: string, format: date-time }
        resolved_at: { type: string, format: date-time, nullable: true }
        resolved_by: { type: string, nullable: true }
        resolution_note: { type: string, nullable: true }
        compensating_posting_id: { type: string, nullable: true }
    Payout:
      type: object
      properties:
        id: { type: string, format: uuid }
        payee_type: { type: string }
        payee_id: { type: string, format: uuid }
        amount_minor: { type: integer }
        currency: { type: string }
        destination: { $ref: "#/components/schemas/BankAccount" }
        status: { type: string, enum: [pending, processing, paid, failed] }
        provider_reference: { type: string, nullable: true }
        paid_at: { type: string, format: date-time, nullable: true }
    SavedMethod:
      type: object
      properties:
        id: { type: string, format: uuid }
        provider: { type: string }
        brand: { type: string }
        last4: { type: string }
        expiry_month: { type: integer }
        expiry_year: { type: integer }
        label: { type: string }
        default: { type: boolean }
        created_at: { type: string, format: date-time }
    Subscription:
      type: object
      properties:
        id: { type: string, format: uuid }
        plan: { type: string }
        amount_minor: { type: integer }
        currency: { type: string }
        interval: { type: string, enum: [weekly, monthly] }
        status: { type: string, enum: [active, past_due, cancelled] }
        next_billing_at: { type: string, format: date-time }
    FinancialReport:
      type: object
