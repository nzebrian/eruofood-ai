                type: object
                properties:
                  data: { type: array, items: { $ref: "#/components/schemas/SettlementRun" } }
                  meta: { $ref: "#/components/schemas/PageMeta" }
    post:
      tags: [Payments Admin]
      summary: Compute a draft settlement run (requires finance.settle)
      description: >-
        Takes a merchant and a window, and nothing else. There is deliberately
        no amount field: the figure is derived from the merchant's unsettled
        accruals, which is what makes it reviewable. The draft reserves those
        accruals and moves no money.
      security: [{ bearerAuth: [] }]
      parameters:
        - { name: Idempotency-Key, in: header, required: false, schema: { type: string } }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [merchant_type, merchant_id, window_start, window_end]
              properties:
                merchant_type: { type: string, enum: [vendor, restaurant, driver] }
                merchant_id: { type: string, format: uuid }
                window_start: { type: string, format: date-time }
                window_end: { type: string, format: date-time }
      responses:
        "201":
          description: The draft run.
          content:
            application/json:
              schema: { type: object, properties: { data: { $ref: "#/components/schemas/SettlementRun" } } }
        "409": { $ref: "#/components/responses/IdempotencyInFlight" }
  /v1/payments/admin/settlement-runs/{id}:
    get:
      tags: [Payments Admin]
      summary: One settlement run with its payout attempts (requires finance.read)
      security: [{ bearerAuth: [] }]
      parameters:
        - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
      responses:
        "200":
          description: The run, its attempts and its line count.
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: object
                    properties:
                      run: { $ref: "#/components/schemas/SettlementRun" }
                      attempts: { type: array, items: { $ref: "#/components/schemas/PayoutAttempt" } }
                      lines: { type: integer }
        "404": { $ref: "#/components/responses/Error" }
  /v1/payments/admin/settlement-runs/{id}/approve:
    post:
      tags: [Payments Admin]
      summary: Approve a draft settlement run (requires finance.settle)
      description: >-
        The approver is recorded, and the domain refuses to let the same person
        execute what they approved.
      security: [{ bearerAuth: [] }]
      parameters:
        - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              properties:
                reason: { type: string, maxLength: 255 }
      responses:
        "200":
          description: The approved run.
          content:
            application/json:
              schema: { type: object, properties: { data: { $ref: "#/components/schemas/SettlementRun" } } }
  /v1/payments/admin/settlement-runs/{id}/cancel:
    post:
      tags: [Payments Admin]
      summary: Cancel a settlement run and release its accruals (requires finance.settle)
      security: [{ bearerAuth: [] }]
      parameters:
        - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              properties:
                reason: { type: string, maxLength: 255 }
      responses:
        "200":
          description: The cancelled run.
          content:
            application/json:
              schema: { type: object, properties: { data: { $ref: "#/components/schemas/SettlementRun" } } }
  /v1/payments/admin/settlement-runs/{id}/execute:
    post:
      tags: [Payments Admin]
      summary: Move the money (requires finance.payout)
      description: >-
        Omit `bank` to credit the merchant's wallet, which is an internal
        movement that commits atomically. Supply `bank` to transfer through the
        provider, in which case the outcome may be `unknown` — meaning the
        transfer was dispatched and no answer came back. An unknown run must be
        reconciled; it cannot be retried.
      security: [{ bearerAuth: [] }]
      parameters:
        - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              properties:
                bank: { $ref: "#/components/schemas/BankAccount" }
      responses:
        "200":
          description: The run after the attempt, in whatever state it reached.
          content:
            application/json:
              schema: { type: object, properties: { data: { $ref: "#/components/schemas/SettlementRun" } } }
  /v1/payments/admin/settlement-runs/{id}/retry:
    post:
      tags: [Payments Admin]
      summary: Retry a failed settlement run (requires finance.payout)
      description: >-
        Only a run the provider explicitly declined may be retried. A run whose
        outcome is unknown is refused, because retrying it could pay the
        merchant twice. The retry creates a new payout attempt with a new
        idempotency key; it never resets the old one.
      security: [{ bearerAuth: [] }]
      parameters:
        - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              properties:
                reason: { type: string, maxLength: 255 }
      responses:
        "200":
          description: The run, reopened as pending.
          content:
            application/json:
              schema: { type: object, properties: { data: { $ref: "#/components/schemas/SettlementRun" } } }
  /v1/payments/admin/settlement-runs/{id}/reconcile:
    post:
      tags: [Payments Admin]
      summary: Ask the provider what happened to this run (requires finance.reconcile)
      security: [{ bearerAuth: [] }]
      parameters:
        - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
      responses:
        "200":
          description: The run after reconciliation.
          content:
            application/json:
              schema: { type: object, properties: { data: { $ref: "#/components/schemas/SettlementRun" } } }
  /v1/payments/admin/settlement-runs/{id}/reverse:
    post:
      tags: [Payments Admin]
      summary: Reverse a completed settlement (requires finance.reverse — SuperAdmin only)
      description: >-
        Posts compensating ledger entries. The original posting is never edited.
      security: [{ bearerAuth: [] }]
      parameters:
        - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [reason]
              properties:
                reason: { type: string, minLength: 3, maxLength: 255 }
      responses:
        "200":
          description: The reversed run.
          content:
            application/json:
              schema: { type: object, properties: { data: { $ref: "#/components/schemas/SettlementRun" } } }
  /v1/payments/admin/reconciliation-cases:
    get:
      tags: [Payments Admin]
      summary: The discrepancy queue (requires finance.reconcile)
      security: [{ bearerAuth: [] }]
      parameters:
        - { name: state, in: query, schema: { $ref: "#/components/schemas/ReconciliationState" } }
        - { name: page, in: query, schema: { type: integer, minimum: 1 } }
        - { name: per_page, in: query, schema: { type: integer, minimum: 1, maximum: 100 } }
      responses:
        "200":
          description: A page of reconciliation cases.
          content:
            application/json:
              schema:
                type: object
                properties:
                  data: { type: array, items: { $ref: "#/components/schemas/ReconciliationCase" } }
                  meta: { $ref: "#/components/schemas/PageMeta" }
  /v1/payments/admin/reconciliation-cases/{id}:
    get:
      tags: [Payments Admin]
      summary: One reconciliation case (requires finance.reconcile)
      security: [{ bearerAuth: [] }]
      parameters:
        - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
      responses:
        "200":
          description: The case.
          content:
            application/json:
              schema: { type: object, properties: { data: { $ref: "#/components/schemas/ReconciliationCase" } } }
        "404": { $ref: "#/components/responses/Error" }
  /v1/payments/admin/reconciliation-cases/{id}/investigate:
    post:
      tags: [Payments Admin]
      summary: Take a case on (requires finance.reconcile)
      security: [{ bearerAuth: [] }]
      parameters:
        - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
      responses:
        "200":
          description: The case, under investigation.
          content:
            application/json:
              schema: { type: object, properties: { data: { $ref: "#/components/schemas/ReconciliationCase" } } }
  /v1/payments/admin/reconciliation-cases/{id}/escalate:
    post:
      tags: [Payments Admin]
      summary: Escalate a case (requires finance.reconcile)
      security: [{ bearerAuth: [] }]
      parameters:
        - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [note]
              properties:
                note: { type: string, minLength: 3, maxLength: 500 }
      responses:
        "200":
          description: The escalated case.
          content:
            application/json:
              schema: { type: object, properties: { data: { $ref: "#/components/schemas/ReconciliationCase" } } }
  /v1/payments/admin/reconciliation-cases/{id}/resolve:
    post:
      tags: [Payments Admin]
      summary: Close a case (requires finance.adjust — SuperAdmin only)
      description: >-
        `matched` records that the two sides agree after all. `adjusted` records
        that the books were wrong, and requires the correlation id of a
        compensating ledger posting that already exists — a case cannot be
        closed by writing a note.
      security: [{ bearerAuth: [] }]
      parameters:
        - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [resolution, note]
              properties:
                resolution: { type: string, enum: [matched, adjusted] }
                note: { type: string, minLength: 3, maxLength: 500 }
                compensating_posting_id: { type: string, maxLength: 64 }
      responses:
        "200":
          description: The resolved case.
          content:
            application/json:
              schema: { type: object, properties: { data: { $ref: "#/components/schemas/ReconciliationCase" } } }
  /v1/payments/admin/providers:
    get:
      tags: [Payments Admin]
      summary: Enabled payment providers (RBAC)
      security: [{ bearerAuth: [] }]
      responses:
        "200":
          description: The enabled providers, default first.
          content:
            application/json:
              schema: { type: object, properties: { data: { type: object, properties: { providers: { type: array, items: { type: string } } } } } }

