            application/json:
              schema: { type: object, properties: { data: { $ref: "#/components/schemas/NotificationPreference" } } }
    put:
      tags: [Notifications]
      summary: Update language / frequency
      security: [{ bearerAuth: [] }]
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                language: { type: string }
                max_per_day: { type: integer }
      responses:
        "200":
          description: The preferences.
          content:
            application/json:
              schema: { type: object, properties: { data: { $ref: "#/components/schemas/NotificationPreference" } } }
  /v1/notifications/preferences/channels:
    put:
      tags: [Notifications]
