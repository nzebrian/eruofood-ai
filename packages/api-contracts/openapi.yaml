    get:
      tags: [Public API]
      summary: Search (scope search:read)
      description: Runs over public content only. Supports `q`, `type`, `sort`, `filter[...]` and pagination.
      security: [{ apiKeyAuth: [] }]
      parameters:
        - { name: q, in: query, required: false, schema: { type: string } }
        - { name: type, in: query, required: false, schema: { type: string, enum: [global, recipe, food, ingredient, restaurant, vendor, product, category] } }
        - { name: sort, in: query, required: false, schema: { type: string } }
        - { name: page, in: query, required: false, schema: { type: integer } }
        - { name: per_page, in: query, required: false, schema: { type: integer, maximum: 100 } }
      responses:
        "200":
          description: Search results.
          content:
            application/json:
              schema: { type: object, properties: { data: { $ref: "#/components/schemas/PublicSearchResults" } } }
        "403": { $ref: "#/components/responses/Error" }
