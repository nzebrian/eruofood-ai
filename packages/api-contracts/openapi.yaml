openapi: 3.0.3
info:
  title: EruoFood AI API
  version: 0.17.0
  description: >
    Contract-first REST API for EruoFood AI. This specification is the single
    source of truth for the API surface; TypeScript (web) and Dart (mobile)
    types are generated from it so clients and server never drift
    (MASTER_PLAN.md §6.1). Milestone 11 adds the Platform Administration, CMS &
    Operations endpoints (RBAC accounts & permissions, impersonation, CMS
    pages/banners/FAQ, system configuration & feature flags, user
    administration, vendor operations, the support centre and the audit trail).
  license:
    name: Proprietary
servers:
  - url: http://localhost:8080/api/v1
    description: Local (through the Nginx edge)
  - url: https://api.eruofood.ai/v1
    description: Production

tags:
  - name: Platform
    description: Operational and health endpoints.
  - name: Authentication
    description: Registration, login, tokens, verification, password reset.
  - name: Two-Factor
    description: TOTP two-factor enrolment and management.
  - name: Profile
    description: The authenticated user's own account.
  - name: Sessions
    description: Active session (refresh-token) management.
  - name: Admin
    description: Administrative user & role management (RBAC).
  - name: Foods
    description: Nigerian food database — browse, search, detail.
  - name: Recipes
    description: Recipes — browse, detail, CRUD, reviews, favourites, versions.
  - name: Catalog Admin
    description: Admin management of foods, categories, and ingredients.
  - name: AI
    description: AI-powered recipe generation, cooking assistant, chat history and usage.
  - name: AI Admin
    description: Admin management of the versioned prompt system (RBAC).
  - name: Nutrition
    description: Health profiles, calculators, food diary, meal plans, progress and AI personalisation.
  - name: Nutrition Admin
    description: Admin management of the nutrition database (RBAC).
  - name: Marketplace
    description: Restaurants/vendors, menus, cart, checkout, orders, delivery and riders.
  - name: Marketplace Admin
    description: Admin vendor verification & moderation (RBAC).
  - name: Commerce
    description: General e-commerce & grocery — stores, products, cart, wishlist, checkout, orders, returns, promotions and the AI shopping assistant.
  - name: Commerce Admin
    description: Admin store/product moderation, inventory, promotions, coupons and returns (RBAC).
  - name: Payments
    description: Payments, wallets, refunds, saved methods, subscriptions and provider webhooks.
  - name: Payments Admin
    description: Admin transactions dashboard, refunds, settlements, payouts, financial reports and provider management (RBAC).
  - name: Notifications
    description: In-app notification centre, preferences, chat/messaging and real-time presence.
  - name: Notifications Admin
    description: Admin broadcast/campaign manager, notification templates and delivery reports (RBAC).
  - name: Analytics
    description: Business-intelligence dashboards, KPIs, reports and exports (admin), plus scoped vendor/restaurant dashboards. Data is collected from domain events — never written directly.
  - name: Platform Administration
    description: Back-office RBAC accounts & permissions, impersonation, CMS, system configuration & feature flags, user administration, vendor operations, the support centre and the audit trail. Communicates with other contexts through application services and domain events.
  - name: Search
    description: Global & typed search, autocomplete/suggestions/trending, faceted filtering, ranked results (full-text + pgvector semantic), the recommendation engine, saved & recent searches, and admin search analytics. The one place discovery happens — no business module searches its own tables; they publish events and Search indexes documents.
  - name: Support
    description: Customer Support, Helpdesk & CRM — tickets with SLA/escalation/merge, the customer portal and agent workspace, a knowledge base, the CRM (profiles, timeline, insights, segmentation), automation rules, CSAT and admin dashboards. The one place support happens — no business module manages tickets; the CRM is built from published domain events.
  - name: Reviews
    description: Reviews & Ratings — polymorphic subject reviews (product/food/recipe/vendor/restaurant/rider) with 1–5 stars, verified-purchase (from order events), a moderation queue with content filtering, helpfulness voting, subject-owner responses, the authoritative per-subject rating summary, and review analytics. The one place ratings are computed — no business module stores or aggregates its own reviews; ratings flow out via the published rating-summary event.
  - name: Loyalty
    description: Loyalty, Rewards & Referrals — a points ledger with a running balance, membership tiers (recomputed on change), a redeemable rewards catalogue, referral codes with fraud guards, points expiry, and admin adjustments/analytics. The one place points are awarded and computed — no business module awards or stores its own points; points are earned from published order/review events, and tiers/vouchers flow out via published events.
  - name: Public API
    description: The controlled external-facing API at /api/public/v1 — a separate surface from the internal APIs. Authenticated by API keys (not JWT), scoped, rate-limited and quota-governed, versioned, and returned through a standard envelope. It exposes transformed resources only; no internal endpoint is proxied. Adding v2 later is additive and leaves v1 untouched.
  - name: Verification
    description: >-
      KYC / KYB and progressive identity assurance. Provider-abstracted: Didit is
      the initial identity provider and Nigeria's CAC the initial business
      registry, both behind provider-neutral ports, so a new market or provider
      is configuration plus an adapter. Customers are never forced through KYC to
      register or order — assurance is asked for at the operation that needs it.
      Riders must complete identity verification; restaurants and groceries must
      complete KYB. Enforcement of those requirements is a separate switch,
      shipped off, so an existing population can verify before any gate closes.
      Regulated identity data is returned by exactly one endpoint, behind its own
      permission, and every read of it — granted or denied, whoever made it —
      writes an immutable audit event.
  - name: Developer Platform
    description: The developer portal management API at /api/v1/developer (internal, JWT-authenticated) — developer accounts, applications (scope-grant boundary), API keys (hashed secrets, rotation, revocation, expiry), webhooks (signed, retried, idempotent) and usage. API keys are never accepted here.

security:
  - bearerAuth: []

paths:
  /health:
    get:
      tags: [Platform]
      operationId: getHealth
      summary: Platform health/status
      security: []
      responses:
        "200":
          description: The platform is responding.
          content:
            application/json:
              schema:
                type: object
                properties:
                  data: { $ref: "#/components/schemas/SystemStatus" }

  # ---- Authentication ------------------------------------------------------
  /auth/register:
    post:
      tags: [Authentication]
      operationId: register
      summary: Register a new user (email + password)
      description: Creates an account, sends a verification email, and returns tokens.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/RegisterRequest" }
      responses:
        "201": { $ref: "#/components/responses/AuthSuccess" }
        "409": { $ref: "#/components/responses/Error" }
        "422": { $ref: "#/components/responses/Error" }

  /auth/login:
    post:
      tags: [Authentication]
      operationId: login
      summary: Log in with email + password
      description: Returns tokens, or a two-factor challenge if 2FA is enabled.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/LoginRequest" }
      responses:
        "200": { $ref: "#/components/responses/AuthSuccessOrChallenge" }
        "401": { $ref: "#/components/responses/Error" }

  /auth/login/two-factor:
    post:
      tags: [Authentication]
      operationId: loginTwoFactor
      summary: Complete a two-factor login challenge
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [challenge_token, code]
              properties:
                challenge_token: { type: string }
                code: { type: string, example: "123456" }
      responses:
        "200": { $ref: "#/components/responses/AuthSuccess" }
        "401": { $ref: "#/components/responses/Error" }

  /auth/login/social:
    post:
      tags: [Authentication]
      operationId: loginSocial
      summary: Log in with a social provider (Google; Apple architecture-ready)
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [provider, id_token]
              properties:
                provider: { type: string, enum: [google, apple] }
                id_token: { type: string }
      responses:
        "200": { $ref: "#/components/responses/AuthSuccess" }
        "401": { $ref: "#/components/responses/Error" }

  /auth/refresh:
    post:
      tags: [Authentication]
      operationId: refresh
      summary: Exchange a refresh token for a new access token (rotates the refresh token)
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [refresh_token]
              properties:
                refresh_token: { type: string }
      responses:
        "200":
          description: New token pair.
          content:
            application/json:
              schema:
                type: object
                properties:
                  data: { $ref: "#/components/schemas/Tokens" }
        "401": { $ref: "#/components/responses/Error" }

  /auth/logout:
    post:
      tags: [Authentication]
      operationId: logout
      summary: Revoke the current refresh token (end the session)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [refresh_token]
              properties:
                refresh_token: { type: string }
      responses:
        "204": { description: Logged out. }

  /auth/email/verify:
    post:
      tags: [Authentication]
      operationId: verifyEmail
      summary: Verify an email address using the emailed token
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [uid, token]
              properties:
                uid: { type: string, format: uuid }
                token: { type: string }
      responses:
        "200": { $ref: "#/components/responses/Message" }

  /auth/email/resend:
    post:
      tags: [Authentication]
      operationId: resendVerification
      summary: Resend the email-verification message
      responses:
        "202": { $ref: "#/components/responses/Message" }

  /auth/password/forgot:
    post:
      tags: [Authentication]
      operationId: forgotPassword
      summary: Request a password-reset link
      description: Always returns 202 to avoid account enumeration.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [email]
              properties:
                email: { type: string, format: email }
      responses:
        "202": { $ref: "#/components/responses/Message" }

  /auth/password/reset:
    post:
      tags: [Authentication]
      operationId: resetPassword
      summary: Reset the password using the emailed token
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/ResetPasswordRequest" }
      responses:
        "200": { $ref: "#/components/responses/Message" }
        "401": { $ref: "#/components/responses/Error" }

  # ---- Profile -------------------------------------------------------------
  /me:
    get:
      tags: [Profile]
      operationId: getProfile
      summary: Get the authenticated user's profile
      responses:
        "200": { $ref: "#/components/responses/User" }
        "401": { $ref: "#/components/responses/Error" }
    put:
      tags: [Profile]
      operationId: updateProfile
      summary: Update name and phone
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [name]
              properties:
                name: { type: string }
                phone: { type: string, nullable: true, example: "+2348012345678" }
      responses:
        "200": { $ref: "#/components/responses/User" }
    delete:
      tags: [Profile]
      operationId: deleteAccount
      summary: Soft-delete the authenticated account
      responses:
        "204": { description: Account deleted. }

  /me/password:
    put:
      tags: [Profile]
      operationId: changePassword
      summary: Change the password (requires the current password)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [current_password, password, password_confirmation]
              properties:
                current_password: { type: string }
                password: { type: string }
                password_confirmation: { type: string }
      responses:
        "200": { $ref: "#/components/responses/Message" }
        "401": { $ref: "#/components/responses/Error" }

  /me/preferences:
    put:
      tags: [Profile]
      operationId: updatePreferences
      summary: Update the user's preferences (free-form JSON object)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [preferences]
              properties:
                preferences: { type: object, additionalProperties: true }
      responses:
        "200": { $ref: "#/components/responses/User" }

  /me/avatar:
    post:
      tags: [Profile]
      operationId: uploadAvatar
      summary: Upload a profile photo
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required: [avatar]
              properties:
                avatar: { type: string, format: binary }
      responses:
        "200": { $ref: "#/components/responses/User" }

  /me/two-factor/enable:
    post:
      tags: [Two-Factor]
      operationId: enableTwoFactor
      summary: Begin 2FA enrolment (returns secret, provisioning URI, recovery codes)
      responses:
        "200":
          description: Enrolment details.
          content:
            application/json:
              schema:
                type: object
                properties:
                  data: { $ref: "#/components/schemas/TwoFactorEnrollment" }

  /me/two-factor/confirm:
    post:
      tags: [Two-Factor]
      operationId: confirmTwoFactor
      summary: Confirm 2FA with the first TOTP code
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [code]
              properties:
                code: { type: string }
      responses:
        "200": { $ref: "#/components/responses/Message" }
        "401": { $ref: "#/components/responses/Error" }

  /me/two-factor:
    delete:
      tags: [Two-Factor]
      operationId: disableTwoFactor
      summary: Disable 2FA (requires the account password)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [password]
              properties:
                password: { type: string }
      responses:
        "200": { $ref: "#/components/responses/Message" }

  # ---- Sessions ------------------------------------------------------------
  /me/sessions:
    get:
      tags: [Sessions]
      operationId: listSessions
      summary: List active sessions (devices)
      responses:
        "200":
          description: Active sessions.
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items: { $ref: "#/components/schemas/Session" }

  /me/sessions/{sessionId}:
    delete:
      tags: [Sessions]
      operationId: revokeSession
      summary: Revoke a specific session
      parameters:
        - name: sessionId
          in: path
          required: true
          schema: { type: string, format: uuid }
      responses:
        "204": { description: Session revoked. }

  # ---- Admin ---------------------------------------------------------------
  /v1/admin/rbac/users:
    get:
      tags: [Admin]
      operationId: listUsersForRbac
      summary: List users for role management (admin only)
      parameters:
        - { name: page, in: query, schema: { type: integer, default: 1 } }
        - { name: per_page, in: query, schema: { type: integer, default: 20 } }
      responses:
        "200":
          description: Paginated users.
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items: { $ref: "#/components/schemas/User" }
                  meta: { $ref: "#/components/schemas/PageMeta" }
        "403": { $ref: "#/components/responses/Error" }

  /v1/admin/rbac/users/{userId}/roles:
    post:
      tags: [Admin]
      operationId: assignRole
      summary: Assign a role to a user (admin only)
      parameters:
        - { name: userId, in: path, required: true, schema: { type: string, format: uuid } }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [role]
              properties:
                role: { type: string, enum: [admin, moderator, user] }
      responses:
        "200": { $ref: "#/components/responses/User" }
    delete:
      tags: [Admin]
      operationId: revokeRole
      summary: Revoke a role from a user (admin only)
      parameters:
        - { name: userId, in: path, required: true, schema: { type: string, format: uuid } }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [role]
              properties:
                role: { type: string, enum: [admin, moderator, user] }
      responses:
        "200": { $ref: "#/components/responses/User" }

  # ---- Catalog: categories & ingredients (public) --------------------------
  /categories:
    get:
      tags: [Foods]
      operationId: listCategories
      summary: List food categories
      security: []
      responses:
        "200":
          description: Categories.
          content:
            application/json:
              schema:
                type: object
                properties:
                  data: { type: array, items: { $ref: "#/components/schemas/Category" } }

  /ingredients:
    get:
      tags: [Foods]
      operationId: searchIngredients
      summary: Search ingredients
      security: []
      parameters:
        - { name: q, in: query, schema: { type: string } }
        - { name: page, in: query, schema: { type: integer, default: 1 } }
      responses:
        "200":
          description: Ingredients.
          content:
            application/json:
              schema:
                type: object
                properties:
                  data: { type: array, items: { $ref: "#/components/schemas/Ingredient" } }
                  meta: { $ref: "#/components/schemas/PageMeta" }

  # ---- Catalog: foods (public) --------------------------------------------
  /foods:
    get:
      tags: [Foods]
      operationId: searchFoods
      summary: Browse/search the food database
      security: []
      parameters:
        - { name: q, in: query, schema: { type: string }, description: Free-text name search. }
        - { name: category_id, in: query, schema: { type: string, format: uuid } }
        - { name: region, in: query, schema: { type: string, enum: [north_central, north_east, north_west, south_east, south_south, south_west, nationwide] } }
        - { name: state, in: query, schema: { type: string }, description: Nigerian state where the food is popular. }
        - { name: tag, in: query, schema: { type: string } }
        - { name: sort, in: query, schema: { type: string, enum: [name, recent] } }
        - { name: page, in: query, schema: { type: integer, default: 1 } }
      responses:
        "200":
          description: Paginated foods (summary shape).
          content:
            application/json:
              schema:
                type: object
                properties:
                  data: { type: array, items: { $ref: "#/components/schemas/FoodSummary" } }
                  meta: { $ref: "#/components/schemas/PageMeta" }

  /foods/{slug}:
    get:
      tags: [Foods]
      operationId: getFood
      summary: Food detail by slug
      security: []
      parameters:
        - { name: slug, in: path, required: true, schema: { type: string } }
      responses:
        "200":
          description: Food detail.
          content:
            application/json:
              schema:
                type: object
                properties: { data: { $ref: "#/components/schemas/Food" } }
        "404": { $ref: "#/components/responses/Error" }

  /foods/{foodId}/recipes:
    get:
      tags: [Recipes]
      operationId: recipesForFood
      summary: Recipes for a food
      security: []
      parameters:
        - { name: foodId, in: path, required: true, schema: { type: string, format: uuid } }
      responses:
        "200":
          description: Paginated recipes (summary).
          content:
            application/json:
              schema:
                type: object
                properties:
                  data: { type: array, items: { $ref: "#/components/schemas/RecipeSummary" } }
                  meta: { $ref: "#/components/schemas/PageMeta" }

  # ---- Catalog: recipes ----------------------------------------------------
  /recipes:
    get:
      tags: [Recipes]
      operationId: searchRecipes
      summary: Browse/search recipes
      security: []
      parameters:
        - { name: q, in: query, schema: { type: string } }
        - { name: food_id, in: query, schema: { type: string, format: uuid } }
        - { name: difficulty, in: query, schema: { type: string, enum: [easy, medium, hard] } }
        - { name: tag, in: query, schema: { type: string } }
        - { name: max_minutes, in: query, schema: { type: integer } }
        - { name: sort, in: query, schema: { type: string, enum: [recent, rating, quick] } }
      responses:
        "200":
          description: Paginated recipes (summary).
          content:
            application/json:
              schema:
                type: object
                properties:
                  data: { type: array, items: { $ref: "#/components/schemas/RecipeSummary" } }
                  meta: { $ref: "#/components/schemas/PageMeta" }
    post:
      tags: [Recipes]
      operationId: createRecipe
      summary: Create a recipe (authenticated)
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/RecipeInput" }
      responses:
        "201":
          description: Created recipe.
          content:
            application/json:
              schema:
                type: object
                properties: { data: { $ref: "#/components/schemas/Recipe" } }

  /recipes/{id}:
    get:
      tags: [Recipes]
      operationId: getRecipe
      summary: Recipe detail (by slug or id)
      description: The public detail endpoint resolves the path segment as a recipe slug or id.
      security: []
      parameters:
        - { name: id, in: path, required: true, schema: { type: string }, description: "Recipe slug or id." }
      responses:
        "200":
          description: Recipe detail.
          content:
            application/json:
              schema:
                type: object
                properties: { data: { $ref: "#/components/schemas/Recipe" } }
        "404": { $ref: "#/components/responses/Error" }
    put:
      tags: [Recipes]
      operationId: updateRecipe
      summary: Update a recipe (owner or admin; bumps version)
      parameters:
        - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/RecipeInput" }
      responses:
        "200":
          description: Updated recipe.
          content:
            application/json:
              schema:
                type: object
                properties: { data: { $ref: "#/components/schemas/Recipe" } }
        "403": { $ref: "#/components/responses/Error" }
    delete:
      tags: [Recipes]
      operationId: deleteRecipe
      summary: Delete a recipe (owner or admin)
      parameters:
        - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
      responses:
        "204": { description: Deleted. }

  /recipes/{id}/related:
    get:
      tags: [Recipes]
      operationId: relatedRecipes
      summary: Related recipes
      security: []
      parameters:
        - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
      responses:
        "200":
          description: Related recipes (summary).
          content:
            application/json:
              schema:
                type: object
                properties:
                  data: { type: array, items: { $ref: "#/components/schemas/RecipeSummary" } }

  /recipes/{id}/reviews:
    get:
      tags: [Recipes]
      operationId: listRecipeReviews
      summary: List a recipe's reviews
      security: []
      parameters:
        - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
      responses:
        "200":
          description: Paginated reviews.
          content:
            application/json:
              schema:
                type: object
                properties:
                  data: { type: array, items: { $ref: "#/components/schemas/RecipeReview" } }
                  meta: { $ref: "#/components/schemas/PageMeta" }
    post:
      tags: [Recipes]
      operationId: submitRecipeReview
      summary: Submit/update a rating & review (authenticated)
      parameters:
        - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [rating]
              properties:
                rating: { type: integer, minimum: 1, maximum: 5 }
                comment: { type: string, nullable: true }
      responses:
        "201":
          description: Saved review.
          content:
            application/json:
              schema:
                type: object
                properties: { data: { $ref: "#/components/schemas/RecipeReview" } }

  /recipes/{id}/versions:
    get:
      tags: [Recipes]
      operationId: recipeVersions
      summary: Recipe version history
      security: []
      parameters:
        - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
      responses:
        "200":
          description: Version snapshots (newest first).
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items:
                      type: object
                      properties:
                        version: { type: integer }
                        snapshot: { type: object, additionalProperties: true }
                        created_at: { type: string, format: date-time }

  # ---- Favourites (authenticated) -----------------------------------------
  /me/favourites:
    get:
      tags: [Recipes]
      operationId: listFavourites
      summary: List the user's favourite recipes
      responses:
        "200":
          description: Paginated favourite recipes.
