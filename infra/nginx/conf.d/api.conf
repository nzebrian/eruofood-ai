# EruoFood AI — Nginx server block for the Laravel API (proxies to PHP-FPM)

server {
    listen 80;
    server_name _;
    root /var/www/html/public;
    index index.php;

    charset utf-8;

    # Resolve the php-fpm upstream at REQUEST time via Docker's embedded DNS
    # (127.0.0.11), re-checking every 10s. A static `upstream { server api:9000; }`
    # block resolves the hostname ONCE at nginx startup and caches that IP
    # forever; when the api container is restarted/recreated it can come back on a
    # new IP, and nginx keeps dialing the stale address → permanent 502
    # (connection refused). Resolving through a variable makes nginx follow the
    # container's current IP, so restart-recovery works without cycling nginx.
    resolver 127.0.0.11 valid=10s ipv6=off;

    # Health/status endpoints handled by the app
    location = /favicon.ico { access_log off; log_not_found off; }
    location = /robots.txt  { access_log off; log_not_found off; }

    # Per-route rate limiting is enforced in the app (Redis); Nginx adds a
    # coarse connection-level safety net in production via the http{} zone.

    location / {
        try_files $uri $uri/ /index.php?$query_string;
    }

    location ~ \.php$ {
        # Variable (not a literal/upstream name) forces per-request DNS resolution
        # through the `resolver` above, so a restarted api container's new IP is
        # picked up instead of a cached stale one.
        set $php_fpm_upstream api:9000;
        fastcgi_pass $php_fpm_upstream;
        fastcgi_index index.php;
        include fastcgi_params;
        # nginx and php-fpm are SEPARATE containers: the application code lives on
        # the php-fpm (api) container, not here. $realpath_root would resolve the
        # docroot against nginx's own filesystem (where the code is absent) and
        # hand php-fpm a path it cannot open. Use a literal docroot that is valid
        # inside the api container instead.
        fastcgi_param SCRIPT_FILENAME /var/www/html/public$fastcgi_script_name;
        fastcgi_param DOCUMENT_ROOT   /var/www/html/public;
        fastcgi_hide_header X-Powered-By;
        fastcgi_read_timeout 60s;
    }

    # Deny access to hidden and sensitive files
    location ~ /\.(?!well-known).* { deny all; }
    location ~* \.(env|log|neon|lock)$ { deny all; }
}
