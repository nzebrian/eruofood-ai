# EruoFood AI — Nginx server block for the Laravel API (proxies to PHP-FPM)
upstream php_fpm {
    server api:9000;
}

server {
    listen 80;
    server_name _;
    root /var/www/html/public;
    index index.php;

    charset utf-8;

    # Health/status endpoints handled by the app
    location = /favicon.ico { access_log off; log_not_found off; }
    location = /robots.txt  { access_log off; log_not_found off; }

    # Per-route rate limiting is enforced in the app (Redis); Nginx adds a
    # coarse connection-level safety net in production via the http{} zone.

    location / {
        try_files $uri $uri/ /index.php?$query_string;
    }

    location ~ \.php$ {
        fastcgi_pass php_fpm;
        fastcgi_index index.php;
        include fastcgi_params;
        fastcgi_param SCRIPT_FILENAME $realpath_root$fastcgi_script_name;
        fastcgi_param DOCUMENT_ROOT   $realpath_root;
        fastcgi_hide_header X-Powered-By;
        fastcgi_read_timeout 60s;
    }

    # Deny access to hidden and sensitive files
    location ~ /\.(?!well-known).* { deny all; }
    location ~* \.(env|log|neon|lock)$ { deny all; }
}
