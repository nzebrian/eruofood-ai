# EruoFood AI — Redis configuration (cache / queue / session / pub-sub)
# Persistence: AOF for durability of queued jobs; RDB snapshots as backup.
appendonly yes
appendfsync everysec

# Bound memory and evict least-recently-used keys when full (cache safety)
maxmemory 512mb
maxmemory-policy allkeys-lru

# Disable dangerous commands in shared environments
rename-command FLUSHALL ""
rename-command FLUSHDB ""

# Networking (password is injected via command-line in compose when set)
tcp-keepalive 60
timeout 0
