; EruoFood AI — PHP-FPM pool configuration
[www]
user = app
group = app

listen = 9000
listen.backlog = 511

; Dynamic process manager — tune per container CPU/memory budget
pm = dynamic
pm.max_children = 40
pm.start_servers = 6
pm.min_spare_servers = 4
pm.max_spare_servers = 12
pm.max_requests = 500          ; recycle workers to bound memory leaks

; Expose a status/ping endpoint for readiness probes (internal only)
pm.status_path = /fpm-status
ping.path = /fpm-ping

; Send worker output to the container log stream
catch_workers_output = yes
decorate_workers_output = no
clear_env = no
