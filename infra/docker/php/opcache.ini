; EruoFood AI — OPcache + JIT tuning for PHP 8.4 (production)
[opcache]
opcache.enable = 1
opcache.enable_cli = 0
opcache.memory_consumption = 256
opcache.interned_strings_buffer = 32
opcache.max_accelerated_files = 20000
opcache.validate_timestamps = 0          ; set to 1 in dev via override
opcache.revalidate_freq = 0
opcache.save_comments = 1                 ; Laravel/attributes need docblocks
opcache.fast_shutdown = 1

; JIT (PHP 8.4) — tracing JIT for hot code paths
opcache.jit = tracing
opcache.jit_buffer_size = 128M
