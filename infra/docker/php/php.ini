; EruoFood AI — production-oriented PHP settings
memory_limit = 256M
max_execution_time = 60
upload_max_filesize = 20M
post_max_size = 24M
max_input_vars = 3000
expose_php = Off
date.timezone = Africa/Lagos

; Errors go to stderr (captured by the container runtime), never to the client
display_errors = Off
display_startup_errors = Off
log_errors = On
error_log = /dev/stderr

; Sane defaults for realpath cache under heavy autoloading
realpath_cache_size = 4096K
realpath_cache_ttl = 600
