name: eruofood
description: "EruoFood AI — Flutter mobile client (Clean Architecture, feature-first)."
publish_to: "none"
version: 0.1.0+1

environment:
  sdk: ">=3.5.0 <4.0.0"
  flutter: ">=3.24.0"

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  # Dependency injection (service locator) — wires ports to adapters.
  get_it: ^9.2.1
  # State management for the presentation layer.
  flutter_bloc: ^8.1.6
  equatable: ^2.0.5
  # Networking client for the REST API.
  dio: ^5.7.0
  # Functional error handling in the domain/application layers.
  dartz: ^0.10.1
  # Runtime configuration from a bundled .env file.
  flutter_dotenv: ^5.1.0
  # Secure token storage (Keychain / Keystore).
  flutter_secure_storage: ^9.2.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0
  bloc_test: ^9.1.7
  mocktail: ^1.0.4

flutter:
  uses-material-design: true
  assets:
    - .env
